worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 30s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Cache-Control "no-store" always;
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend_origin http://backend:8080;

        location = /admin { return 308 /admin/; }
        location ^~ /admin/ {
            set $admin_origin http://admin-frontend:8080;
            proxy_pass $admin_origin$request_uri;
            proxy_set_header Host $http_host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
        }
        location = /admin/observability { return 308 /admin/$is_args$args; }
        location = /admin/observability/ { return 308 /admin/$is_args$args; }
        location = /admin/observability/metrics { return 308 /admin/metrics$is_args$args; }
        location = /admin/observability/metrics/ { return 308 /admin/metrics$is_args$args; }
        location = /admin/observability/logs { return 308 /admin/logs$is_args$args; }
        location = /admin/observability/logs/ { return 308 /admin/logs$is_args$args; }
        location = /admin/observability/events { return 308 /admin/events$is_args$args; }
        location = /admin/observability/events/ { return 308 /admin/events$is_args$args; }
        location = /admin/observability/exporters { return 308 /admin/plugins$is_args$args; }
        location = /admin/observability/exporters/ { return 308 /admin/plugins$is_args$args; }

        location = /frontend-health {
            access_log off;
            add_header Content-Type text/plain;
            return 204;
        }

        location = /health {
            proxy_pass $backend_origin$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $request_id always;
            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        location = /ready {
            proxy_pass $backend_origin$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $request_id always;
            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        location = /api/v1/exporter-plugins/install {
            client_max_body_size 65m;
            proxy_pass $backend_origin$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $request_id always;
            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;
            proxy_request_buffering on;
        }

        location = /api/v1/exporter-plugins/redis-exporter/update {
            client_max_body_size 65m;
            proxy_pass $backend_origin$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $request_id always;
            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;
            proxy_request_buffering on;
        }

        location = /api/v1/exporter-plugins/mysql-exporter/update {
            client_max_body_size 65m;
            proxy_pass $backend_origin$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $request_id always;
            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;
            proxy_request_buffering on;
        }

        location = /api/v1/exporter-plugins/rabbitmq-exporter/update {
            client_max_body_size 65m;
            proxy_pass $backend_origin$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $request_id always;
            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;
            proxy_request_buffering on;
        }

        location = /api/v1/exporter-plugins/kafka-exporter/update {
            client_max_body_size 65m;
            proxy_pass $backend_origin$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $request_id always;
            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;
            proxy_request_buffering on;
        }

        location = /api/v1/exporter-plugins/elasticsearch-exporter/update {
            client_max_body_size 65m;
            proxy_pass $backend_origin$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $request_id always;
            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;
            proxy_request_buffering on;
        }

        location = /api/v1/exporter-plugins/victoriametrics-exporter/update {
            client_max_body_size 65m;
            proxy_pass $backend_origin$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $request_id always;
            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;
            proxy_request_buffering on;
        }

        location ^~ /api/v1 {
            proxy_pass $backend_origin$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $request_id always;
            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;
            proxy_request_buffering on;
        }

        location ^~ /api/ {
            default_type application/json;
            add_header X-Request-ID $request_id always;
            return 404 '{"error":{"code":"not_found","message":"route not found","request_id":"$request_id"}}';
        }

        location ^~ /internal/ { return 404; }

        location ~ ^/(startup|live|ready|health)(/|$) { return 404; }

        error_page 502 503 504 = @upstream_error;
        location @upstream_error {
            default_type application/json;
            add_header X-Request-ID $request_id always;
            return 503 '{"error":{"code":"upstream_unavailable","message":"service unavailable","request_id":"$request_id"}}';
        }
        error_page 413 = @body_error;
        location @body_error {
            default_type application/json;
            add_header X-Request-ID $request_id always;
            return 413 '{"error":{"code":"payload_too_large","message":"request too large","request_id":"$request_id"}}';
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
