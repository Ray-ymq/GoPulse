worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 30s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        absolute_redirect off;
        root /usr/share/nginx/html;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Cache-Control "no-store" always;
        resolver 127.0.0.11 valid=5s ipv6=off;
        location = / { return 302 /admin/; }
        location = /admin { return 308 /admin/; }
        location = /login { return 302 /admin/login; }
        location = /posts { return 302 /admin/; }
        location = /admin/deployment.json {
            default_type application/json;
            return 200 '{"standaloneObservability":true}';
        }
        location /api/v1/ {
            set $platform_origin http://platform-api:8080;
            proxy_pass $platform_origin$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $request_id always;
            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;
        }
        location = /frontend-health { return 204; }
        location /admin/assets/ { try_files $uri =404; }
        location /admin/ { try_files $uri $uri/ /admin/index.html; }
        location / { return 404; }
    }
}
