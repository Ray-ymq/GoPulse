{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "namespace": "gopulse-business",
  "resources": [
    "namespace.json",
    "../../common",
    "../../business"
  ],
  "configMapGenerator": [
    {
      "name": "gopulse-identity",
      "literals": [
        "GOPULSE_VERSION=development",
        "GOPULSE_REVISION=development"
      ]
    }
  ],
  "generatorOptions": {
    "disableNameSuffixHash": true
  },
  "patches": [
    {
      "target": {
        "kind": "ConfigMap",
        "name": "backend-env"
      },
      "patch": "{\"apiVersion\": \"v1\", \"kind\": \"ConfigMap\", \"metadata\": {\"name\": \"backend-env\"}, \"data\": {\"LOG_MONITOR_URL\": \"\", \"ALERT_EVALUATION_ENABLED\": \"false\"}}"
    },
    {
      "target": {
        "kind": "ConfigMap",
        "name": "business-worker-env"
      },
      "patch": "{\"apiVersion\": \"v1\", \"kind\": \"ConfigMap\", \"metadata\": {\"name\": \"business-worker-env\"}, \"data\": {\"LOG_MONITOR_URL\": \"\", \"ALERT_EVALUATION_ENABLED\": \"false\"}}"
    },
    {
      "target": {
        "kind": "ConfigMap",
        "name": "search-indexer-env"
      },
      "patch": "{\"apiVersion\": \"v1\", \"kind\": \"ConfigMap\", \"metadata\": {\"name\": \"search-indexer-env\"}, \"data\": {\"LOG_MONITOR_URL\": \"\", \"ALERT_EVALUATION_ENABLED\": \"false\"}}"
    },
    {
      "target": {
        "kind": "ConfigMap",
        "name": "platform-api-env"
      },
      "patch": "{\"apiVersion\": \"v1\", \"kind\": \"ConfigMap\", \"metadata\": {\"name\": \"platform-api-env\"}, \"data\": {\"LOG_MONITOR_URL\": \"\", \"ALERT_EVALUATION_ENABLED\": \"false\"}}"
    },
    {
      "target": {
        "kind": "RoleBinding",
        "name": "gopulse-selfmonitor-control"
      },
      "patch": "[{\"op\": \"add\", \"path\": \"/subjects/0/namespace\", \"value\": \"gopulse-business\"}]"
    }
  ]
}
