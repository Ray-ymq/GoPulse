{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "namespace": "gopulse-all",
  "resources": [
    "namespace.json",
    "../../common",
    "../../business"
  ],
  "configMapGenerator": [
    {
      "name": "gopulse-identity",
      "literals": [
        "GOPULSE_VERSION=development",
        "GOPULSE_REVISION=development"
      ]
    }
  ],
  "generatorOptions": {
    "disableNameSuffixHash": true
  }
}
