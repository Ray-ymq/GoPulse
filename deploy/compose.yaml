  REDIS_EXPORTER_HTTP_PORT: 9121
  REDIS_EXPORTER_SCRAPE_TIMEOUT: ${REDIS_EXPORTER_SCRAPE_TIMEOUT:-2s}
  REDIS_EXPORTER_SHUTDOWN_TIMEOUT: ${REDIS_EXPORTER_SHUTDOWN_TIMEOUT:-5s}

services:
  mysql:
    image: mysql:8.4.0
    restart: on-failure:5
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - business
    healthcheck:
      test: [CMD, mysqladmin, ping, --host=127.0.0.1, --silent]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2.5-alpine
    restart: on-failure:5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    volumes:
      - redis_data:/data
    networks:
      - business
    healthcheck:
      test: [CMD, redis-cli, --no-auth-warning, --raw, ping]
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13.3-management-alpine
    restart: on-failure:5
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - business
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    restart: on-failure:5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - business
      - observability
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null']
      start_period: 30s
      interval: 5s
      timeout: 10s
      retries: 30

  migrate:
    image: gopulse/backend:${GOPULSE_IMAGE_TAG:?GOPULSE_IMAGE_TAG is required}
    pull_policy: never
    restart: "no"
    entrypoint: [/usr/local/bin/migrate]
    command: [up]
    environment: *mysql-environment
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - business

  search-init:
    image: gopulse/backend:${GOPULSE_IMAGE_TAG:?GOPULSE_IMAGE_TAG is required}
    pull_policy: never
    restart: "no"
    entrypoint: [/usr/local/bin/search-reindex]
    command: [--if-missing]
    environment: *search-init-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    networks:
      - business

  backend:
    image: gopulse/backend:${GOPULSE_IMAGE_TAG:?GOPULSE_IMAGE_TAG is required}
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
      target: backend
      args: *image-build-args
    restart: on-failure:5
    stop_grace_period: 15s
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      search-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - ${PUBLISHED_HOST:-127.0.0.1}:${HTTP_PORT:?HTTP_PORT is required}:8080
    networks:
      - edge
      - business
      - observability
    healthcheck:
      test: [CMD-SHELL, 'wget --quiet --output-document=- http://127.0.0.1:8080/health >/dev/null']
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 20

  business-worker:
    image: gopulse/business-worker:${GOPULSE_IMAGE_TAG:?GOPULSE_IMAGE_TAG is required}
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
      target: business-worker
      args: *image-build-args
    restart: on-failure:5
    stop_grace_period: 15s
    environment: *worker-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - business
      - observability

  search-indexer:
    image: gopulse/search-indexer:${GOPULSE_IMAGE_TAG:?GOPULSE_IMAGE_TAG is required}
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
      target: search-indexer
      args: *image-build-args
    restart: on-failure:5
    stop_grace_period: 15s
    environment: *indexer-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      search-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - business
      - observability

  frontend:
    image: gopulse/frontend:${GOPULSE_IMAGE_TAG:?GOPULSE_IMAGE_TAG is required}
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
      args: *image-build-args
    restart: on-failure:5
    stop_grace_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - ${PUBLISHED_HOST:-127.0.0.1}:${FRONTEND_PORT:?FRONTEND_PORT is required}:8080
    networks:
      - edge
    healthcheck:
      test: [CMD-SHELL, 'wget --quiet --output-document=/dev/null http://127.0.0.1:8080/frontend-health']
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 20

  admin-role:
    profiles: [operations]
    image: gopulse/backend:${GOPULSE_IMAGE_TAG:?GOPULSE_IMAGE_TAG is required}
    pull_policy: never
    restart: "no"
    entrypoint: [/usr/local/bin/admin-role]
    environment: *mysql-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - business

  acceptance:
    profiles: [acceptance]
    image: gopulse/acceptance:${GOPULSE_IMAGE_TAG:?GOPULSE_IMAGE_TAG is required}
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/docker/acceptance.Dockerfile
      args:
        <<: *image-build-args
        UPDATE_VERSION: ${GOPULSE_UPDATE_VERSION:?GOPULSE_UPDATE_VERSION is required}
    environment:
      GOPULSE_BASE_URL: http://frontend:8080
      GOPULSE_ACCEPTANCE_TOKEN: ${GOPULSE_ACCEPTANCE_TOKEN:-compose}
      GOPULSE_ACCEPTANCE_SCENARIO: ${GOPULSE_ACCEPTANCE_SCENARIO:-business}
      GOPULSE_OBSERVABILITY_ADMIN_USERNAME: ${GOPULSE_OBSERVABILITY_ADMIN_USERNAME:-}
      GOPULSE_OBSERVABILITY_USER_USERNAME: ${GOPULSE_OBSERVABILITY_USER_USERNAME:-}
      GOPULSE_OBSERVABILITY_PASSWORD: ${GOPULSE_OBSERVABILITY_PASSWORD:-}
      GOPULSE_UPDATE_VERSION: ${GOPULSE_UPDATE_VERSION:?GOPULSE_UPDATE_VERSION is required}
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - edge

  kafka:
    image: apache/kafka:4.3.1
    restart: on-failure:5
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    expose:
      - "19092"
    networks:
      - observability
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:19092 --list >/dev/null 2>&1']
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:4.3.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
        --topic gopulse-observability-v1 --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe
        --topic gopulse-observability-v1
    networks:
      - observability

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.151.0
    restart: on-failure:5
    environment:
      VICTORIAMETRICS_USERNAME: ${VICTORIAMETRICS_USERNAME:?VICTORIAMETRICS_USERNAME is required}
    secrets:
      - victoriametrics_password
    command:
      - -storageDataPath=/victoria-metrics-data
      - -httpAuth.username=${VICTORIAMETRICS_USERNAME:?VICTORIAMETRICS_USERNAME is required}
      - -httpAuth.password=file:///run/secrets/victoriametrics_password
      - -dedup.minScrapeInterval=1ms
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    expose:
      - "8428"
    networks:
      - observability
    healthcheck:
      test: [CMD, wget, --spider, --quiet, http://127.0.0.1:8428/health]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 30


  router:
    image: gopulse/router:${GOPULSE_IMAGE_TAG:?GOPULSE_IMAGE_TAG is required}
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/docker/observability.Dockerfile
      target: router
      args: *image-build-args
    restart: on-failure:5
    read_only: true
    stop_grace_period: 15s
    environment: *router-environment
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    expose:
      - "9091"
    networks:
      - observability
    healthcheck:
      test: [CMD-SHELL, 'wget --quiet --output-document=/dev/null http://127.0.0.1:9091/health']
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 20

  marshaller:
    image: gopulse/marshaller:${GOPULSE_IMAGE_TAG:?GOPULSE_IMAGE_TAG is required}
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/docker/observability.Dockerfile
      target: marshaller
      args: *image-build-args
    restart: on-failure:5
    read_only: true
    stop_grace_period: 15s
    environment: *marshaller-environment
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      victoriametrics:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    expose:
      - "9093"
    networks:
      - observability
    healthcheck:
      test: [CMD-SHELL, 'wget --quiet --output-document=/dev/null http://127.0.0.1:9093/health']
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 20

  monitor:
    image: gopulse/monitor:${GOPULSE_IMAGE_TAG:?GOPULSE_IMAGE_TAG is required}
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/docker/observability.Dockerfile
      target: monitor
      args: *image-build-args
    restart: on-failure:5
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=160m,mode=1777
    stop_grace_period: 20s
    environment: *monitor-environment
    depends_on:
      redis:
        condition: service_healthy
      router:
        condition: service_healthy
    volumes:
      - monitor_plugin_data:/var/lib/gopulse-monitor/plugins
    expose:
      - "9090"
    networks:
      - business
      - observability
    healthcheck:
      test: [CMD-SHELL, 'wget --quiet --output-document=/dev/null http://127.0.0.1:9090/health']
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 30

  redis-exporter:
    profiles: [exporter]
    image: gopulse/redis-exporter:${GOPULSE_IMAGE_TAG:?GOPULSE_IMAGE_TAG is required}
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/docker/observability.Dockerfile
      target: redis-exporter
      args: *image-build-args
    restart: "no"
    read_only: true
    stop_grace_period: 10s
    environment:
      GOPULSE_RUNTIME_MODE: container
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_EXPORTER_HTTP_HOST: 0.0.0.0
      REDIS_EXPORTER_HTTP_PORT: 9121
      REDIS_EXPORTER_SCRAPE_TIMEOUT: ${REDIS_EXPORTER_SCRAPE_TIMEOUT:-2s}
      REDIS_EXPORTER_SHUTDOWN_TIMEOUT: ${REDIS_EXPORTER_SHUTDOWN_TIMEOUT:-5s}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "9121"
    networks:
      - business
    healthcheck:
      test: [CMD-SHELL, 'wget --quiet --output-document=/dev/null http://127.0.0.1:9121/health']
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  edge:
  business:
    internal: true
  observability:
    internal: true

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:
  kafka_data:
  victoriametrics_data:
  monitor_plugin_data:

secrets:
  victoriametrics_password:
    environment: VICTORIAMETRICS_PASSWORD
