name: deploy
services:
  mysql:
    image: mysql:8.4.0
    restart: on-failure:5
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gopulse}
      MYSQL_USER: ${MYSQL_USER:-gopulse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gopulse-mysql}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gopulse-root}
    ports:
    - 127.0.0.1:${MYSQL_PORT:-3306}:3306
    volumes:
    - mysql_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - --host=127.0.0.1
      - --silent
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.2.5-alpine
    restart: on-failure:5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-gopulse-redis}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-gopulse-redis}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-512mb}
      REDIS_MAXMEMORY_POLICY: ${REDIS_MAXMEMORY_POLICY:-noeviction}
    command:
    - sh
    - -c
    - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --maxmemory "$${REDIS_MAXMEMORY}" --maxmemory-policy "$${REDIS_MAXMEMORY_POLICY}"
    ports:
    - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - --no-auth-warning
      - --raw
      - ping
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.13.3-management-alpine
    restart: on-failure:5
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gopulse}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gopulse-rabbitmq}
    ports:
    - 127.0.0.1:${RABBITMQ_PORT:-5672}:5672
    - 127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 20
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    restart: on-failure:5
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.security.enrollment.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
    - 127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200
    volumes:
    - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl --fail --silent "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&wait_for_no_initializing_shards=true&wait_for_no_relocating_shards=true&timeout=5s"
        >/dev/null
      start_period: 30s
      interval: 5s
      timeout: 10s
      retries: 30
volumes:
  mysql_data: null
  redis_data: null
  rabbitmq_data: null
  elasticsearch_data: null
