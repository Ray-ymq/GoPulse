services:
  monitor:
    profiles: [observe]
    image: ${GOPULSE_MONITOR_IMAGE:-gopulse/monitor:local}
    pull_policy: never
    restart: on-failure:5
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=160m,mode=1777
    stop_grace_period: 20s
    environment:
      GOPULSE_RUNTIME_MODE: host
      GOPULSE_VERSION: ${GOPULSE_VERSION:-2.3.3}
      GOPULSE_REVISION: ${GOPULSE_REVISION:-development}
      GOPULSE_INSTANCE_ID: monitor-local
      GOPULSE_REPLICA_COUNT: 1
      MONITOR_HTTP_HOST: 127.0.0.1
      MONITOR_HTTP_PORT: ${MONITOR_HTTP_PORT:-9090}
      MONITOR_API_TOKEN: ${MONITOR_API_TOKEN:-local-monitor-api-token-change-me-32-bytes}
      MONITOR_METRICS_TOKEN: ${MONITOR_METRICS_TOKEN:-local-monitor-metrics-change-me-0123456789abcdef}
      MONITOR_PLUGIN_ROOT: /var/lib/gopulse-monitor/plugins
      MONITOR_BOOTSTRAP_PACKAGE: /opt/gopulse/packages/gopulse-redis-exporter.tar.gz
      MONITOR_REQUEST_TIMEOUT: ${MONITOR_REQUEST_TIMEOUT:-30s}
      MONITOR_SHUTDOWN_TIMEOUT: ${MONITOR_SHUTDOWN_TIMEOUT:-10s}
      MONITOR_PLUGIN_STARTUP_TIMEOUT: ${MONITOR_PLUGIN_STARTUP_TIMEOUT:-10s}
      MONITOR_PLUGIN_STOP_TIMEOUT: ${MONITOR_PLUGIN_STOP_TIMEOUT:-5s}
      MONITOR_SCRAPE_INTERVAL: ${MONITOR_SCRAPE_INTERVAL:-15s}
      MONITOR_SCRAPE_TIMEOUT: ${MONITOR_SCRAPE_TIMEOUT:-3s}
      MONITOR_PUBLISH_TIMEOUT: ${MONITOR_PUBLISH_TIMEOUT:-3s}
      MONITOR_ROUTER_URLS: ${MONITOR_ROUTER_URLS:-http://127.0.0.1:9091}
      MONITOR_ROUTER_TOKEN: ${MONITOR_ROUTER_TOKEN:-local-router-api-token-change-me-32-bytes}
      LOG_MONITOR_INGEST_TOKEN: ${LOG_MONITOR_INGEST_TOKEN:-local-log-ingest-token-change-me-32-bytes}
      MONITOR_LOG_MAX_BYTES: ${MONITOR_LOG_MAX_BYTES:-65536}
      MONITOR_LOG_FUTURE_SKEW: ${MONITOR_LOG_FUTURE_SKEW:-5m}
      MONITOR_EVENT_QUEUE_CAPACITY: ${MONITOR_EVENT_QUEUE_CAPACITY:-256}
      MONITOR_EVENT_RETRY_MIN: ${MONITOR_EVENT_RETRY_MIN:-250ms}
      MONITOR_EVENT_RETRY_MAX: ${MONITOR_EVENT_RETRY_MAX:-5s}
      MONITOR_EVENT_SHUTDOWN_TIMEOUT: ${MONITOR_EVENT_SHUTDOWN_TIMEOUT:-5s}
      MONITOR_EVENT_MAX_BYTES: ${MONITOR_EVENT_MAX_BYTES:-16384}
      ROUTER_ENDPOINTS: ${ROUTER_ENDPOINTS:-router}
      MARSHALLER_ENDPOINTS: ${MARSHALLER_ENDPOINTS:-marshaller}
      BACKEND_ENDPOINTS: ${BACKEND_ENDPOINTS:-backend}
      BUSINESS_WORKER_ENDPOINTS: ${BUSINESS_WORKER_ENDPOINTS:-business-worker}
      SEARCH_INDEXER_ENDPOINTS: ${SEARCH_INDEXER_ENDPOINTS:-search-indexer}
      ROUTER_METRICS_TOKEN: ${ROUTER_METRICS_TOKEN:-local-router-metrics-change-me-32-bytes}
      MARSHALLER_METRICS_TOKEN: ${MARSHALLER_METRICS_TOKEN:-local-marshaller-metrics-change-me-32-bytes}
      BACKEND_METRICS_TOKEN: ${BACKEND_METRICS_TOKEN:-local-backend-metrics-change-me-32-bytes}
      BUSINESS_WORKER_METRICS_TOKEN: ${BUSINESS_WORKER_METRICS_TOKEN:-local-business-worker-metrics-change-me-32-bytes}
      SEARCH_INDEXER_METRICS_TOKEN: ${SEARCH_INDEXER_METRICS_TOKEN:-local-search-indexer-metrics-change-me-32-bytes}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-gopulse-redis}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_EXPORTER_HTTP_HOST: 127.0.0.1
      REDIS_EXPORTER_HTTP_PORT: ${REDIS_EXPORTER_HTTP_PORT:-9121}
      REDIS_EXPORTER_SCRAPE_TIMEOUT: ${REDIS_EXPORTER_SCRAPE_TIMEOUT:-2s}
      REDIS_EXPORTER_SHUTDOWN_TIMEOUT: ${REDIS_EXPORTER_SHUTDOWN_TIMEOUT:-5s}
    volumes:
      - monitor_plugin_data:/var/lib/gopulse-monitor/plugins
    healthcheck:
      test: [CMD-SHELL, 'wget --quiet --output-document=/dev/null http://127.0.0.1:${MONITOR_HTTP_PORT:-9090}/health']
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 30
