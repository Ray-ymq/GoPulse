services:
  mysql:
    image: ${GOPULSE_MYSQL_IMAGE:-mysql:8.4.0}
    restart: on-failure:5
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
    - mysql_data:/var/lib/mysql
    networks:
    - business
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - --host=127.0.0.1
      - --silent
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: ${GOPULSE_REDIS_IMAGE:-redis:7.2.5-alpine}
    restart: on-failure:5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-512mb}
      REDIS_MAXMEMORY_POLICY: ${REDIS_MAXMEMORY_POLICY:-noeviction}
    command:
    - sh
    - -c
    - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --maxmemory "$${REDIS_MAXMEMORY}" --maxmemory-policy "$${REDIS_MAXMEMORY_POLICY}"
    volumes:
    - redis_data:/data
    networks:
    - business
    healthcheck:
      test:
      - CMD
      - redis-cli
      - --no-auth-warning
      - --raw
      - ping
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: ${GOPULSE_RABBITMQ_IMAGE:-rabbitmq:3.13.3-management-alpine}
    restart: on-failure:5
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    networks:
    - business
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 20
  elasticsearch:
    image: ${GOPULSE_ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:9.5.2}
    restart: on-failure:5
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.security.enrollment.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
    - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
    - business
    healthcheck:
      test:
      - CMD-SHELL
      - curl --fail --silent "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&wait_for_no_initializing_shards=true&wait_for_no_relocating_shards=true&timeout=5s"
        >/dev/null
      start_period: 30s
      interval: 5s
      timeout: 10s
      retries: 30
  migrate:
    image: ${GOPULSE_BACKEND_IMAGE:-gopulse/backend:latest}
    pull_policy: never
    restart: 'no'
    entrypoint:
    - /bin/sh
    - -c
    command:
    - /usr/local/bin/migrate validate && { /usr/local/bin/migrate status; code=$$?; [ "$$code" -eq 0 ] || [ "$$code" -eq 4 ]; } && exec /usr/local/bin/migrate up
    environment:
      GOPULSE_REVISION: ${GOPULSE_REVISION:-development}
      GOPULSE_VERSION: ${GOPULSE_VERSION:?GOPULSE_VERSION is required}
      GOPULSE_RUNTIME_MODE: container
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
    - business
  search-init:
    image: ${GOPULSE_BACKEND_IMAGE:-gopulse/backend:latest}
    pull_policy: never
    restart: 'no'
    entrypoint:
    - /bin/sh
    - -c
    command:
    - "if [ -n \"$$GOPULSE_RESTORE_OPERATION\" ] || [ -n \"$$GOPULSE_RESTORE_EXPECTED_OLD_EPOCH\" ] || [ -n \"$$GOPULSE_RESTORE_NEW_EPOCH\" ]; then\n  if [ -z \"\
      $$GOPULSE_RESTORE_OPERATION\" ] || [ -z \"$$GOPULSE_RESTORE_EXPECTED_OLD_EPOCH\" ] || [ -z \"$$GOPULSE_RESTORE_NEW_EPOCH\" ]; then\n    echo \"restore preparation\
      \ requires operation and both epochs\" >&2\n    exit 1\n  fi\n  set -- --restore-operation \"$$GOPULSE_RESTORE_OPERATION\" --expected-old-epoch \"$$GOPULSE_RESTORE_EXPECTED_OLD_EPOCH\"\
      \ --new-epoch \"$$GOPULSE_RESTORE_NEW_EPOCH\"\nelse\n  set -- --if-missing\nfi\nattempt=1\nwhile [ \"$$attempt\" -le 5 ]; do\n  if /usr/local/bin/search-reindex\
      \ \"$$@\"; then\n    exit 0\n  fi\n  if [ \"$$attempt\" -eq 5 ]; then\n    exit 1\n  fi\n  echo \"search initialization attempt $$attempt failed; retrying\"\
      \ >&2\n  sleep $$((attempt * 2))\n  attempt=$$((attempt + 1))\ndone\nexit 1\n"
    environment:
      GOPULSE_REVISION: ${GOPULSE_REVISION:-development}
      GOPULSE_VERSION: ${GOPULSE_VERSION:?GOPULSE_VERSION is required}
      GOPULSE_RUNTIME_MODE: container
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      BUSINESS_ASYNC_MAX_OPEN_REQUIREMENTS: ${BUSINESS_ASYNC_MAX_OPEN_REQUIREMENTS:-10000}
      BUSINESS_ASYNC_MAX_RETAINED_GROUPS: ${BUSINESS_ASYNC_MAX_RETAINED_GROUPS:-100000}
      BUSINESS_ASYNC_MAX_RETAINED_BYTES: ${BUSINESS_ASYNC_MAX_RETAINED_BYTES:-1073741824}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_REQUEST_TIMEOUT: ${ELASTICSEARCH_REQUEST_TIMEOUT:-3s}
      SEARCH_REINDEX_BATCH: ${SEARCH_REINDEX_BATCH:-500}
      GOPULSE_RESTORE_OPERATION: ${GOPULSE_RESTORE_OPERATION:-}
      GOPULSE_RESTORE_EXPECTED_OLD_EPOCH: ${GOPULSE_RESTORE_EXPECTED_OLD_EPOCH:-}
      GOPULSE_RESTORE_NEW_EPOCH: ${GOPULSE_RESTORE_NEW_EPOCH:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    networks:
    - business
  backend:
    image: ${GOPULSE_BACKEND_IMAGE:-gopulse/backend:latest}
    pull_policy: never
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
      target: backend
      args:
