services:
  mysql:
    image: mysql:8.4.0
    restart: on-failure:5
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gopulse}
      MYSQL_USER: ${MYSQL_USER:-gopulse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gopulse-mysql}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gopulse-root}
    ports:
      - 127.0.0.1:${MYSQL_PORT:-3306}:3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, --host=127.0.0.1, --silent]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2.5-alpine
    restart: on-failure:5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-gopulse-redis}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-gopulse-redis}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, --no-auth-warning, --raw, ping]
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13.3-management-alpine
    restart: on-failure:5
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gopulse}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gopulse-rabbitmq}
    ports:
      - 127.0.0.1:${RABBITMQ_PORT:-5672}:5672
      - 127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    restart: on-failure:5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - 127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&wait_for_no_initializing_shards=true&wait_for_no_relocating_shards=true&timeout=5s" >/dev/null']
      start_period: 30s
      interval: 5s
      timeout: 10s
      retries: 30

  kafka:
    profiles: [observe]
    image: apache/kafka:4.3.1
    restart: on-failure:5
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - 127.0.0.1:${KAFKA_PORT:-9092}:9092
    volumes:
      - kafka_data:/var/lib/kafka/data
    tmpfs:
      - /etc/kafka/secrets:rw,nosuid,nodev,size=16m,mode=1777
      - /mnt/shared/config:rw,nosuid,nodev,size=16m,mode=1777
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:19092 --list >/dev/null 2>&1']
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-init:
    profiles: [observe]
    image: apache/kafka:4.3.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
        --topic gopulse-observability-v1 --partitions ${KAFKA_OBSERVABILITY_PARTITIONS:-4} --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe
        --topic gopulse-observability-v1
    tmpfs:
      - /etc/kafka/secrets:rw,nosuid,nodev,size=16m,mode=1777
      - /mnt/shared/config:rw,nosuid,nodev,size=16m,mode=1777
      - /var/lib/kafka/data:rw,nosuid,nodev,size=16m,mode=1777

  victoriametrics:
    profiles: [observe]
    image: victoriametrics/victoria-metrics:v1.151.0
    restart: on-failure:5
    environment:
      VICTORIAMETRICS_USERNAME: ${VICTORIAMETRICS_USERNAME:-gopulse-marshaller}
    secrets:
      - victoriametrics_password
    command:
      - -storageDataPath=/victoria-metrics-data
      - -httpAuth.username=${VICTORIAMETRICS_USERNAME:-gopulse-marshaller}
      - -httpAuth.password=file:///run/secrets/victoriametrics_password
      - -dedup.minScrapeInterval=1ms
      - -retentionPeriod=30d
    ports:
      - 127.0.0.1:${VICTORIAMETRICS_PORT:-8428}:8428
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    healthcheck:
      test: [CMD, wget, --spider, --quiet, http://127.0.0.1:8428/health]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 30

  observability-elasticsearch:
    profiles: [observe]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    restart: on-failure:5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - 127.0.0.1:${OBSERVABILITY_ELASTICSEARCH_PORT:-9201}:9200
    volumes:
      - observability_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null']
      start_period: 30s
      interval: 5s
      timeout: 10s
      retries: 30

networks:
  local:

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:
  kafka_data:
  victoriametrics_data:
  observability_elasticsearch_data:
  monitor_plugin_data:

secrets:
  victoriametrics_password:
    environment: VICTORIAMETRICS_PASSWORD
