receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    send_batch_size: 256
    send_batch_max_size: 256
    timeout: 1s

exporters:
  file:
    path: /var/lib/gopulse/trace/spans.jsonl
    flush_interval: 1s
    rotation:
      max_megabytes: 16
      max_backups: 3
      max_days: 0
      localtime: false

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file]
