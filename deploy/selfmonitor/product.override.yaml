# Add to the existing product Compose invocation; Linux only.
services:
  backend:
    ports: ['127.0.0.1:29131:19101']
  backend-2:
    ports: ['127.0.0.1:29132:19101']
  platform-api:
    ports: ['127.0.0.1:29133:19101']
    volumes:
      - /run/gopulse-selfmonitor:/run/gopulse-selfmonitor:ro
    group_add: ["${SELFMONITOR_SOCKET_GID:?Set the selfmonitor group numeric GID}"]
  business-worker:
    ports: ['127.0.0.1:29134:19102']
  business-worker-2:
    ports: ['127.0.0.1:29135:19102']
  search-indexer:
    ports: ['127.0.0.1:29136:19103']
  search-indexer-2:
    ports: ['127.0.0.1:29137:19103']
  monitor:
    ports: ['127.0.0.1:29138:19104']
  marshaller:
    ports: ['127.0.0.1:29139:19106']
  marshaller-2:
    ports: ['127.0.0.1:29140:19106']
  rabbitmq:
    ports: ['127.0.0.1:29192:15692']
    volumes:
      - ./selfmonitor/rabbitmq-enabled-plugins:/etc/rabbitmq/enabled_plugins:ro
