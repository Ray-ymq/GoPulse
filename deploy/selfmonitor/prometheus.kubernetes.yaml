global:
  scrape_interval: 15s
  scrape_timeout: 5s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: backend
    metrics_path: /internal/v1/metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/backend_token
    static_configs:
      - targets: ['backend:19101']
        labels: {instance: backend}
  - job_name: platform-api
    metrics_path: /internal/v1/metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/backend_token
    static_configs:
      - targets: ['platform-api:19101']
        labels: {instance: platform-api}
  - job_name: business-worker
    metrics_path: /internal/v1/metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/business-worker_token
    static_configs:
      - targets: ['business-worker:19102']
        labels: {instance: business-worker}
  - job_name: search-indexer
    metrics_path: /internal/v1/metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/search-indexer_token
    static_configs:
      - targets: ['search-indexer:19103']
        labels: {instance: search-indexer}
  - job_name: monitor
    metrics_path: /internal/v1/metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/monitor_token
    static_configs:
      - targets: ['monitor:19104']
        labels: {instance: monitor}
  - job_name: marshaller
    metrics_path: /internal/v1/metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/marshaller_token
    static_configs:
      - targets: ['marshaller:19106']
        labels: {instance: marshaller}
  - job_name: prometheus
    static_configs:
      - targets: ['selfmonitor-prometheus:9090']
  - job_name: node
    static_configs:
      - targets: ['selfmonitor-node:9100']
  - job_name: mysql
    static_configs:
      - targets: ['selfmonitor-mysql-exporter:9104']
  - job_name: redis
    static_configs:
      - targets: ['selfmonitor-redis-exporter:9121']
  - job_name: kafka
    static_configs:
      - targets: ['selfmonitor-kafka-exporter:9308']
  - job_name: elasticsearch
    static_configs:
      - targets: ['selfmonitor-elasticsearch-exporter:9114']
  - job_name: observability-elasticsearch
    static_configs:
      - targets: ['selfmonitor-observability-elasticsearch-exporter:9114']
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
  - job_name: victoriametrics
    basic_auth:
      username: gopulse-marshaller
      password_file: /etc/prometheus/secrets/vm_password
    static_configs:
      - targets: ['victoriametrics:8428']
  - job_name: kubernetes-cadvisor
    scheme: https
    metrics_path: /api/v1/nodes/gopulse-wsl/proxy/metrics/cadvisor
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    static_configs:
      - targets: ['kubernetes.default.svc:443']
