{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "resources": [
    "resources.json"
  ],
  "configMapGenerator": [
    {
      "name": "selfmonitor-prometheus",
      "files": [
        "prometheus.yaml=prometheus.kubernetes.yaml",
        "alerts.yaml"
      ]
    },
    {
      "name": "selfmonitor-grafana",
      "files": [
        "datasource.yaml=kubernetes/grafana-datasource.yaml",
        "provider.yaml=kubernetes/grafana-provider.yaml",
        "gopulse.json=grafana/dashboards/gopulse.json"
      ]
    }
  ],
  "generatorOptions": {
    "disableNameSuffixHash": true
  }
}
