/* 统一的浅色主题：配色、字体和交互状态由语义变量控制。 */
:root {
  --primary: #3563e9;
  --primary-ink: #254ec4;
  --primary-soft: #edf2ff;
  --ink: #202939;
  --muted: #637087;
  --line: #e5e9f0;
  --canvas: #f6f8fb;
  --surface: #ffffff;
  --paper: var(--canvas);
  --radius: 18px;
  --shadow: 0 4px 20px #243b6410;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-family: var(--font-ui);
  color: var(--ink);
  background: var(--canvas);
}
body { background: var(--canvas); }
button, input, textarea, select { font-family: var(--font-ui); }

  .hero { padding: 24px; min-height: 184px; }

  .section-head { gap: 10px; }
  .section-title>span { display: none; }
  .post { padding: 20px 18px; }
  .post-title { font-size: 18px; }
  .excerpt { font-size: 13px; }
  .post-actions { gap: 16px; }
  .chip, .tag { min-height: 44px; }
  .mobile-publish { width: 49px; height: 49px; border-radius: 16px; box-shadow: 0 6px 22px #3563e93d; }
  .page-banner, .person-list, .post-detail { padding: 22px 18px; }

<h1 id="login-flow-title">一次登录，经过哪些层。</h1>
<p class="flow-intro">从独立登录页出发，沿请求走到 MySQL，再跟随响应回到浏览器。点击下方阶段可展开或收起。这里展示代码调用关系，不会提交真实账号或发起登录请求。</p>
<div class="flow-overview" aria-label="登录请求经过的层级"><span>Vue 页面</span><b>→</b><span>状态 / API 客户端</span><b>→</b><span>同源代理</span><b>→</b><span>HTTP 中间件</span><b>→</b><span>Auth Handler</span><b>→</b><span>Auth Service</span><b>→</b><span>User Repository</span><b>→</b><span>MySQL</span></div>
<div class="flow-note"><p>页面、Handler、Service、Repository 是代码职责层；MySQL、Redis、代理是运行组件。它们不是同一种“层”。</p><p>登录核验读取 MySQL；启用共享限流时还访问 Redis。JWT 的签发和验证在后端进程中完成，当前认证实现没有 Redis 会话表。</p></div>
<details class="flow-group" open><summary><span class="flow-index">01</span>提交登录 · 请求向下调用</summary><ol class="flow-steps"><li><h3>页面层 · 打开独立登录页</h3><p>路由先调用 <code>ensureSession()</code>。首次进入页面时，通过 <code>GET /api/v1/users/me</code> 检查已有会话；未登录访问受保护页面时，转到 <code>/login?redirect=原地址</code>。已有会话则跳过登录页。</p><p><code>AuthView</code> 检查用户名格式与密码长度。前端校验不替代后端校验。</p><div class="flow-source"><a href="../../frontend/web/src/router.ts"><code>frontend/web/src/router.ts</code></a><a href="../../frontend/web/src/views/AuthView.vue"><code>frontend/web/src/views/AuthView.vue</code></a></div></li><li><h3>前端状态与 API 层 · 提交凭据</h3><p><code>AuthView.submit → signIn → api.login → request</code>。发送 <code>POST /api/v1/auth/login</code>，JSON 请求体包含 <code>username</code> 和 <code>password</code>，请求使用 <code>credentials: include</code>。</p><p>前端请求超时为 12 秒。用户名或密码错误时，表单显示错误并允许重试。</p><div class="flow-source"><a href="../../frontend/web/src/composables/session.ts"><code>frontend/web/src/composables/session.ts</code></a><a href="../../frontend/web/src/services/api.ts"><code>frontend/web/src/services/api.ts</code></a><a href="../../frontend/web/src/services/http.ts"><code>frontend/web/src/services/http.ts</code></a></div></li><li><h3>同源代理层 · 转发 /api 请求</h3><p>开发环境：浏览器 → Vite → 业务 API。生产环境：浏览器 → Nginx → 业务 API。两种代理是环境分支，不是串行经过两层。</p><p>代理保留浏览器请求的 Host，供后端同源校验使用。生产 Nginx 转发 <code>/api/v1</code> 请求。</p><div class="flow-source"><a href="../../frontend/web/vite.config.ts"><code>frontend/web/vite.config.ts</code></a><a href="../../deploy/docker/frontend/nginx.conf"><code>deploy/docker/frontend/nginx.conf</code></a></div></li><li><h3>HTTP 边界层 · 通用中间件与登录保护</h3><p>Gin 依次接入 RequestID、访问日志、异常恢复、SameOrigin、请求超时，以及配置启用时的 API 并发准入。</p><p>登录路由随后经过已装配的 PublicRateLimit 和 PublicResourceBudget。共享限流使用 Redis 的 <code>login_attempt</code> 策略；登录接口无需已有登录 Cookie。</p><div class="flow-source"><a href="../../backend/business/internal/http/router.go"><code>backend/business/internal/http/router.go</code></a><a href="../../backend/business/internal/http/api.go"><code>backend/business/internal/http/api.go</code></a><a href="../../backend/business/internal/http/middleware/protection.go"><code>backend/business/internal/http/middleware/protection.go</code></a><a href="../../backend/business/cmd/server/roles.go"><code>backend/business/cmd/server/roles.go</code></a></div></li><li><h3>Handler 层 · 解码请求与组织响应</h3><p><code>auth.Handler.Login</code> 通过 <code>request.DecodeJSON</code> 解码请求，然后调用 <code>application.Login(ctx, credentials)</code>。Handler 将业务错误映射为 HTTP 响应；成功时设置 Cookie 并返回用户公开字段。</p><div class="flow-source"><a href="../../backend/business/internal/auth/handler.go"><code>backend/business/internal/auth/handler.go</code></a></div></li><li><h3>Service 层 · 验证账号与密码</h3><p><code>auth.Service.Login</code> 校验用户名和密码输入，通过 <code>user.Repository.FindByUsername</code> 查找用户，再调用 <code>PasswordManager.Verify</code>，使用 bcrypt 比较输入密码与存储的哈希。</p><p>用户名不存在或输入不符合服务端规则时，调用 <code>VerifyUnknown</code> 执行占位 bcrypt 比较，并返回相同的无效凭据错误。</p><div class="flow-source"><a href="../../backend/business/internal/auth/service.go"><code>backend/business/internal/auth/service.go</code></a><a href="../../backend/business/internal/auth/password.go"><code>backend/business/internal/auth/password.go</code></a><a href="../../backend/business/internal/user/validation.go"><code>backend/business/internal/user/validation.go</code></a></div></li><li><h3>Repository 与存储层 · 读取 MySQL 用户记录</h3><p><code>user.MySQLRepository.FindByUsername</code> 执行参数化查询：<code>SELECT … FROM users WHERE username = ?</code>，读取用户记录与 <code>password_hash</code>。</p><p>这是 Service 校验过程中的一次下层调用。记录返回 Service 后，才继续比较密码；登录成功路径不创建新的用户记录。</p><div class="flow-source"><a href="../../backend/business/internal/user/repository.go"><code>backend/business/internal/user/repository.go</code></a></div></li></ol></details>
<details class="flow-group" open><summary><span class="flow-index">02</span>返回结果 · Cookie 与页面回跳</summary><ol class="flow-steps"><li><h3>认证基础能力 · 签发 JWT</h3><p>密码匹配后，Service 调用 <code>TokenManager.Issue(userID)</code>，签发 HS256 JWT，写入 <code>sub</code>、<code>iat</code> 和 <code>exp</code>。有效期来自后端配置。</p><div class="flow-source"><a href="../../backend/business/internal/auth/token.go"><code>backend/business/internal/auth/token.go</code></a></div></li><li><h3>HTTP 响应 → 浏览器 · 保存会话 Cookie</h3><p>Handler 调用 <code>CookieManager.Set</code>，通过 <code>Set-Cookie</code> 返回令牌。Cookie 使用 <code>HttpOnly</code>、<code>SameSite=Lax</code>、<code>Path=/</code>，Secure 标记由配置决定。</p><p>同时返回 <code>200</code> 和用户公开字段。密码、密码哈希和 JWT 不放入响应 JSON；浏览器保存 Cookie，前端 JavaScript 不读取这个 HttpOnly Cookie。</p><div class="flow-source"><a href="../../backend/business/internal/auth/cookie.go"><code>backend/business/internal/auth/cookie.go</code></a><a href="../../backend/business/internal/auth/handler.go"><code>backend/business/internal/auth/handler.go</code></a></div></li><li><h3>前端状态 → 页面路由 · 完成登录回跳</h3><p><code>signIn</code> 更新内存中的 <code>user</code>；<code>AuthView</code> 清空密码，再通过 <code>safeRedirect</code> 校验跳转目标并调用 <code>router.replace</code>。默认返回首页。</p><p>社区布局随后加载用户资料、最近帖子和通知。这些是登录后的独立请求，不属于登录接口内部调用。</p><div class="flow-source"><a href="../../frontend/web/src/composables/session.ts"><code>frontend/web/src/composables/session.ts</code></a><a href="../../frontend/web/src/views/AuthView.vue"><code>frontend/web/src/views/AuthView.vue</code></a><a href="../../frontend/web/src/utils/format.ts"><code>frontend/web/src/utils/format.ts</code></a><a href="../../frontend/web/src/App.vue"><code>frontend/web/src/App.vue</code></a></div></li></ol></details>
<details class="flow-group" open><summary><span class="flow-index">03</span>后续访问 · 用 Cookie 验证身份</summary><ol class="flow-steps"><li><h3>浏览器与代理层 · 携带 Cookie</h3><p>以刷新页面后的 <code>GET /api/v1/users/me</code> 为例：前端调用 <code>ensureSession</code>，浏览器按 Cookie 规则携带会话，经当前环境的代理转发给后端。</p><div class="flow-source"><a href="../../frontend/web/src/composables/session.ts"><code>frontend/web/src/composables/session.ts</code></a><a href="../../frontend/web/src/services/http.ts"><code>frontend/web/src/services/http.ts</code></a></div></li><li><h3>鉴权中间件 · 验证 JWT</h3><p><code>RequireAuthentication</code> 读取配置名称对应的 Cookie，调用 <code>TokenManager.Verify</code> 检查令牌结构、HS256 签名和时间声明，再把用户 ID 放入请求 Context。</p><p>缺少或无效 Cookie 时返回 <code>401 authentication_required</code>，请求不会进入后续受保护 Handler。通过鉴权后，再经过已装配的受保护限流和资源预算中间件。</p><div class="flow-source"><a href="../../backend/business/internal/http/middleware/authentication.go"><code>backend/business/internal/http/middleware/authentication.go</code></a><a href="../../backend/business/internal/auth/token.go"><code>backend/business/internal/auth/token.go</code></a><a href="../../backend/business/internal/http/api.go"><code>backend/business/internal/http/api.go</code></a></div></li><li><h3>Handler → Service → Repository → MySQL · 查询当前用户</h3><p><code>Handler.CurrentUser → Service.CurrentUser → Repository.FindByID</code>。查询用户后返回公开资料；用户不存在时返回 <code>401</code>，Handler 清除 Cookie。Service 还会尝试读取管理初始化状态提示，该提示不用于授权。</p><p>前端收到成功响应后恢复内存会话。会话过期时，前端清除会话状态并将受保护页面转到登录页。</p><div class="flow-source"><a href="../../backend/business/internal/auth/handler.go"><code>backend/business/internal/auth/handler.go</code></a><a href="../../backend/business/internal/auth/service.go"><code>backend/business/internal/auth/service.go</code></a><a href="../../backend/business/internal/user/repository.go"><code>backend/business/internal/user/repository.go</code></a><a href="../../frontend/web/src/App.vue"><code>frontend/web/src/App.vue</code></a></div></li></ol></details>

<h2>在哪一层停止。</h2>
<div class="flow-table-wrap"><table class="flow-table"><caption>常见失败分支；前端提示与后端错误码分开处理。</caption><thead><tr><th scope="col">停止位置</th><th scope="col">条件</th><th scope="col">结果</th></tr></thead><tbody>
<tr><td>Vue 表单</td><td>用户名格式或密码长度不符合规则</td><td>显示输入提示，不发送登录 POST。</td></tr>
<tr><td>HTTP 边界</td><td>浏览器跨源写入</td><td><code>403 permission_denied</code></td></tr>
<tr><td>限流 / 资源准入</td><td>超出限额、共享限流不可用或资源不足</td><td>按原因返回 <code>429 rate_limited</code>、<code>503 rate_limit_unavailable</code> 或 <code>503 backend_busy</code>，不进入认证 Service。</td></tr>
<tr><td>Auth Service</td><td>账号不存在或密码错误</td><td><code>401 invalid_credentials</code>；前端提示“用户名或密码不正确”。</td></tr>
<tr><td>网络 / 代理</td><td>无法连接业务 API 或请求超时</td><td>前端显示连接或服务错误，留在登录页，不伪造登录成功。</td></tr>
<tr><td>后续请求鉴权</td><td>Cookie 缺失、令牌无效或过期</td><td><code>401 authentication_required</code>；受保护页面返回登录页。</td></tr>
</tbody></table></div>
<h2>哪些组件没有进入登录主链路。</h2>
<p>RabbitMQ、Worker、Indexer 和 Elasticsearch 不参与用户名密码核验、JWT 签发或 Cookie 设置。登录后加载社区数据是另一条请求链路；搜索、发帖及通知处理各有独立流程。</p>
<p class="flow-intro">源码链接指向仓库中的实际文件。通过本地文件打开时，可由编辑器查看；静态预览服务器需要同时提供仓库目录，才能打开这些链接。</p>

 if(page==='login-flow') { html=$('#login-flow-template').innerHTML;
 } else if(page==='notifications') {
 html=banner('消息通知','每一次互动，都是分享的回响。')+`<div class="section-head"><div class="section-title"><h2>互动消息</h2><span>${state.read?'全部已读':'2 条未读'}</span></div><button class="chip" id="mark-read" ${state.read?'disabled':''}>全部标为已读</button></div><div class="feed"><article class="notice ${state.read?'':'unread'}">${avatar(people[0])}<div><p><strong>山野来信</strong> 欢迎你来到 GoPulse</p><small>28 分钟前 · 演示通知</small><button data-detail="lake">来看看我的山野周末 ${icon('arrow')}</button></div></article><article class="notice ${state.read?'':'unread'}">${avatar(people[1])}<div><p><strong>像素漫游</strong> 邀请你聊聊日常里的设计</p><small>1 小时前 · 演示通知</small><button data-detail="design">加入这场讨论 ${icon('arrow')}</button></div></article></div>`;
 } else {
 if(page==='discover') { html=hero()+heading('发现新鲜事','总有一种热爱，与你同频'); }
 if(page==='following') { html=banner('我的关注','看看关注的人，最近分享了什么。')+heading('关注动态',`${state.following.length} 位已关注`); filtered=filtered.filter(p=>isFollowing(p.author)); }
 if(page==='bookmarks') { html=banner('我的收藏','把喜欢的内容留住，想起时再回来看看。')+heading('收藏的分享',`${state.bookmarks.length} 篇`); filtered=filtered.filter(p=>state.bookmarks.includes(p.id)); }
 if(page==='profile') { html=`<section class="page-banner"><div class="profile-top"><span class="avatar">林</span><div><h1>林间</h1><p>@linjian · 把日子过成喜欢的样子。</p></div></div><p>喜欢自然、设计，和所有平凡又动人的瞬间。</p><div class="profile-stats"><span><b>${state.posts.length}</b>帖子</span><span><b>${state.following.length}</b>关注</span><span><b>${state.bookmarks.length}</b>收藏</span></div></section>`+heading('我的分享'); filtered=filtered.filter(p=>p.author==='林间'); }
 if(page==='search') { html=banner('寻找你的同频',`搜索“${escapeHTML(query)}”的相关帖子、作者与话题。`)+heading('搜索结果'); }
 if(page==='discover' || page==='search') html+=`<div class="filters" role="group" aria-label="按话题筛选">${['全部','生活日常','旅行见闻','设计灵感','数码科技','阅读时光'].map(c=>`<button class="chip ${category===c?'active':''}" data-filter="${c}" aria-pressed="${category===c}">${c}</button>`).join('')}</div>`;
 if((page==='discover'||page==='search')&&category!=='全部') filtered=filtered.filter(p=>p.category===category);
 if(page==='search'&&query) { const q=query.toLocaleLowerCase(); filtered=filtered.filter(p=>[p.title,p.body,p.author,p.category,...p.tags].some(v=>v.toLocaleLowerCase().includes(q))); }
 filtered.sort((a,b)=>sort==='popular'?(b.likes+Number(state.likes.includes(b.id)))-(a.likes+Number(state.likes.includes(a.id))):b.created-a.created);
 html+=`<div class="feed">${filtered.length?filtered.map(postCard).join(''):empty(page==='profile'?'你的故事，从这里开始':page==='following'?'这里还很安静':page==='bookmarks'?'把喜欢留在这里':'暂时没有相关内容',page==='profile'?'分享一个想法，或记录今天的小小发现。':page==='following'?'关注感兴趣的作者，他们的分享就会出现在这里。':page==='bookmarks'?'点击帖子下方的收藏按钮，就能随时回来阅读。':'试试其他关键词，或切换话题。',page==='profile'?'compose':'discover')}</div>${filtered.length?'<div class="end">已经看完啦，去分享你的新发现吧</div>':''}`;
 }
 $('#main').innerHTML=html; renderPeople();
}
function navigate(target, updateHash=true) { const allowed=['discover','following','bookmarks','notifications','profile','search','login-flow']; page=allowed.includes(target)?target:'discover'; if(page!=='search'){query='';$('#search').value='';} category='全部'; if(updateHash) history.replaceState(null,'','#'+page); render(); window.scrollTo({top:0,behavior:'auto'}); }
function searchFor(text) { query=text.trim(); $('#search').value=query; if(!query){navigate('discover');return;} navigate('search'); }
function toggleFollow(name) { if(isFollowing(name)) state.following=state.following.filter(n=>n!==name); else state.following.push(name); save(); render(); if($('#author-dialog').open) renderAuthor(name); toast(isFollowing(name)?`已关注${name}`:`已取消关注${name}`); }
function openDetail(id) { const p=posts().find(p=>p.id===id); if(!p)return; currentPost=id; renderDetail(); if(!$('#detail').open)$('#detail').showModal(); }
function renderDetail() { const p=posts().find(p=>p.id===currentPost); if(!p)return; const seedComments=p.id==='lake'?[{name:'半杯拿铁',text:'隔着屏幕都感受到了安静，下个周末也想去走走。'},{name:'像素漫游',text:'光落在水面上的样子，像一幅画。'}]:p.id==='design'?[{name:'山野来信',text:'很喜欢这种对日常的观察，细节总能带来惊喜。'}]:p.id==='coffee'?[{name:'阿澈',text:'最近的放松方式是傍晚出门散步。'}]:[]; const comments=[...seedComments,...(state.comments[p.id]||[])]; $('#detail-content').innerHTML=`<div class="post-head">${avatar(p)}<strong style="font-size:13px">${escapeHTML(p.author)}</strong>${p.author!=='林间'?followButton(p.author):''}</div><h2 class="detail-title" id="detail-title">${escapeHTML(p.title)}</h2><div class="detail-meta">${escapeHTML(p.time)} · ${escapeHTML(p.category)}</div><p class="detail-text">${escapeHTML(p.body)}</p><div class="post-actions"><button class="action ${state.likes.includes(p.id)?'active':''}" data-like="${escapeHTML(p.id)}" aria-pressed="${state.likes.includes(p.id)}">${icon('heart')}${p.likes+Number(state.likes.includes(p.id))} 人喜欢</button><button class="action ${state.bookmarks.includes(p.id)?'active':''}" data-bookmark="${escapeHTML(p.id)}" aria-pressed="${state.bookmarks.includes(p.id)}">${icon('bookmark')}${state.bookmarks.includes(p.id)?'已收藏':'收藏'}</button></div><section class="comment-section"><h3>聊聊你的想法 <span style="color:var(--muted);font-weight:400">${comments.length}</span></h3><form class="comment-input" id="comment-form"><label class="sr-only" for="comment-text">写下你的评论</label><input id="comment-text" maxlength="500" required placeholder="友善交流，让分享有回响"><button class="primary" type="submit">发送</button></form><p class="hint">评论仅保存在此浏览器。</p>${comments.length?comments.map(c=>`<article class="comment"><span class="avatar lilac">${escapeHTML(c.name[0])}</span><div><strong>${escapeHTML(c.name)}</strong><p>${escapeHTML(c.text)}</p></div></article>`).join(''):'<p class="hint">还没有评论，来分享第一个想法吧。</p>'}</section>`; }
function renderAuthor(name) { if(name==='林间'){navigate('profile');return;} const p=people.find(p=>p.name===name); if(!p)return; const authored=posts().filter(post=>post.author===name); $('#author-content').innerHTML=`<div class="profile-top">${avatar(p)}<div><h2 style="font-size:22px;margin:0 0 5px">${escapeHTML(name)}</h2><p class="hint">${p.bio}</p></div>${followButton(name)}</div><p class="hint">最近分享 · ${authored.length} 篇</p>${authored.map(post=>`<button class="post-title" data-author-post="${post.id}">${escapeHTML(post.title)} ${icon('arrow')}</button>`).join('')}`; }
function toggleList(list,id) { if(state[list].includes(id)) state[list]=state[list].filter(item=>item!==id); else state[list].push(id); save(); const draft=$('#comment-text')?.value; render(); if($('#detail').open){renderDetail();if(draft!==undefined)$('#comment-text').value=draft;} }
document.addEventListener('click', async event => {
 const button=event.target.closest('button'); if(!button)return;
 if(button.hasAttribute('data-compose')) { $('#composer').showModal(); return; }
 if(button.dataset.close) { $('#'+button.dataset.close).close(); return; }
 if(button.dataset.go) { navigate(button.dataset.go); return; }
 if(button.dataset.topic) { navigate('discover'); category=button.dataset.topic; render(); return; }
 if(button.dataset.filter) { category=button.dataset.filter; render(); return; }
 if(button.dataset.query) { searchFor(button.dataset.query); return; }
 if(button.dataset.like) { toggleList('likes',button.dataset.like); return; }
 if(button.dataset.bookmark) { const id=button.dataset.bookmark; toggleList('bookmarks',id); toast(state.bookmarks.includes(id)?'已加入收藏，可在“我的收藏”查看。':'已取消收藏。'); return; }
 if(button.dataset.follow) { const draft=$('#comment-text')?.value; toggleFollow(button.dataset.follow); if($('#detail').open){renderDetail();if(draft!==undefined)$('#comment-text').value=draft;} return; }
 if(button.dataset.detail) { openDetail(button.dataset.detail); return; }
 if(button.dataset.authorPost) { $('#author-dialog').close(); openDetail(button.dataset.authorPost); return; }
 if(button.dataset.author) { const name=button.dataset.author; if(name==='林间'){navigate('profile');return;} renderAuthor(name); $('#author-dialog').showModal(); return; }
 if(button.dataset.share) { const url=new URL(location.href);url.hash='post/'+button.dataset.share; try { if(!navigator.clipboard)throw new Error('clipboard_unavailable');await navigator.clipboard.writeText(url.href);toast('已复制原型链接；自建帖子仅在当前浏览器可查看。'); } catch { toast('复制受浏览器限制，可从地址栏复制本页链接。'); } return; }
 if(button.id==='refresh-people') { peopleOffset=(peopleOffset+2)%people.length;renderPeople();return; }
 if(button.id==='mark-read') { state.read=true;save();render();toast('消息已全部标为已读。');return; }
 if(button.id==='reset-demo') { $('#reset-dialog').showModal();return; }
 if(button.id==='confirm-reset') { state=defaults();save();$('#reset-dialog').close();navigate('discover');toast('演示数据已重置。'); }
});
$('#search-form').addEventListener('submit', event => {event.preventDefault();searchFor($('#search').value);});
$('#search').addEventListener('search', () => {if(!$('#search').value)navigate('discover');});
document.addEventListener('change',event=>{if(event.target.id==='sort'){sort=event.target.value;render();}});
$('#publish-form').addEventListener('submit', event => {
 event.preventDefault(); const title=$('#post-title').value.trim(), body=$('#post-body').value.trim();
 if(!title||!body){$('#publish-error').textContent='请填写标题和分享内容，内容不能只有空格。';return;}
 const id='local-'+Date.now(); state.posts.unshift({id,author:'林间',initial:'林',color:'',category:$('#post-category').value,time:'刚刚',title,body,tags:[$('#post-category').value],likes:0,comments:0,created:Date.now()});save();$('#composer').close();$('#publish-form').reset();$('#publish-error').textContent='';navigate('profile');toast('发布成功，你的新分享已出现在个人主页。');
});
document.addEventListener('submit',event=>{if(event.target.id!=='comment-form')return;event.preventDefault();const text=$('#comment-text').value.trim();if(!text){toast('请输入评论内容，内容不能只有空格。');return;}state.comments[currentPost]??=[];state.comments[currentPost].push({name:'林间',text});save();renderDetail();render();$('#comment-text').focus();toast('评论已发布。');});
document.addEventListener('keydown',event=>{if(event.key==='/'&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!document.querySelector('dialog[open]')){event.preventDefault();$('#search').focus();}});
document.querySelectorAll('dialog').forEach(dialog=>dialog.addEventListener('click',event=>{if(event.target!==dialog)return;const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)dialog.close();}));
function route() { const hash=decodeURIComponent(location.hash.slice(1)); if(hash.startsWith('post/')){navigate('discover',false);const id=hash.slice(5);if(posts().some(p=>p.id===id))openDetail(id);else toast('此帖子不在当前浏览器中，可先浏览社区分享。');}else navigate(hash||'discover',false); }
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
