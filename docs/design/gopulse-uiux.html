<script>
'use strict';
const $ = (selector, parent = document) => parent.querySelector(selector);
const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const escapeHTML = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const key = 'gopulse-uiux-v1';
const initialPosts = [
{id:'lake',author:'山野来信',initial:'山',color:'green',category:'旅行见闻',time:'28 分钟前',title:'在山野里，找回生活原本的节奏',body:'周末逃离城市，沿着湖边走了很久。没有安排好的行程，也没有非去不可的目的地，只是听风吹过树林，看光落在水面。\n原来，什么都不做的时光，也可以被记住。',tags:['周末出逃计划','自然治愈'],likes:128,comments:2,cover:true,created:5},
{id:'design',author:'像素漫游',initial:'像',color:'lilac',category:'设计灵感',time:'1 小时前',title:'好的设计，是让日常多一点心动',body:'最近收集了一些喜欢的生活小物，发现打动我的往往不是复杂的功能，而是那些恰到好处的小细节。一个圆角、一种触感、一段留白，都在悄悄改变使用的心情。',tags:['设计观察','日常灵感'],likes:86,comments:1,created:4},
{id:'coffee',author:'半杯拿铁',initial:'半',color:'peach',category:'生活日常',time:'2 小时前',title:'给周末留一段不被打扰的时间',body:'一杯手冲，一本读到一半的书，和窗边刚刚好的阳光。今天的任务，是认真享受这份平常。你最近有什么让自己放松的小习惯？',tags:['慢生活','周末'],likes:64,comments:1,created:3},
{id:'desk',author:'阿澈',initial:'澈',color:'blue',category:'数码科技',time:'3 小时前',title:'把桌面收拾好，灵感也跟着来了',body:'试着减少桌上的东西，只留下每天真正会用到的物件。空出来的位置放一株绿植，工作和生活好像都有了新的呼吸空间。',tags:['桌面分享','数码日常'],likes:42,comments:0,created:2},
{id:'book',author:'纸上散步',initial:'纸',color:'green',category:'阅读时光',time:'昨天',title:'读书的时候，世界会安静一会儿',body:'睡前把手机放远了一点，重新拿起纸质书。不追求读完多少页，只记下今天喜欢的一句话。分享一下最近陪着你的那本书吧。',tags:['阅读时光','生活日常'],likes:37,comments:0,created:1}
];
const people = [
{name:'山野来信',initial:'山',color:'green',bio:'在路上，也在生活里'},
{name:'像素漫游',initial:'像',color:'lilac',bio:'收集日常里的设计灵感'},
{name:'半杯拿铁',initial:'半',color:'peach',bio:'咖啡、阅读和生活小事'},
{name:'阿澈',initial:'澈',color:'blue',bio:'用喜欢的物件，整理生活'},
{name:'纸上散步',initial:'纸',color:'green',bio:'与文字一起，慢慢散步'}
];
const defaults = () => ({likes:[],bookmarks:[],following:['半杯拿铁'],posts:[],comments:{},read:false});
let state = defaults();
let persistenceAvailable = true;
try { const saved = JSON.parse(localStorage.getItem(key)); if (saved && Array.isArray(saved.likes) && Array.isArray(saved.bookmarks) && Array.isArray(saved.following) && Array.isArray(saved.posts) && saved.comments && typeof saved.comments === 'object') state = saved; } catch { persistenceAvailable = false; }
let page = 'discover', category = '全部', query = '', sort = 'recommended', peopleOffset = 0, currentPost = null;
let toastTimer;
function toast(message) { $('#toast').textContent = message; $('#toast').classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 2700); }
function save() { try { localStorage.setItem(key, JSON.stringify(state)); } catch { if (persistenceAvailable) toast('浏览器无法保存数据，本次操作仅在当前页面保留。'); persistenceAvailable = false; } }
function posts() { return [...state.posts,...initialPosts]; }
function avatar(person) { return `<span class="avatar ${person.color || ''}" aria-hidden="true">${escapeHTML(person.initial)}</span>`; }
function landscape() { return `<svg viewBox="0 0 640 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label="山峦环绕的湖泊，一叶小船停在水面"><use href="#landscape"/></svg>`; }
function isFollowing(name) { return state.following.includes(name); }
function followButton(name) { const active = isFollowing(name); return `<button class="follow ${active?'active':''}" data-follow="${escapeHTML(name)}" aria-pressed="${active}" aria-label="${active?'取消关注':'关注'}${escapeHTML(name)}">${active?'已关注':'+ 关注'}</button>`; }
function renderPeople() { $('#people').innerHTML = Array.from({length:3}, (_,i) => people[(i+peopleOffset)%people.length]).map(p => `<div class="person">${avatar(p)}<div class="person-info"><button class="author" data-author="${p.name}"><strong>${p.name}</strong><small>${p.bio}</small></button></div>${followButton(p.name)}</div>`).join(''); }
function hero() { return `<section class="hero" aria-label="社区介绍"><div class="hero-copy"><div class="eyebrow"><span></span> FIND YOUR PEOPLE. FEEL YOUR PULSE.</div><h1>生活的每一面，<br>都值得被看见。</h1><p>分享热爱，交换灵感，遇见与你同频的人。</p><button class="hero-link" data-compose>从一次分享开始 ${icon('arrow')}</button></div><svg class="hero-art" viewBox="0 0 250 240" aria-hidden="true"><circle cx="145" cy="130" r="87" fill="#e5d7f1"/><circle cx="146" cy="130" r="66" fill="none" stroke="#c9b6df" stroke-dasharray="3 7"/><path d="m66 105 37-61 65 37-37 63Z" fill="#faf7fd" stroke="#d4c2e6"/><path d="m80 101 19-30 24 14" fill="none" stroke="#b79acb" stroke-width="2"/><path d="m128 129 34-48 59 26-21 63-63-12Z" fill="#cc9fdb"/><path d="m141 128 38-13 17 29-40 9Z" fill="#e8c9f1"/><circle cx="138" cy="138" r="35" fill="#fbf8fd" stroke="#d2b6e3"/><path d="M115 140h12l7-16 8 31 8-19 7 4h6" fill="none" stroke="#b454c6" stroke-width="3" stroke-linejoin="round"/><path d="m72 183 15-16 19 17-18 17Z" fill="#baa0d2"/><circle cx="193" cy="51" r="10" fill="#d6bd8a"/><path d="M200 178v19m-9-10h18M49 124v12m-6-6h12" stroke="#a58bbd" stroke-width="2"/><circle cx="97" cy="38" r="3" fill="#ba9dce"/></svg></section>`; }
function postCard(p) { const liked = state.likes.includes(p.id), bookmarked = state.bookmarks.includes(p.id); const comments = p.comments + (state.comments[p.id]?.length || 0); return `<article class="post" data-post="${escapeHTML(p.id)}"><div class="post-head">${avatar(p)}<button class="author" data-author="${escapeHTML(p.author)}"><strong>${escapeHTML(p.author)}</strong><small>${escapeHTML(p.time)} · 分享了新发现</small></button><button class="category" data-topic="${escapeHTML(p.category)}">${escapeHTML(p.category)}</button></div><button class="post-title" data-detail="${escapeHTML(p.id)}">${escapeHTML(p.title)}</button><p class="excerpt">${escapeHTML(p.body.length>115?p.body.slice(0,115)+'…':p.body)}</p>${p.cover?`<button class="post-cover" data-detail="${escapeHTML(p.id)}" aria-label="阅读${escapeHTML(p.title)}">${landscape()}<span class="cover-caption">A MOMENT IN THE WILD</span></button>`:''}<div class="tags">${p.tags.map(t=>`<button class="tag" data-query="${escapeHTML(t)}"># ${escapeHTML(t)}</button>`).join('')}</div><div class="post-actions"><button class="action ${liked?'active':''}" data-like="${escapeHTML(p.id)}" aria-pressed="${liked}" aria-label="${liked?'取消点赞':'点赞'}：${escapeHTML(p.title)}">${icon('heart')}<span>${p.likes+(liked?1:0)}</span></button><button class="action" data-detail="${escapeHTML(p.id)}" aria-label="查看评论：${escapeHTML(p.title)}">${icon('comment')}<span>${comments || '评论'}</span></button><button class="action ${bookmarked?'active':''}" data-bookmark="${escapeHTML(p.id)}" aria-pressed="${bookmarked}">${icon('bookmark')}<span>${bookmarked?'已收藏':'收藏'}</span></button><button class="action" data-share="${escapeHTML(p.id)}" aria-label="分享${escapeHTML(p.title)}">${icon('share')}</button></div></article>`; }
function empty(title, description, action = 'compose') { return `<div class="empty">${icon('spark')}<h3>${title}</h3><p>${description}</p><button class="primary" ${action==='compose'?'data-compose':'data-go="discover"'}>${action==='compose'?'发布第一条分享':'去发现内容'}</button></div>`; }
function banner(title, description) { return `<section class="page-banner"><h1>${title}</h1><p>${description}</p></section>`; }
function heading(title, subtitle = '') { return `<div class="section-head"><div class="section-title"><h2>${title}</h2>${subtitle?`<span>${subtitle}</span>`:''}</div><label class="sr-only" for="sort">帖子排序</label><select class="sort" id="sort"><option value="recommended" ${sort==='recommended'?'selected':''}>为你推荐</option><option value="latest" ${sort==='latest'?'selected':''}>最新发布</option><option value="popular" ${sort==='popular'?'selected':''}>最多点赞</option></select></div>`; }
function render() {
 document.querySelectorAll('.nav [data-go]').forEach(b => { b.classList.toggle('active',b.dataset.go===page); if(b.dataset.go===page) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
 document.querySelectorAll('[data-top]').forEach(a => { a.classList.toggle('active',a.dataset.top===page); if(a.dataset.top===page) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
 $('#notification-count').hidden=state.read; $('#notification-dot').hidden=state.read;
 let filtered=posts(), html='';
 if(page==='notifications') {
 html=banner('消息通知','每一次互动，都是分享的回响。')+`<div class="section-head"><div class="section-title"><h2>互动消息</h2><span>${state.read?'全部已读':'2 条未读'}</span></div><button class="chip" id="mark-read" ${state.read?'disabled':''}>全部标为已读</button></div><div class="feed"><article class="notice ${state.read?'':'unread'}">${avatar(people[0])}<div><p><strong>山野来信</strong> 欢迎你来到 GoPulse</p><small>28 分钟前 · 演示通知</small><button data-detail="lake">来看看我的山野周末 ${icon('arrow')}</button></div></article><article class="notice ${state.read?'':'unread'}">${avatar(people[1])}<div><p><strong>像素漫游</strong> 邀请你聊聊日常里的设计</p><small>1 小时前 · 演示通知</small><button data-detail="design">加入这场讨论 ${icon('arrow')}</button></div></article></div>`;
 } else {
 if(page==='discover') { html=hero()+heading('发现新鲜事','总有一种热爱，与你同频'); }
 if(page==='following') { html=banner('我的关注','看看关注的人，最近分享了什么。')+heading('关注动态',`${state.following.length} 位已关注`); filtered=filtered.filter(p=>isFollowing(p.author)); }
 if(page==='bookmarks') { html=banner('我的收藏','把喜欢的内容留住，想起时再回来看看。')+heading('收藏的分享',`${state.bookmarks.length} 篇`); filtered=filtered.filter(p=>state.bookmarks.includes(p.id)); }
 if(page==='profile') { html=`<section class="page-banner"><div class="profile-top"><span class="avatar">林</span><div><h1>林间</h1><p>@linjian · 把日子过成喜欢的样子。</p></div></div><p>喜欢自然、设计，和所有平凡又动人的瞬间。</p><div class="profile-stats"><span><b>${state.posts.length}</b>帖子</span><span><b>${state.following.length}</b>关注</span><span><b>${state.bookmarks.length}</b>收藏</span></div></section>`+heading('我的分享'); filtered=filtered.filter(p=>p.author==='林间'); }
 if(page==='search') { html=banner('寻找你的同频',`搜索“${escapeHTML(query)}”的相关帖子、作者与话题。`)+heading('搜索结果'); }
 if(page==='discover' || page==='search') html+=`<div class="filters" role="group" aria-label="按话题筛选">${['全部','生活日常','旅行见闻','设计灵感','数码科技','阅读时光'].map(c=>`<button class="chip ${category===c?'active':''}" data-filter="${c}" aria-pressed="${category===c}">${c}</button>`).join('')}</div>`;
 if((page==='discover'||page==='search')&&category!=='全部') filtered=filtered.filter(p=>p.category===category);
 if(page==='search'&&query) { const q=query.toLocaleLowerCase(); filtered=filtered.filter(p=>[p.title,p.body,p.author,p.category,...p.tags].some(v=>v.toLocaleLowerCase().includes(q))); }
 filtered.sort((a,b)=>sort==='popular'?(b.likes+Number(state.likes.includes(b.id)))-(a.likes+Number(state.likes.includes(a.id))):b.created-a.created);
 html+=`<div class="feed">${filtered.length?filtered.map(postCard).join(''):empty(page==='profile'?'你的故事，从这里开始':page==='following'?'这里还很安静':page==='bookmarks'?'把喜欢留在这里':'暂时没有相关内容',page==='profile'?'分享一个想法，或记录今天的小小发现。':page==='following'?'关注感兴趣的作者，他们的分享就会出现在这里。':page==='bookmarks'?'点击帖子下方的收藏按钮，就能随时回来阅读。':'试试其他关键词，或切换话题。',page==='profile'?'compose':'discover')}</div>${filtered.length?'<div class="end">已经看完啦，去分享你的新发现吧</div>':''}`;
 }
 $('#main').innerHTML=html; renderPeople();
}
function navigate(target, updateHash=true) { const allowed=['discover','following','bookmarks','notifications','profile','search']; page=allowed.includes(target)?target:'discover'; if(page!=='search'){query='';$('#search').value='';} category='全部'; if(updateHash) history.replaceState(null,'','#'+page); render(); window.scrollTo({top:0,behavior:'auto'}); }
function searchFor(text) { query=text.trim(); $('#search').value=query; if(!query){navigate('discover');return;} navigate('search'); }
function toggleFollow(name) { if(isFollowing(name)) state.following=state.following.filter(n=>n!==name); else state.following.push(name); save(); render(); if($('#author-dialog').open) renderAuthor(name); toast(isFollowing(name)?`已关注${name}`:`已取消关注${name}`); }
function openDetail(id) { const p=posts().find(p=>p.id===id); if(!p)return; currentPost=id; renderDetail(); if(!$('#detail').open)$('#detail').showModal(); }
function renderDetail() { const p=posts().find(p=>p.id===currentPost); if(!p)return; const seedComments=p.id==='lake'?[{name:'半杯拿铁',text:'隔着屏幕都感受到了安静，下个周末也想去走走。'},{name:'像素漫游',text:'光落在水面上的样子，像一幅画。'}]:p.id==='design'?[{name:'山野来信',text:'很喜欢这种对日常的观察，细节总能带来惊喜。'}]:p.id==='coffee'?[{name:'阿澈',text:'最近的放松方式是傍晚出门散步。'}]:[]; const comments=[...seedComments,...(state.comments[p.id]||[])]; $('#detail-content').innerHTML=`<div class="post-head">${avatar(p)}<strong style="font-size:13px">${escapeHTML(p.author)}</strong>${p.author!=='林间'?followButton(p.author):''}</div><h2 class="detail-title" id="detail-title">${escapeHTML(p.title)}</h2><div class="detail-meta">${escapeHTML(p.time)} · ${escapeHTML(p.category)}</div>${p.cover?`<div class="post-cover">${landscape()}</div>`:''}<p class="detail-text">${escapeHTML(p.body)}</p><div class="post-actions"><button class="action ${state.likes.includes(p.id)?'active':''}" data-like="${escapeHTML(p.id)}" aria-pressed="${state.likes.includes(p.id)}">${icon('heart')}${p.likes+Number(state.likes.includes(p.id))} 人喜欢</button><button class="action ${state.bookmarks.includes(p.id)?'active':''}" data-bookmark="${escapeHTML(p.id)}" aria-pressed="${state.bookmarks.includes(p.id)}">${icon('bookmark')}${state.bookmarks.includes(p.id)?'已收藏':'收藏'}</button></div><section class="comment-section"><h3>聊聊你的想法 <span style="color:var(--muted);font-weight:400">${comments.length}</span></h3><form class="comment-input" id="comment-form"><label class="sr-only" for="comment-text">写下你的评论</label><input id="comment-text" maxlength="500" required placeholder="友善交流，让分享有回响"><button class="primary" type="submit">发送</button></form><p class="hint">评论仅保存在此浏览器。</p>${comments.length?comments.map(c=>`<article class="comment"><span class="avatar lilac">${escapeHTML(c.name[0])}</span><div><strong>${escapeHTML(c.name)}</strong><p>${escapeHTML(c.text)}</p></div></article>`).join(''):'<p class="hint">还没有评论，来分享第一个想法吧。</p>'}</section>`; }
function renderAuthor(name) { if(name==='林间'){navigate('profile');return;} const p=people.find(p=>p.name===name); if(!p)return; const authored=posts().filter(post=>post.author===name); $('#author-content').innerHTML=`<div class="profile-top">${avatar(p)}<div><h2 style="font-size:22px;margin:0 0 5px">${escapeHTML(name)}</h2><p class="hint">${p.bio}</p></div>${followButton(name)}</div><p class="hint">最近分享 · ${authored.length} 篇</p>${authored.map(post=>`<button class="post-title" data-author-post="${post.id}">${escapeHTML(post.title)} ${icon('arrow')}</button>`).join('')}`; }
function toggleList(list,id) { if(state[list].includes(id)) state[list]=state[list].filter(item=>item!==id); else state[list].push(id); save(); const draft=$('#comment-text')?.value; render(); if($('#detail').open){renderDetail();if(draft!==undefined)$('#comment-text').value=draft;} }
document.addEventListener('click', async event => {
 const button=event.target.closest('button'); if(!button)return;
 if(button.hasAttribute('data-compose')) { $('#composer').showModal(); return; }
 if(button.dataset.close) { $('#'+button.dataset.close).close(); return; }
 if(button.dataset.go) { navigate(button.dataset.go); return; }
 if(button.dataset.topic) { navigate('discover'); category=button.dataset.topic; render(); return; }
 if(button.dataset.filter) { category=button.dataset.filter; render(); return; }
 if(button.dataset.query) { searchFor(button.dataset.query); return; }
 if(button.dataset.like) { toggleList('likes',button.dataset.like); return; }
 if(button.dataset.bookmark) { const id=button.dataset.bookmark; toggleList('bookmarks',id); toast(state.bookmarks.includes(id)?'已加入收藏，可在“我的收藏”查看。':'已取消收藏。'); return; }
 if(button.dataset.follow) { const draft=$('#comment-text')?.value; toggleFollow(button.dataset.follow); if($('#detail').open){renderDetail();if(draft!==undefined)$('#comment-text').value=draft;} return; }
 if(button.dataset.detail) { openDetail(button.dataset.detail); return; }
 if(button.dataset.authorPost) { $('#author-dialog').close(); openDetail(button.dataset.authorPost); return; }
 if(button.dataset.author) { const name=button.dataset.author; if(name==='林间'){navigate('profile');return;} renderAuthor(name); $('#author-dialog').showModal(); return; }
 if(button.dataset.share) { const url=new URL(location.href);url.hash='post/'+button.dataset.share; try { if(!navigator.clipboard)throw new Error('clipboard_unavailable');await navigator.clipboard.writeText(url.href);toast('已复制原型链接；自建帖子仅在当前浏览器可查看。'); } catch { toast('复制受浏览器限制，可从地址栏复制本页链接。'); } return; }
 if(button.id==='refresh-people') { peopleOffset=(peopleOffset+2)%people.length;renderPeople();return; }
 if(button.id==='mark-read') { state.read=true;save();render();toast('消息已全部标为已读。');return; }
 if(button.id==='reset-demo') { $('#reset-dialog').showModal();return; }
 if(button.id==='confirm-reset') { state=defaults();save();$('#reset-dialog').close();navigate('discover');toast('演示数据已重置。'); }
});
$('#search-form').addEventListener('submit', event => {event.preventDefault();searchFor($('#search').value);});
$('#search').addEventListener('search', () => {if(!$('#search').value)navigate('discover');});
document.addEventListener('change',event=>{if(event.target.id==='sort'){sort=event.target.value;render();}});
$('#publish-form').addEventListener('submit', event => {
 event.preventDefault(); const title=$('#post-title').value.trim(), body=$('#post-body').value.trim();
 if(!title||!body){$('#publish-error').textContent='请填写标题和分享内容，内容不能只有空格。';return;}
 const id='local-'+Date.now(); state.posts.unshift({id,author:'林间',initial:'林',color:'',category:$('#post-category').value,time:'刚刚',title,body,tags:[$('#post-category').value],likes:0,comments:0,created:Date.now()});save();$('#composer').close();$('#publish-form').reset();$('#publish-error').textContent='';navigate('profile');toast('发布成功，你的新分享已出现在个人主页。');
});
document.addEventListener('submit',event=>{if(event.target.id!=='comment-form')return;event.preventDefault();const text=$('#comment-text').value.trim();if(!text){toast('请输入评论内容，内容不能只有空格。');return;}state.comments[currentPost]??=[];state.comments[currentPost].push({name:'林间',text});save();renderDetail();render();$('#comment-text').focus();toast('评论已发布。');});
document.addEventListener('keydown',event=>{if(event.key==='/'&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!document.querySelector('dialog[open]')){event.preventDefault();$('#search').focus();}});
document.querySelectorAll('dialog').forEach(dialog=>dialog.addEventListener('click',event=>{if(event.target!==dialog)return;const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)dialog.close();}));
function route() { const hash=decodeURIComponent(location.hash.slice(1)); if(hash.startsWith('post/')){navigate('discover',false);const id=hash.slice(5);if(posts().some(p=>p.id===id))openDetail(id);else toast('此帖子不在当前浏览器中，可先浏览社区分享。');}else navigate(hash||'discover',false); }
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
