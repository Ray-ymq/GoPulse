            application/json:
              schema:
                $ref: '#/components/schemas/DataComment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags:
      - Interactions
      summary: 评论列表
      description: 按评论 ID 倒序；未知查询参数被静默忽略。
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 评论列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCommentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/posts/{postId}/like:
    parameters:
    - $ref: '#/components/parameters/PostId'
    put:
      tags:
      - Interactions
      summary: 点赞
      description: 幂等：重复点赞同样返回 204，且不会重复产生事件。
      responses:
        '204':
          description: 已点赞。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
      - Interactions
      summary: 取消点赞
      description: 幂等：未点赞时同样返回 204。
      responses:
        '204':
          description: 已取消点赞。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/posts/{postId}/bookmark:
    parameters:
    - $ref: '#/components/parameters/PostId'
    put:
      tags:
      - Interactions
      summary: 收藏
      description: 幂等：重复收藏同样返回 204。
      responses:
        '204':
          description: 已收藏。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
      - Interactions
      summary: 取消收藏
      description: 幂等：未收藏时同样返回 204。
      responses:
        '204':
          description: 已取消收藏。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/search/posts:
    get:
      tags:
      - Search
      summary: 检索帖子
      description: '命中结果回表补齐，检索引擎中已不存在的文档被丢弃。

        游标是绑定查询词与快照的会话令牌，存活 2 分钟，过期后需要从第一页重新检索。

        只接受 `q`、`limit`、`cursor`，出现其他查询参数返回 400 `validation_failed`。

        '
      parameters:
      - $ref: '#/components/parameters/SearchQuery'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/PostSearchCursor'
      responses:
        '200':
          description: 检索结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPostPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 检索引擎或其快照不可用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unavailable:
                  value:
                    error:
                      code: search_unavailable
                      message: search is temporarily unavailable
  /api/v1/notifications:
    get:
      tags:
      - Notifications
      summary: 通知列表
      description: '按创建时间倒序。通知由异步 worker 从事件落库，因此存在可见延迟；

        未知查询参数被静默忽略。

        '
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 通知列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataNotificationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/notifications/{notificationId}/read:
    patch:
      tags:
      - Notifications
      summary: 标记通知已读
      description: '幂等：重复标记保留首次已读时间。

        他人的通知按不存在处理，返回 404。

        '
      parameters:
      - $ref: '#/components/parameters/NotificationId'
      responses:
        '204':
          description: 已标记为已读。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gopulse_session
      description: 登录接口下发的会话 Cookie；名称可由 `AUTH_COOKIE_NAME` 覆盖。
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: 目标用户的数字 ID，必须是十进制正整数；`me` 之类别名不被接受。
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
    Username:
      name: username
      in: path
      required: true
      description: 用户名；按列的排序规则做等值比较，大小写与重音不敏感。
      schema:
        type: string
    PostId:
      name: postId
      in: path
      required: true
      description: 帖子 ID，必须是十进制正整数。
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: 通知 ID，必须是十进制正整数；他人的通知按不存在处理。
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
    Limit:
      name: limit
      in: query
      required: false
      description: 单页条数，取值 1 到 50，缺省 20。
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: '上一页响应中 `meta.next_cursor` 的原值。

        帖子、关注关系与通知的游标是未签名的时间戳游标，最长为 512 字符；

        评论游标最长为 256 字符。游标不可跨端点或跨用户复用。

        '
      schema:
        type: string
    BookmarkCursor:
      name: cursor
      in: query
      required: false
      description: '收藏列表的游标，最长为 600 字符，由服务端签名并绑定当前查看者；

        被篡改或换用户复用返回 400。

        '
      schema:
        type: string
        maxLength: 600
    PostSearchCursor:
      name: cursor
      in: query
      required: false
      description: '帖子搜索的游标，最长为 8192 字节，绑定查询词、数据 epoch 与检索引擎快照；

        快照存活 2 分钟，过期后需要从第一页重新检索。

        '
      schema:
        type: string
        maxLength: 8192
    UserSearchCursor:
      name: cursor
      in: query
      required: false
      description: 用户检索的游标，最长为 2048 字符，带签名并绑定查询词，换词复用返回 400。
      schema:
        type: string
        maxLength: 2048
    SearchQuery:
      name: q
      in: query
      required: true
      description: 检索词，去除首尾空白后按 Unicode 码点计 1 到 200 个字符；必须恰好出现一次。
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: '幂等键，规范的小写 UUID（36 字符，版本位 1-5）。

        必须与 `X-GoPulse-Data-Epoch` 同时出现，只带其一返回 400。

        '
      schema:
        type: string
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    DataEpoch:
      name: X-GoPulse-Data-Epoch
      in: header
      required: false
      description: '数据 epoch，取自 `GET /api/v1/post-commands/context` 的 `data_epoch`，格式与幂等键相同。

        与当前 epoch 不一致返回 409 `data_epoch_mismatch`。

        '
      schema:
        type: string
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
  schemas:
    ErrorCode:
      type: string
      description: 稳定的错误标识，新增取值属于兼容变更。
      enum:
      - validation_failed
      - authentication_required
      - invalid_credentials
      - permission_denied
      - internal_error
      - user_not_found
      - username_conflict
      - post_not_found
      - notification_not_found
      - idempotency_conflict
      - command_result_unknown
      - command_outcome_unknown
      - data_epoch_mismatch
      - business_async_backlog
      - search_unavailable
      - bootstrap_super_admin_protected
      - management_setup_unavailable
      - not_found
      - method_not_allowed
      - backend_busy
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 可直接展示给调用方的安全描述，不含内部细节。
        request_id:
          type: string
          description: 回显请求的 `X-Request-ID`，便于与日志和事件关联。
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    PageMeta:
      type: object
      required:
      - next_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: 下一页游标；为 `null` 时表示没有更多数据。
    Credentials:
      type: object
      required:
      - username
      - password
      additionalProperties: false
      properties:
        username:
          type: string
          description: 去除首尾空白后 3 到 32 字节，仅允许 `[A-Za-z0-9_]`。
        password:
          type: string
          description: 至少 8 个 Unicode 码点，且 UTF-8 编码不超过 72 字节。
    UserPublic:
      type: object
      required:
      - id
      - username
      - role
      - created_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
        role:
          type: string
          enum:
          - user
          - super_admin
        created_at:
          type: string
          format: date-time
        management_setup_available:
          type: boolean
          description: 管理端初始化存储是否可用；不可用或查询失败时该字段省略。
    ProfileInput:
      type: object
      required:
      - display_name
      - bio
      additionalProperties: false
      properties:
        display_name:
          type: string
          description: 去除首尾空白后 1 到 64 个 Unicode 码点；两个字段必须同时出现。
        bio:
          type: string
          description: 允许空串；去除首尾空白后最多 160 个 Unicode 码点。
    Profile:
      type: object
      required:
      - id
      - username
      - display_name
      - bio
      - created_at
      - following
      - is_self
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
        display_name:
          type: string
        bio:
          type: string
        created_at:
          type: string
          format: date-time
        following:
          type: boolean
          description: 当前查看者是否关注该用户；查看自己时恒为 `false`。
        is_self:
          type: boolean
          description: 该资料是否属于当前查看者。
    FollowState:
      type: object
      required:
      - following
      properties:
        following:
          type: boolean
    PostAuthor:
      type: object
      required:
      - id
      - username
      - display_name
      - following
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
        display_name:
          type: string
        following:
          type: boolean
          description: 当前查看者是否关注该作者。
    Post:
      type: object
      required:
      - id
      - title
      - content
      - created_at
      - updated_at
      - edited_at
      - content_revision
      - bookmarked_by_me
      - liked_by_me
      - comment_count
      - like_count
      - author
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          description: 去除首尾空白后 1 到 120 个 Unicode 码点。
        content:
          type: string
          description: 去除首尾空白后 1 到 10000 个 Unicode 码点。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        edited_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 从未编辑时为 `null`。
        content_revision:
          type: integer
          format: int64
          minimum: 1
          description: 内容修订号，每次内容变化递增。
        bookmarked_by_me:
          type: boolean
        liked_by_me:
          type: boolean
        comment_count:
          type: integer
          format: int64
          minimum: 0
        like_count:
          type: integer
          format: int64
          minimum: 0
        author:
          $ref: '#/components/schemas/PostAuthor'
    PostInput:
      type: object
      required:
      - title
      - content
      additionalProperties: false
      properties:
        title:
          type: string
          description: 去除首尾空白后 1 到 120 个 Unicode 码点。
        content:
          type: string
          description: 去除首尾空白后 1 到 10000 个 Unicode 码点。
    CommentAuthor:
      type: object
      required:
      - id
      - username
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
    Comment:
      type: object
      required:
      - id
      - post_id
      - content
      - created_at
      - author
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        post_id:
          type: integer
          format: int64
          minimum: 1
        content:
          type: string
          description: 去除首尾空白后 1 到 2000 个 Unicode 码点。
        created_at:
          type: string
          format: date-time
        author:
          $ref: '#/components/schemas/CommentAuthor'
    CommentInput:
      type: object
      required:
      - content
      additionalProperties: false
      properties:
        content:
          type: string
          description: 去除首尾空白后 1 到 2000 个 Unicode 码点。
    NotificationActor:
      type: object
      required:
      - id
      - username
      - display_name
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
        display_name:
          type: string
    Notification:
      type: object
      required:
      - id
      - type
      - created_at
      - read_at
      - actor
      - post_id
      - comment_id
      - resource_deleted
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
          description: '事件类型。当前业务拓扑只投递 `comment.created`、`post.liked`、`user.followed`，

            其余取值保留给同一事件族的历史与后续装配。

            '
          enum:
          - comment.created
          - post.liked
          - user.followed
          - post.created
          - post.updated
          - post.deleted
        created_at:
          type: string
          format: date-time
        read_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 未读时为 `null`。
        actor:
          $ref: '#/components/schemas/NotificationActor'
        post_id:
          type:
          - integer
          - 'null'
          format: int64
          description: 关联帖子；帖子被删除后置为 `null`。
        comment_id:
          type:
          - integer
          - 'null'
          format: int64
          description: 关联评论；帖子被删除后置为 `null`。
        resource_deleted:
          type: boolean
          description: 非关注类通知在关联资源被删除后为 `true`。
    CommandMeta:
      type: object
      required:
      - command_id
      - event_id
      - data_epoch
      - post_id
      - committed_at
      - replayed
      - resource_state
      properties:
        command_id:
          type: string
          description: 幂等键对应的命令 ID。
        event_id:
          type: string
          description: 该命令产生的事件 ID，可用于与事件查询对齐。
        data_epoch:
          type: string
          description: 命令所属的数据 epoch。
        post_id:
          type: integer
          format: int64
          minimum: 1
        committed_at:
          type: string
          format: date-time
          description: 命令首次提交的时间；重放时保持不变。
        replayed:
          type: boolean
          description: 是否为重放响应。
        resource_state:
          type: string
          enum:
          - available
          - unavailable
          description: 命令已提交时目标资源的可读性；`unavailable` 时 `data` 为 `null`。
    CommandContext:
      type: object
      required:
      - data_epoch
      - retry_window_seconds
      - retry_window_until
      properties:
        data_epoch:
          type: string
          description: 当前生效的数据 epoch，作为 `X-GoPulse-Data-Epoch` 使用。
        retry_window_seconds:
          type: integer
          format: int64
          description: 命令结果的保留窗口，当前为 604800 秒（7 天）。
        retry_window_until:
          type: string
          format: date-time
          description: 保留窗口的结束时间。
    DataUserPublic:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/UserPublic'
    DataProfile:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Profile'
    DataProfilePage:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
        meta:
          $ref: '#/components/schemas/PageMeta'
    DataFollowState:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/FollowState'
    DataPost:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Post'
    DataPostPage:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        meta:
          $ref: '#/components/schemas/PageMeta'
    DataPostCommand:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          oneOf:
          - $ref: '#/components/schemas/Post'
          - type: 'null'
          description: 资源当前不可读时为 `null`，此时 `meta.resource_state` 为 `unavailable`。
        meta:
          $ref: '#/components/schemas/CommandMeta'
    DataPostOrCommand:
      description: '创建帖子返回两种形状之一：不带幂等键且未产生命令元数据时是 `{"data": Post}`；

        产生命令元数据时是 `{"data": Post|null, "meta": CommandMeta}`。

        '
      oneOf:
      - $ref: '#/components/schemas/DataPost'
      - $ref: '#/components/schemas/DataPostCommand'
    DataCommandContext:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/CommandContext'
    DataComment:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Comment'
    DataCommentPage:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        meta:
          $ref: '#/components/schemas/PageMeta'
    DataNotificationPage:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Probe:
      type: object
      required:
      - status
      - contract_version
      properties:
        status:
          type: string
          description: 探针状态，取值 `ok`、`starting`、`stopping`、`not_ready`、`invalid_request`、`method_not_allowed`、`not_found`。
        contract_version:
          type: string
          description: 运行时合同版本，与发布 Bundle 中的合同一致。
  requestBodies:
    Credentials:
      required: true
      description: 注册与登录共用同一请求体；未知字段被拒绝。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Credentials'
  headers:
    SessionCookie:
      description: '会话 Cookie，值为 HS256 签名的令牌，`HttpOnly`、`SameSite=Lax`，

        `Secure` 与有效期由部署配置决定（默认 2 小时）。

        '
      schema:
        type: string
  responses:
    BadRequest:
      description: 请求形状或参数校验失败。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validation:
              value:
                error:
                  code: validation_failed
                  message: limit must be an integer between 1 and 50
    Unauthorized:
      description: 缺少有效会话。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            required:
              value:
                error:
                  code: authentication_required
                  message: authentication is required
    Forbidden:
      description: 已认证但权限不足，或跨源写请求被拒。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            permission:
              value:
                error:
                  code: permission_denied
                  message: super administrator permission is required
    NotFound:
      description: 目标资源不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            not_found:
              value:
                error:
                  code: post_not_found
                  message: post not found
    Conflict:
      description: 与当前资源状态冲突，例如幂等键复用、用户名占用或版本冲突。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: 依赖不可用、结果未知或写入积压。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unavailable:
              value:
                error:
                  code: search_unavailable
                  message: search is temporarily unavailable
            busy:
              value:
                error:
                  code: backend_busy
                  message: service temporarily busy
    InternalError:
      description: 未预期的服务端错误；响应不包含内部细节。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            internal:
              value:
                error:
                  code: internal_error
                  message: an internal error occurred
    ProbeOk:
      description: 探针通过。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Probe'
          examples:
            ok:
              value:
                status: ok
                contract_version: '2'
    ProbeInvalid:
      description: 探针收到查询串、请求体或传输编码。
      headers:
        Cache-Control:
          schema:
            type: string
          description: 固定为 `no-store`。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Probe'
          examples:
            invalid:
              value:
                status: invalid_request
                contract_version: '2'
    ProbeMethodNotAllowed:
      description: 探针只接受 GET。
      headers:
        Allow:
          schema:
            type: string
          description: 固定为 `GET`。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Probe'
          examples:
            method:
              value:
                status: method_not_allowed
                contract_version: '2'
    ProbeStarting:
      description: 进程尚未完成启动。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Probe'
    ProbeNotReady:
      description: 依赖检查未通过或进程正在停机。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Probe'
