          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAuditEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/observability/metrics:
    get:
      tags: [Observability]
      summary: 查询指标序列
      description: |
        `metric` 接受已配置来源命名空间中的合法指标名，无需在代码目录中登记。
        返回所选窗口的原始指标序列，并保留动态维度标签。最多返回 1024 条序列。
        上游不可用或返回结构不符合合同时返回 503 `metrics_unavailable`。
      parameters:
        - $ref: '#/components/parameters/MetricName'
        - $ref: '#/components/parameters/MetricRange'
      responses:
        '200':
          description: 指标序列。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataMetricResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/observability/metrics/catalog:
    get:
      tags: [Observability]
      summary: 指标目录
      description: |
        以最近 24 小时为发现窗口，从存储中的指标元数据发现指标，并合并历史指标的显示预设。
        存储的序列发现接口按 UTC 日期取整时间窗口。
        指标类型取自采集结果。单位按名称后缀推断，历史预设可补充单位；未知单位为 `none`。
        标签键通过 `label_keys` 返回。不接受查询参数，请求体必须为空。
        目录最多包含 2048 项。存储不可用或目录超过上限时返回 503。
      responses:
        '200':
          description: 指标定义列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataMetricDefinitionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/observability/logs:
    get:
      tags: [Observability]
      summary: 查询日志
      description: |
        时间为 UTC 的 RFC3339Nano，窗口最长为 24 小时且终点不得晚于当前时间 5 分钟以上。
        日志存储保留 7 天，早于保留窗口的合法时间片返回空页。
        只接受下列参数，出现未知参数名、重复参数或空值返回 400；`cursor` 必须单独使用。
        归档别名缺失时返回 200 与空数组。
      parameters:
        - $ref: '#/components/parameters/RangeFrom'
        - $ref: '#/components/parameters/RangeTo'
        - $ref: '#/components/parameters/LogService'
        - $ref: '#/components/parameters/LogModule'
        - $ref: '#/components/parameters/LogMessage'
        - $ref: '#/components/parameters/LogLevel'
        - $ref: '#/components/parameters/RequestIdFilter'
        - $ref: '#/components/parameters/TraceIdFilter'
        - $ref: '#/components/parameters/SpanIdFilter'
        - $ref: '#/components/parameters/EventIdFilter'
        - $ref: '#/components/parameters/LogErrorCode'
        - $ref: '#/components/parameters/CappedLimit'
        - $ref: '#/components/parameters/ResourceCursor'
      responses:
        '200':
          description: 日志页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataLogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/observability/events:
    get:
      tags: [Observability]
      summary: 查询平台事件
      description: |
        时间与分页约束同日志查询；`event_name`、`severity`、`operation`、`error_code`
        之间必须彼此相容，否则返回 400。除 `cursor` 外每个取值最长 256 字符。
      parameters:
        - $ref: '#/components/parameters/RangeFrom'
        - $ref: '#/components/parameters/RangeTo'
        - $ref: '#/components/parameters/EventSource'
        - $ref: '#/components/parameters/EventName'
        - $ref: '#/components/parameters/EventSeverity'
        - $ref: '#/components/parameters/PluginIdFilter'
        - $ref: '#/components/parameters/EventOperation'
        - $ref: '#/components/parameters/EventErrorCode'
        - $ref: '#/components/parameters/CappedLimit'
        - $ref: '#/components/parameters/ResourceCursor'
      responses:
        '200':
          description: 事件页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/alerts/catalog:
    get:
      tags: [Alerts]
      summary: 告警目录
      description: 返回可创建的来源、指标定义、算子、窗口与持续时间的可选值；不接受查询参数，请求体必须为空。
      responses:
        '200':
          description: 告警目录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAlertCatalog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/alerts/rules:
    get:
      tags: [Alerts]
      summary: 规则列表
      description: |
        按规则 ID 倒序。只接受 `limit`、`source`、`status`、`cursor`；
        出现 `severity`、`rule`、`start`、`end` 或其他参数返回 400。
      parameters:
        - $ref: '#/components/parameters/CappedLimit'
        - $ref: '#/components/parameters/AlertSource'
        - $ref: '#/components/parameters/AlertStatus'
        - $ref: '#/components/parameters/AlertCursor'
      responses:
        '200':
          description: 规则列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAlertRulePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Alerts]
      summary: 创建规则
      description: |
        `enabled` 必填，`revision` 必须为 0 或省略。
        未删除规则数量达到上限时返回 409 `alert_rule_limit`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleInput'
      responses:
        '201':
          description: 已创建的规则。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAlertRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/alerts/rules/{ruleId}:
    parameters:
      - $ref: '#/components/parameters/AlertRuleId'
    get:
      tags: [Alerts]
      summary: 读取规则
      responses:
        '200':
          description: 规则详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAlertRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [Alerts]
      summary: 整体替换规则
      description: |
        语义是整体替换：除 `enabled`（必须省略，沿用库中状态）外所有字段都要给出，
        `revision` 必须与库中版本一致，否则返回 409 `alert_revision_conflict`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleInput'
      responses:
        '200':
          description: 更新后的规则。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAlertRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Alerts]
      summary: 删除规则
      description: 软删除；同样要求请求体携带 `revision`，成功返回 204 且无响应体。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRevisionRequest'
      responses:
        '204':
          description: 已删除。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/alerts/rules/{ruleId}/enable:
    post:
      tags: [Alerts]
      summary: 启用规则
      description: 请求体只允许 `revision`；启用的规则若处于触发中则保留触发状态。
      parameters:
        - $ref: '#/components/parameters/AlertRuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRevisionRequest'
      responses:
        '200':
          description: 启用后的规则。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAlertRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/alerts/rules/{ruleId}/disable:
    post:
      tags: [Alerts]
      summary: 停用规则
      description: 请求体只允许 `revision`；停用会关闭当前活动事件。
      parameters:
        - $ref: '#/components/parameters/AlertRuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRevisionRequest'
      responses:
        '200':
          description: 停用后的规则。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAlertRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/alerts/current:
    get:
      tags: [Alerts]
      summary: 当前活动事件
      description: |
        固定返回处于触发中的事件，按严重级别、首次触发时间升序排列。
        只接受 `limit`、`source`、`severity`、`cursor`；`status`、`rule`、`start`、`end` 返回 400。
      parameters:
        - $ref: '#/components/parameters/CappedLimit'
        - $ref: '#/components/parameters/AlertSource'
        - $ref: '#/components/parameters/AlertSeverity'
        - $ref: '#/components/parameters/AlertCursor'
      responses:
        '200':
          description: 活动事件列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAlertIncidentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/alerts/history:
    get:
      tags: [Alerts]
      summary: 历史事件
      description: |
        时间窗口默认最近 90 天且上限为 90 天，按首次触发时间倒序。
        只接受 `limit`、`source`、`severity`、`status`、`rule`、`start`、`end`、`cursor`。
      parameters:
        - $ref: '#/components/parameters/CappedLimit'
        - $ref: '#/components/parameters/AlertSource'
        - $ref: '#/components/parameters/AlertSeverity'
        - $ref: '#/components/parameters/IncidentStatus'
        - $ref: '#/components/parameters/RuleFilterId'
        - $ref: '#/components/parameters/WindowStart'
        - $ref: '#/components/parameters/WindowEnd'
        - $ref: '#/components/parameters/AlertCursor'
      responses:
        '200':
          description: 历史事件列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAlertIncidentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/exporter-plugins:
    get:
      tags: [Exporter Plugins]
      summary: 插件状态列表
      description: |
        返回已安装插件的状态，按插件 ID 升序。
        不接受查询参数，请求体必须为空；任一插件状态不符合合同时返回 503 `monitor_unavailable`。
      responses:
        '200':
          description: 插件状态列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPluginStatusList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/exporter-plugins/catalog:
    get:
      tags: [Exporter Plugins]
      summary: 插件目录
      description: 固定返回 6 个官方 exporter 的配置模式与当前配置状态，顺序稳定。
      responses:
        '200':
          description: 插件目录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPluginCatalog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/exporter-plugins/install:
    post:
      tags: [Exporter Plugins]
      summary: 上传并安装插件包
      description: |
        以 `multipart/form-data` 上传插件包：首个 part 的字段名必须是 `package` 且带文件名，
        包体不超过 64 MiB，且不允许附加 part。
        实际安装的插件由包内容决定，因此路径中没有插件 ID；审计记录固定归属 `redis-exporter`。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [package]
              properties:
                package:
                  type: string
                  format: binary
                  description: 插件包，字段名必须是 `package`。
      responses:
        '201':
          description: 安装后的插件状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPluginStatus'
        '400':
          description: 上传形状不合法或包内容非法。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                package:
                  value:
                    error:
                      code: plugin_package_invalid
                      message: plugin package is invalid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: 上游执行安装失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                failed:
                  value:
                    error:
                      code: plugin_operation_failed
                      message: plugin operation failed
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/exporter-plugins/{pluginId}:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    get:
      tags: [Exporter Plugins]
      summary: 读取单个插件状态
      description: 插件 ID 必须是 6 个官方 exporter 之一，否则返回 404。
      responses:
        '200':
          description: 插件状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPluginStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 插件不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                not_found:
                  value:
                    error:
                      code: plugin_not_found
                      message: plugin was not found
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/exporter-plugins/{pluginId}/install:
    post:
      tags: [Exporter Plugins]
      summary: 使用配置文件安装插件
      description: |
        以 JSON 提供配置与密钥；`Content-Type` 必须是 `application/json` 且不带参数，
        请求体不超过 16 KiB。创建时 `secrets` 必须显式给出（`kafka-exporter` 例外，发送 `{}`）。
      parameters:
        - $ref: '#/components/parameters/PluginId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginConfigRequest'
      responses:
        '201':
          description: 安装后的插件状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPluginStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: 上游执行安装失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                failed:
                  value:
                    error:
                      code: plugin_operation_failed
                      message: plugin operation failed
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/exporter-plugins/{pluginId}/connection-test:
    post:
      tags: [Exporter Plugins]
      summary: 连通性测试
      description: |
        请求体与安装相同；成功时 `reachable` 恒为 `true`，连不通由上游失败映射为 503。
      parameters:
