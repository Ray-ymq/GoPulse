          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: 上游执行升级失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                failed:
                  value:
                    error:
                      code: plugin_operation_failed
                      message: plugin operation failed
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gopulse_session
      description: 登录接口下发的会话 Cookie；名称可由 `AUTH_COOKIE_NAME` 覆盖。

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: 目标用户的数字 ID，必须是十进制正整数；`me` 之类别名不被接受。
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
    Username:
      name: username
      in: path
      required: true
      description: 用户名；按列的排序规则做等值比较，大小写与重音不敏感。
      schema:
        type: string
    PostId:
      name: postId
      in: path
      required: true
      description: 帖子 ID，必须是十进制正整数。
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: 通知 ID，必须是十进制正整数；他人的通知按不存在处理。
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
    Limit:
      name: limit
      in: query
      required: false
      description: 单页条数，取值 1 到 50，缺省 20。
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        上一页响应中 `meta.next_cursor` 的原值。
        帖子、关注关系与通知的游标是未签名的时间戳游标，最长为 512 字符；
        评论游标最长为 256 字符。游标不可跨端点或跨用户复用。
      schema:
        type: string
    BookmarkCursor:
      name: cursor
      in: query
      required: false
      description: |
        收藏列表的游标，最长为 600 字符，由服务端签名并绑定当前查看者；
        被篡改或换用户复用返回 400。
      schema:
        type: string
        maxLength: 600
    PostSearchCursor:
      name: cursor
      in: query
      required: false
      description: |
        帖子搜索的游标，最长为 8192 字节，绑定查询词、数据 epoch 与检索引擎快照；
        快照存活 2 分钟，过期后需要从第一页重新检索。
      schema:
        type: string
        maxLength: 8192
    UserSearchCursor:
      name: cursor
      in: query
      required: false
      description: 用户检索的游标，最长为 2048 字符，带签名并绑定查询词，换词复用返回 400。
      schema:
        type: string
        maxLength: 2048
    SearchQuery:
      name: q
      in: query
      required: true
      description: 检索词，去除首尾空白后按 Unicode 码点计 1 到 200 个字符；必须恰好出现一次。
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        幂等键，规范的小写 UUID（36 字符，版本位 1-5）。
        必须与 `X-GoPulse-Data-Epoch` 同时出现，只带其一返回 400。
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    DataEpoch:
      name: X-GoPulse-Data-Epoch
      in: header
      required: false
      description: |
        数据 epoch，取自 `GET /api/v1/post-commands/context` 的 `data_epoch`，格式与幂等键相同。
        与当前 epoch 不一致返回 409 `data_epoch_mismatch`。
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'

    PluginId:
      name: pluginId
      in: path
      required: true
      description: exporter 插件 ID，必须是 6 个官方 exporter 之一。
      schema:
        type: string
        enum:
          - redis-exporter
          - mysql-exporter
          - rabbitmq-exporter
          - kafka-exporter
          - elasticsearch-exporter
          - victoriametrics-exporter
    OverviewRange:
      name: range
      in: query
      required: true
      description: 总览的时间窗口；当前只接受 `15m`，省略或其他取值返回 400。
      schema:
        type: string
        enum: ['15m']
    MetricName:
      name: metric
      in: query
      required: true
      description: 指标名，需使用已配置来源的 `gopulse_<source>_` 前缀；来源名称中的连字符替换为下划线。可从动态目录发现，无需在代码中登记。最长 128 字符，只接受字母、数字和下划线。
      schema:
        type: string
        maxLength: 128
    MetricRange:
      name: range
      in: query
      required: false
      description: 查询窗口，缺省 `15m`；步长由窗口决定（15 秒、60 秒、300 秒、900 秒）。
      schema:
        type: string
        enum: ['15m', '1h', '6h', '24h']
        default: 15m
    RangeFrom:
      name: from
      in: query
      required: false
      description: 窗口起点，RFC3339Nano 且必须为 UTC；缺省为 `to` 前 15 分钟。
      schema:
        type: string
        format: date-time
    RangeTo:
      name: to
      in: query
      required: false
      description: 窗口终点，RFC3339Nano 且必须为 UTC；缺省为当前时间，不得超过当前时间 5 分钟以上。
      schema:
        type: string
        format: date-time
    LogService:
      name: service
      in: query
      required: false
      description: 服务名过滤，取值来自日志词表；与 `module`、`message` 的组合必须存在。
      schema:
        type: string
    LogModule:
      name: module
      in: query
      required: false
      description: 模块名过滤，取值来自日志词表。
      schema:
        type: string
    LogMessage:
      name: message
      in: query
      required: false
      description: 消息名过滤，取值来自日志词表。
      schema:
        type: string
    LogLevel:
      name: level
      in: query
      required: false
      description: 日志级别。
      schema:
        type: string
        enum: [info, warn, error]
    RequestIdFilter:
      name: request_id
      in: query
      required: false
      description: 请求 ID，32 位小写十六进制。
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    TraceIdFilter:
      name: trace_id
      in: query
      required: false
      description: 追踪 ID，32 位小写十六进制且不得全为 0。
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    SpanIdFilter:
      name: span_id
      in: query
      required: false
      description: Span ID，16 位小写十六进制且不得全为 0。
      schema:
        type: string
        pattern: '^[0-9a-f]{16}$'
    EventIdFilter:
      name: event_id
      in: query
      required: false
      description: 事件 ID，规范的小写 UUID。
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    LogErrorCode:
      name: error_code
      in: query
      required: false
      description: 错误码，取值来自平台错误码词表。
      schema:
        type: string
        enum:
          - validation_failed
          - authentication_required
          - permission_denied
          - invalid_credentials
          - username_conflict
          - post_not_found
          - notification_not_found
          - search_unavailable
          - metrics_unavailable
          - logs_unavailable
          - events_unavailable
          - plugin_package_invalid
          - plugin_not_found
          - plugin_conflict
          - plugin_operation_in_progress
          - plugin_operation_failed
          - monitor_unavailable
          - internal_error
    EventSource:
      name: source
      in: query
      required: false
      description: 事件来源。
      schema:
        type: string
        enum: [monitor]
    EventName:
      name: event_name
      in: query
      required: false
      description: 事件名，取值与 `severity`、`operation`、`error_code` 必须互相匹配。
      schema:
        type: string
        enum:
          - exporter_plugin_installed
          - exporter_plugin_started
          - exporter_plugin_stopped
          - exporter_plugin_updated
          - exporter_plugin_failed
          - exporter_plugin_exited
          - metrics_collection_failed
          - metrics_collection_recovered
          - metrics_target_unavailable
          - metrics_target_recovered
    EventSeverity:
      name: severity
      in: query
      required: false
      description: 事件级别，必须是 `event_name` 对应的固定级别。
      schema:
        type: string
        enum: [info, warn, error]
    EventOperation:
      name: operation
      in: query
      required: false
      description: 操作名，必须属于 `event_name` 允许的集合。
      schema:
        type: string
        enum: [install, start, stop, update, recover, scrape, publish]
    EventErrorCode:
      name: error_code
      in: query
      required: false
      description: 事件错误码，必须与 `event_name`、`operation` 相容。
      schema:
        type: string
        enum:
          - start_failed
          - stop_failed
          - update_failed
          - rollback_failed
          - recovery_failed
          - recovery_invalid
          - process_exited
          - scrape_timeout
          - network_failed
          - response_too_large
          - parse_failed
          - contract_invalid
          - content_invalid
          - http_invalid
          - scrape_failed
          - message_id_failed
          - publish_failed
    PluginIdFilter:
      name: plugin_id
      in: query
      required: false
      description: exporter 插件 ID。
      schema:
        type: string
        enum:
          - redis-exporter
          - mysql-exporter
          - rabbitmq-exporter
          - kafka-exporter
          - elasticsearch-exporter
          - victoriametrics-exporter
    ResourceCursor:
      name: cursor
      in: query
      required: false
      description: |
        不透明游标，由服务端签名并绑定发起者与查询类型；必须是唯一的查询参数，
        与任何过滤条件或时间参数同时出现时返回 400。
      schema:
        type: string
        maxLength: 8192
    CappedLimit:
      name: limit
      in: query
      required: false
      description: 单页条数，取值 1 到 100，缺省 50。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    AuditCursor:
      name: cursor
      in: query
      required: false
      description: |
        审计列表的不透明游标，最长 2048 字符，由服务端签名并绑定发起者；
        必须是唯一的查询参数，与任何过滤条件或时间参数同时出现时返回 400。
      schema:
        type: string
        maxLength: 2048
    AlertCursor:
      name: cursor
      in: query
      required: false
      description: 告警列表的不透明游标，最长 4096 字符，绑定发起者、查询类型与过滤条件。
      schema:
        type: string
        maxLength: 4096
    AlertSource:
      name: source
      in: query
      required: false
      description: 规则或事件的数据来源。
      schema:
        type: string
        enum: [metrics, logs, events]
    AlertSeverity:
      name: severity
      in: query
      required: false
      description: 严重级别。
      schema:
        type: string
        enum: [warning, critical]
    AlertStatus:
      name: status
      in: query
      required: false
      description: 规则当前的评估状态；仅规则列表接受该过滤。
      schema:
        type: string
        enum: [normal, pending, firing, disabled]
    IncidentStatus:
      name: status
      in: query
      required: false
      description: 事件状态；仅历史查询接受该过滤。
      schema:
        type: string
        enum: [firing, recovered, closed]
    RuleFilterId:
      name: rule
      in: query
      required: false
      description: 规则 ID，规范十进制正整数；仅历史查询接受该过滤。
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
    AlertRuleId:
      name: ruleId
      in: path
      required: true
      description: 告警规则 ID，规范十进制正整数。
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
    WindowStart:
      name: start
      in: query
      required: false
      description: 窗口起点，RFC3339Nano；缺省为终点前 90 天，允许非 UTC 时区。
      schema:
        type: string
        format: date-time
    WindowEnd:
      name: end
      in: query
      required: false
      description: 窗口终点，RFC3339Nano；缺省为服务端当前时间，允许非 UTC 时区。
      schema:
        type: string
        format: date-time
    AuditAction:
      name: action
      in: query
      required: false
      description: 审计动作过滤。
      schema:
        type: string
        enum:
          - bootstrap.declare
          - user.role.change
          - rule.create
          - rule.update
          - rule.enable
          - rule.disable
          - rule.delete
          - plugin.connection-test
          - plugin.install
          - plugin.configuration
          - plugin.start
          - plugin.stop
          - plugin.update
          - alert.trigger
          - alert.recover
          - alert.close
    AuditResourceType:
      name: resource_type
      in: query
      required: false
      description: 审计资源类型过滤。
      schema:
        type: string
        enum: [user, rule, plugin, alert]
    AuditOutcome:
      name: outcome
      in: query
      required: false
      description: 审计结果过滤。
      schema:
        type: string
        enum: [succeeded, failed, unknown]

  schemas:
    ErrorCode:
      type: string
      description: 稳定的错误标识，新增取值属于兼容变更。
      enum:
        - validation_failed
        - authentication_required
        - invalid_credentials
        - permission_denied
        - internal_error
        - user_not_found
        - username_conflict
        - post_not_found
        - notification_not_found
        - idempotency_conflict
        - command_result_unknown
        - command_outcome_unknown
        - data_epoch_mismatch
        - business_async_backlog
        - search_unavailable
        - metrics_unavailable
        - logs_unavailable
        - events_unavailable
        - alerts_unavailable
        - alert_not_found
        - alert_revision_conflict
        - alert_rule_limit
        - bootstrap_super_admin_protected
        - management_setup_unavailable
        - plugin_package_invalid
        - plugin_not_found
        - plugin_conflict
        - plugin_operation_in_progress
        - plugin_operation_failed
        - upgrade_required
        - monitor_unavailable
        - not_found
        - method_not_allowed
        - backend_busy

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 可直接展示给调用方的安全描述，不含内部细节。
        request_id:
          type: string
          description: 回显请求的 `X-Request-ID`，便于与日志和事件关联。

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'

    PageMeta:
      type: object
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, 'null']
          description: 下一页游标；为 `null` 时表示没有更多数据。

    Credentials:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          description: 去除首尾空白后 3 到 32 字节，仅允许 `[A-Za-z0-9_]`。
        password:
          type: string
          description: 至少 8 个 Unicode 码点，且 UTF-8 编码不超过 72 字节。

    UserPublic:
      type: object
      required: [id, username, role, created_at]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
        role:
          type: string
          enum: [user, super_admin]
        created_at:
          type: string
          format: date-time
        management_setup_available:
          type: boolean
          description: 管理端初始化存储是否可用；不可用或查询失败时该字段省略。

    ProfileInput:
      type: object
      required: [display_name, bio]
      additionalProperties: false
      properties:
        display_name:
          type: string
          description: 去除首尾空白后 1 到 64 个 Unicode 码点；两个字段必须同时出现。
        bio:
          type: string
          description: 允许空串；去除首尾空白后最多 160 个 Unicode 码点。

    Profile:
      type: object
      required: [id, username, display_name, bio, created_at, following, is_self]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
        display_name:
          type: string
        bio:
          type: string
        created_at:
          type: string
          format: date-time
        following:
          type: boolean
          description: 当前查看者是否关注该用户；查看自己时恒为 `false`。
        is_self:
          type: boolean
          description: 该资料是否属于当前查看者。

    FollowState:
      type: object
      required: [following]
      properties:
        following:
          type: boolean

    PostAuthor:
      type: object
      required: [id, username, display_name, following]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
        display_name:
          type: string
        following:
          type: boolean
          description: 当前查看者是否关注该作者。

    Post:
      type: object
      required:
        - id
        - title
        - content
        - created_at
        - updated_at
        - edited_at
        - content_revision
        - bookmarked_by_me
        - liked_by_me
        - comment_count
        - like_count
        - author
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          description: 去除首尾空白后 1 到 120 个 Unicode 码点。
        content:
          type: string
          description: 去除首尾空白后 1 到 10000 个 Unicode 码点。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        edited_at:
          type: [string, 'null']
          format: date-time
          description: 从未编辑时为 `null`。
        content_revision:
          type: integer
          format: int64
          minimum: 1
          description: 内容修订号，每次内容变化递增。
        bookmarked_by_me:
          type: boolean
        liked_by_me:
          type: boolean
        comment_count:
          type: integer
          format: int64
          minimum: 0
        like_count:
          type: integer
          format: int64
          minimum: 0
        author:
          $ref: '#/components/schemas/PostAuthor'

    PostInput:
      type: object
      required: [title, content]
      additionalProperties: false
      properties:
        title:
          type: string
          description: 去除首尾空白后 1 到 120 个 Unicode 码点。
        content:
          type: string
          description: 去除首尾空白后 1 到 10000 个 Unicode 码点。

    CommentAuthor:
      type: object
      required: [id, username]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string

    Comment:
      type: object
      required: [id, post_id, content, created_at, author]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        post_id:
          type: integer
          format: int64
          minimum: 1
        content:
          type: string
          description: 去除首尾空白后 1 到 2000 个 Unicode 码点。
        created_at:
          type: string
          format: date-time
        author:
          $ref: '#/components/schemas/CommentAuthor'

    CommentInput:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content:
          type: string
          description: 去除首尾空白后 1 到 2000 个 Unicode 码点。

    NotificationActor:
      type: object
      required: [id, username, display_name]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
        display_name:
          type: string

    Notification:
      type: object
      required:
        - id
        - type
        - created_at
        - read_at
        - actor
        - post_id
        - comment_id
        - resource_deleted
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
          description: |
            事件类型。当前业务拓扑只投递 `comment.created`、`post.liked`、`user.followed`，
            其余取值保留给同一事件族的历史与后续装配。
          enum:
            - comment.created
            - post.liked
            - user.followed
            - post.created
            - post.updated
            - post.deleted
        created_at:
          type: string
          format: date-time
        read_at:
          type: [string, 'null']
          format: date-time
          description: 未读时为 `null`。
        actor:
          $ref: '#/components/schemas/NotificationActor'
        post_id:
          type: [integer, 'null']
          format: int64
          description: 关联帖子；帖子被删除后置为 `null`。
        comment_id:
          type: [integer, 'null']
          format: int64
          description: 关联评论；帖子被删除后置为 `null`。
        resource_deleted:
          type: boolean
          description: 非关注类通知在关联资源被删除后为 `true`。

    CommandMeta:
      type: object
      required: [command_id, event_id, data_epoch, post_id, committed_at, replayed, resource_state]
      properties:
        command_id:
          type: string
          description: 幂等键对应的命令 ID。
        event_id:
          type: string
          description: 该命令产生的事件 ID，可用于与事件查询对齐。
        data_epoch:
          type: string
          description: 命令所属的数据 epoch。
        post_id:
          type: integer
          format: int64
          minimum: 1
        committed_at:
          type: string
          format: date-time
          description: 命令首次提交的时间；重放时保持不变。
        replayed:
          type: boolean
          description: 是否为重放响应。
        resource_state:
          type: string
          enum: [available, unavailable]
          description: 命令已提交时目标资源的可读性；`unavailable` 时 `data` 为 `null`。

    CommandContext:
      type: object
      required: [data_epoch, retry_window_seconds, retry_window_until]
      properties:
        data_epoch:
          type: string
          description: 当前生效的数据 epoch，作为 `X-GoPulse-Data-Epoch` 使用。
        retry_window_seconds:
          type: integer
          format: int64
          description: 命令结果的保留窗口，当前为 604800 秒（7 天）。
        retry_window_until:
          type: string
          format: date-time
          description: 保留窗口的结束时间。

    DataUserPublic:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/UserPublic'

    DataProfile:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Profile'

    DataProfilePage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
        meta:
          $ref: '#/components/schemas/PageMeta'

    DataFollowState:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FollowState'

    DataPost:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Post'

    DataPostPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        meta:
          $ref: '#/components/schemas/PageMeta'

    DataPostCommand:
      type: object
      required: [data, meta]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/Post'
            - type: 'null'
          description: 资源当前不可读时为 `null`，此时 `meta.resource_state` 为 `unavailable`。
        meta:
          $ref: '#/components/schemas/CommandMeta'

    DataPostOrCommand:
      description: |
        创建帖子返回两种形状之一：不带幂等键且未产生命令元数据时是 `{"data": Post}`；
        产生命令元数据时是 `{"data": Post|null, "meta": CommandMeta}`。
      oneOf:
        - $ref: '#/components/schemas/DataPost'
        - $ref: '#/components/schemas/DataPostCommand'

    DataCommandContext:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CommandContext'

    DataComment:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Comment'

    DataCommentPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        meta:
          $ref: '#/components/schemas/PageMeta'

    DataNotificationPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        meta:
          $ref: '#/components/schemas/PageMeta'

    AdminComponent:
      type: object
      required: [id, status, observed_at, reason_code]
      properties:
        id:
          type: string
          description: 组件 ID，固定集合之一：`backend`、`business-worker`、`search-indexer`、`monitor`、`router`、`marshaller`。
        status:
          $ref: '#/components/schemas/AdminStatus'
        observed_at:
          type: [string, 'null']
          format: date-time
        reason_code:
          type: string

    AdminKeyMetric:
      type: object
      required: [id, value, unit, observed_at, status, reason_code]
      properties:
        id:
          type: string
          description: 关键指标 ID，固定 6 项。
        value:
          type: [number, 'null']
        unit:
          type: string
        observed_at:
          type: [string, 'null']
          format: date-time
        status:
          $ref: '#/components/schemas/AdminStatus'
        reason_code:
          type: string

    AdminSeverityCount:
      type: object
      required: [severity, value, status]
      properties:
        severity:
          type: string
          enum: [info, warn, error]
        value:
          type: [integer, 'null']
          format: int64
        status:
          $ref: '#/components/schemas/AdminStatus'

    AdminPlugin:
      type: object
      required: [id, installed, desired, observed, up, observed_at, status, reason_code]
      properties:
        id:
          type: string
          description: exporter 插件 ID，固定 6 项。
        installed:
          type: [boolean, 'null']
        desired:
          type: string
        observed:
          type: string
        up:
          type: [number, 'null']
        observed_at:
          type: [string, 'null']
          format: date-time
        status:
          $ref: '#/components/schemas/AdminStatus'
        reason_code:
          type: string

    AdminAlertRecovery:
      type: object
      required: [rule_id, revision, severity, recovered_at]
      properties:
        rule_id:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        severity:
          type: string
          enum: [warning, critical]
        recovered_at:
          type: string
          format: date-time

    AdminAlertSummary:
      type: object
      required:
        - recoveries
        - warning_firing
        - critical_firing
        - pending
        - unknown
        - recently_recovered
        - evaluator_enabled
        - last_success_at
      properties:
        recoveries:
          type: array
          items:
            $ref: '#/components/schemas/AdminAlertRecovery'
        warning_firing:
          type: integer
          format: int64
        critical_firing:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
        unknown:
          type: integer
          format: int64
        recently_recovered:
          type: integer
          format: int64
        evaluator_enabled:
          type: boolean
        last_success_at:
          type: [string, 'null']
          format: date-time

    AdminStatus:
      type: string
      enum: [healthy, degraded, unavailable]

    AdminSection:
      type: object
      required: [status, observed_at, reason_code]
      properties:
        status:
          $ref: '#/components/schemas/AdminStatus'
        observed_at:
          type: [string, 'null']
          format: date-time
        reason_code:
          type: string
          description: |
            取值为 `ok`、`partial_data`、`stale`、`dependency_down`、`missing`、`not_installed`、
            `process_failed`、`monitor_unavailable`、`upstream_unavailable` 之一。

    AdminSnapshot:
      type: object
      required: [generated_at, status, components, key_metrics, logs, events, plugins, alerts]
      properties:
        generated_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AdminStatus'
        components:
          allOf:
            - $ref: '#/components/schemas/AdminSection'
            - type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/AdminComponent'
        key_metrics:
          allOf:
            - $ref: '#/components/schemas/AdminSection'
            - type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/AdminKeyMetric'
        logs:
          allOf:
            - $ref: '#/components/schemas/AdminSection'
            - type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/AdminSeverityCount'
        events:
          allOf:
            - $ref: '#/components/schemas/AdminSection'
            - type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/AdminSeverityCount'
        plugins:
          allOf:
            - $ref: '#/components/schemas/AdminSection'
            - type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/AdminPlugin'
        alerts:
          allOf:
            - $ref: '#/components/schemas/AdminSection'
            - type: object
              required: [items]
              properties:
                items:
                  description: 正常情况下是单个汇总对象；该分段不可用时为空数组。
                  oneOf:
                    - $ref: '#/components/schemas/AdminAlertSummary'
                    - type: array
                      maxItems: 0
                      items: {}

    MetricDefinition:
      type: object
      required: [source, target_id, producer_kind, producer_id, metric, kind, unit]
      properties:
        source:
          type: string
        target_id:
          type: string
        producer_kind:
          type: string
        producer_id:
          type: string
        metric:
          type: string
        kind:
          type: string
          enum: [gauge, counter]
        unit:
          type: string
          enum: [none, boolean, seconds, count, bytes, state, unix_seconds]
        label_keys:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            maxLength: 64

    MetricAlertDefinition:
      type: object
      required: [metric, kind, unit, label_keys, allowed_tuples, reducers]
      properties:
        metric:
          type: string
        kind:
          type: string
          enum: [gauge, counter]
        unit:
          type: string
        label_keys:
          type: array
          items:
            type: string
        allowed_tuples:
          type: array
          description: 允许出现的标签取值组合，顺序与 `label_keys` 对齐。
          items:
            type: array
            items:
              type: string
        reducers:
          type: array
          items:
            type: string

    MetricLabels:
      type: object
      description: 动态指标标签。每条序列最多 16 个标签，标签键最长 64 字节，标签值最长 256 字节。来源和生产者身份由服务端校验，不作为业务标签返回。
      maxProperties: 16
      additionalProperties:
        type: string
        maxLength: 256

    MetricPoint:
      type: object
      required: [timestamp, value]
      properties:
        timestamp:
          type: string
          format: date-time
        value:
          type: number

    MetricSeries:
      type: object
      required: [labels, points]
      properties:
        labels:
          $ref: '#/components/schemas/MetricLabels'
        points:
          type: array
          items:
            $ref: '#/components/schemas/MetricPoint'

    MetricResult:
      type: object
      required: [metric, kind, unit, range, from, to, step_seconds, series]
      properties:
        metric:
          type: string
        kind:
          type: string
          enum: [gauge, counter]
        unit:
          type: string
        range:
          type: string
          enum: ['15m', '1h', '6h', '24h']
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        step_seconds:
          type: integer
          format: int64
          enum: [15, 60, 300, 900]
        series:
          type: array
          items:
            $ref: '#/components/schemas/MetricSeries'

    LogEntry:
      type: object
      required: [timestamp, level, service, module, message]
      description: 只有 5 个固定字段必然出现，其余字段按日志上下文出现。
      properties:
        timestamp: {type: string, format: date-time}
        level: {type: string, enum: [info, warn, error]}
        service: {type: string}
        module: {type: string}
        message: {type: string}
        instance_id: {type: string}
        request_id: {type: string}
        trace_id: {type: string}
        span_id: {type: string}
        attempt_id: {type: string}
        event_id: {type: string}
        event_type: {type: string}
        user_id: {type: integer, format: int64}
        post_id: {type: integer, format: int64}
        content_revision: {type: integer, format: int64}
        comment_id: {type: integer, format: int64}
        notification_id: {type: integer, format: int64}
        outbox_id: {type: integer, format: int64}
        method: {type: string}
        route: {type: string}
        status: {type: integer, format: int64}
        duration_ms: {type: integer, format: int64}
        response_bytes: {type: integer, format: int64}
        error_code: {type: string}
        reason: {type: string}
        operation: {type: string}
        resource: {type: string}
        stage: {type: string}
        result: {type: string}
        attempt: {type: integer, format: int64}
        batch_size: {type: integer, format: int64}
        document_count: {type: integer, format: int64}
        panic_recovered: {type: boolean}
        response_committed: {type: boolean}

    EventMetadata:
      type: object
      required: [plugin_id]
      properties:
        plugin_id: {type: string}
        plugin_version: {type: string}
        previous_plugin_version: {type: string}
        operation: {type: string}
        from_state: {type: string}
        to_state: {type: string}
        error_code: {type: string}
        scrape_status: {type: string}

    EventEntry:
      type: object
      required: [timestamp, event_name, source, severity, message, metadata]
      properties:
        timestamp: {type: string, format: date-time}
        event_name: {type: string}
        source: {type: string}
        severity: {type: string, enum: [info, warn, error]}
        message: {type: string}
        metadata:
          $ref: '#/components/schemas/EventMetadata'

    ManagedUser:
      type: object
      required: [id, username, role, created_at, is_bootstrap_super_admin]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          enum: [user, super_admin]
        created_at:
          type: string
          format: date-time
        is_bootstrap_super_admin:
          type: boolean

    RoleChange:
      type: object
      required: [user, changed]
      properties:
        user:
          $ref: '#/components/schemas/ManagedUser'
        changed:
          type: boolean
          description: 角色是否实际发生变化。

    AuditEvent:
      type: object
      required:
        - id
        - operation_id
        - occurred_at
        - actor_kind
        - actor_user_id
        - action
        - resource_type
        - resource_id
        - phase
        - outcome
        - request_id
        - details_json
      properties:
        id:
          type: integer
          format: int64
        operation_id:
          type: string
          description: 审计操作 ID，32 位小写十六进制。
        occurred_at:
          type: string
          format: date-time
        actor_kind:
          type: string
          enum: [user, system]
        actor_user_id:
          type: [integer, 'null']
          format: int64
          description: 系统动作时为 `null`。
        action:
          type: string
          description: 动作名，取自固定集合，例如 `user.role.change`、`plugin.install`、`alert.trigger`。
        resource_type:
          type: string
          enum: [user, rule, plugin, alert]
        resource_id:
          type: string
        phase:
          type: string
          enum: [requested, completed]
        outcome:
          type: string
          enum: [succeeded, failed, unknown]
        request_id:
          type: string
        details_json:
          description: 动作相关的结构化明细，形状随 `action` 变化。

    AlertSelector:
      type: object
      required: [metric, labels]
      properties:
        metric:
          type: string
          description: 仅 `metrics` 来源使用；`logs` 与 `events` 来源必须为空串。
        labels:
          type: [object, 'null']
          additionalProperties:
            type: string
          description: |
            `metrics` 来源必须显式给出，键集合与指标定义的 `label_keys` 一致，取值组合必须命中 `allowed_tuples`；
            无标签的指标发送 `{}`。

    AlertRuleInput:
      type: object
      required: [name, severity, source, selector, reducer, operator, threshold, window, for]
      properties:
        name:
          type: string
          description: 1 到 80 字节，合法 UTF-8，至少含一个非空白字符，不含控制字符。
        enabled:
          type: boolean
          description: 仅创建时必填；更新时必须省略，取值沿用库中已有状态。
        severity:
          type: string
          enum: [warning, critical]
        source:
          type: string
          enum: [metrics, logs, events]
        selector:
          $ref: '#/components/schemas/AlertSelector'
        reducer:
          type: string
          description: |
            `metrics` 来源取该指标定义的 `reducers`（gauge 为 `last`、`max`、`min`、`avg`，counter 为 `increase`）；
            `logs` 与 `events` 来源必须为 `count`。
        operator:
          type: string
          enum: [gt, gte, lt, lte, eq, neq]
        threshold:
          type: number
          description: 非 NaN/Inf，绝对值不超过 1e15。
        window:
          type: string
          enum: ['1m', '5m', '15m']
        for:
          type: string
          enum: ['0s', '1m', '5m']
          description: 持续时间不得超过 `window`。
        revision:
          type: integer
          format: int64
          description: 创建时必须为 0 或省略；更新、启停与删除时必须不小于 1，并与库中版本一致。

    AlertRevisionRequest:
      type: object
      required: [revision]
      additionalProperties: false
      description: 启停与删除只接受版本号，用于乐观并发控制。
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: 必须与库中当前版本一致，否则返回 409 `alert_revision_conflict`。

    AlertState:
      type: object
      required:
        - state
        - data_status
        - pending_since
        - active_incident_id
        - last_value
        - last_evaluated_at
        - last_success_at
        - error_code
      properties:
        state:
          type: string
          enum: [normal, pending, firing, disabled]
        data_status:
          type: string
          enum: [ok, unknown, stale]
          description: 创建与更新响应固定为 `unknown`。
        pending_since:
          type: [string, 'null']
          format: date-time
        active_incident_id:
          type: [integer, 'null']
          format: int64
        last_value:
          type: [number, 'null']
        last_evaluated_at:
          type: [string, 'null']
          format: date-time
        last_success_at:
          type: [string, 'null']
          format: date-time
        error_code:
          type: string
          description: 空串或 `<source>_unknown`，例如 `metrics_unknown`。

    AlertRule:
      allOf:
        - $ref: '#/components/schemas/AlertRuleInput'
        - type: object
          required: [enabled, revision, id, created_by, updated_by, created_at, updated_at, evaluation]
          properties:
            enabled:
              type: boolean
            revision:
              type: integer
              format: int64
              minimum: 1
            id:
              type: integer
              format: int64
            created_by:
              type: integer
              format: int64
            updated_by:
              type: integer
              format: int64
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            evaluation:
              $ref: '#/components/schemas/AlertState'

    AlertIncident:
      type: object
      required:
        - id
        - rule_id
        - revision
        - name
        - severity
        - source
        - object
        - status
        - first_triggered_at
        - last_triggered_at
        - last_evaluated_at
        - recovered_at
        - closed_at
        - resolution_reason
        - last_value
        - evaluation_count
        - data_status
      properties:
        id:
          type: integer
          format: int64
        rule_id:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        name:
          type: string
        severity:
          type: string
          enum: [warning, critical]
        source:
          type: string
          enum: [metrics, logs, events]
        object:
          $ref: '#/components/schemas/AlertSelector'
        status:
          type: string
          enum: [firing, recovered, closed]
        first_triggered_at:
          type: string
          format: date-time
        last_triggered_at:
          type: string
          format: date-time
        last_evaluated_at:
          type: string
          format: date-time
        recovered_at:
          type: [string, 'null']
          format: date-time
        closed_at:
          type: [string, 'null']
          format: date-time
        resolution_reason:
          type: string
          description: 空串或 `rule_updated`、`rule_disabled`、`rule_deleted`。
        last_value:
          type: [number, 'null']
        evaluation_count:
          type: integer
          format: int64
        data_status:
          type: string
          description: 规则当前的数据状态；无关联状态行时为 `historical`。

    CountCatalog:
      type: object
      required: [fields, allowed_combinations, reducers, minimum_selectors]
      properties:
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        allowed_combinations:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
        reducers:
          type: array
          items:
            type: string
        minimum_selectors:
          type: integer

    AlertCatalog:
      type: object
      required: [logs, events, creatable_sources, metrics, operators, windows, for, severities]
      properties:
        logs:
          $ref: '#/components/schemas/CountCatalog'
        events:
          $ref: '#/components/schemas/CountCatalog'
        creatable_sources:
          type: array
          items:
            type: string
            enum: [metrics, logs, events]
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/MetricAlertDefinition'
        operators:
          type: array
          items:
            type: string
        windows:
          type: array
          items:
            type: string
        for:
          type: array
          items:
            type: string
        severities:
          type: array
          items:
            type: string

    PluginLastError:
      type: object
      required: [code, message, at]
      properties:
        code:
          type: string
        message:
          type: string
        at:
          type: string
          format: date-time

    PluginStatus:
      type: object
      required:
        - id
        - name
        - version
        - kind
        - source
        - desired_state
        - observed_state
        - installed_at
        - updated_at
        - started_at
        - last_scrape_at
        - last_success_at
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
          description: 语义化版本。
        kind:
          type: string
          description: 当前固定为 `metrics-exporter`。
        source:
          type: string
          description: 6 个官方 exporter 之一。
        desired_state:
          type: string
          enum: [running, stopped]
        observed_state:
          type: string
          enum: [installing, starting, running, stopping, stopped, updating, failed]
        installed_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        last_scrape_at:
          type: [string, 'null']
          format: date-time
        last_success_at:
          type: [string, 'null']
          format: date-time
        last_error:
          $ref: '#/components/schemas/PluginLastError'

    PluginConfigField:
      type: object
      required: [name, type, required, secret]
      properties:
        name: {type: string}
        type:
          type: string
          enum: [hostname, port, integer, string, secret, duration]
        required: {type: boolean}
        secret: {type: boolean}
        minimum: {type: integer}
        maximum: {type: integer}
        enum:
          type: array
          items:
            type: string
          description: 仅固定取值的字段给出，例如 `vhost`、`topic`。

    PluginSchema:
      type: object
      required: [schema_version, plugin_id, fields]
      properties:
        schema_version:
          type: integer
          enum: [1]
        plugin_id:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/PluginConfigField'

    PluginCatalogItem:
      type: object
      required: [id, name, source, available, configured, secret_configured, revision, summary, schema]
      properties:
        id:
          type: string
        name:
          type: string
        source:
          type: string
        available:
          type: boolean
        configured:
          type: boolean
        secret_configured:
          type: boolean
        revision:
          type: string
          description: 未配置时为空串，已配置时为 32 位小写十六进制。
        summary:
          type: string
          enum: [not_configured, configured, upgrade_required]
        schema:
          $ref: '#/components/schemas/PluginSchema'

    PluginConfigRequest:
      type: object
      required: [config]
      additionalProperties: false
      properties:
        config:
          type: object
          description: |
            插件专属配置，键集合必须与 `GET /api/v1/exporter-plugins/catalog` 中该插件的 `fields` 对齐：
            - `redis-exporter`：`host`、`port`、`database`、`connect_timeout`、`scrape_timeout`
            - `mysql-exporter`：`host`、`port`、`database`、`username`、`connect_timeout`、`scrape_timeout`
            - `rabbitmq-exporter`：`host`、`management_port`、`vhost`、`username`、`connect_timeout`、`scrape_timeout`
            - `kafka-exporter`：`host`、`port`、`topic`、`consumer_group`、`connect_timeout`、`scrape_timeout`
            - `elasticsearch-exporter`：`host`、`port`、`username`（可选）、`connect_timeout`、`scrape_timeout`
            - `victoriametrics-exporter`：`host`、`port`、`username`、`connect_timeout`、`scrape_timeout`

            校验细节：`port` 类字段只接受 JSON 整数；`hostname` 只接受字符串，容器模式必须是官方主机名，
            宿主模式必须是 `127.0.0.1` 或 `::1`；`duration` 类字段要求 `connect_timeout` 不小于 100ms、
            `scrape_timeout` 不大于 10s，且前者不大于后者；`string` 类字段只允许字母、数字、`.`、`_`、`-`；
            固定取值字段必须等于目录中声明的枚举值。
          additionalProperties: true
        secrets:
          type: object
          additionalProperties: false
          description: |
            只允许 `password` 键，值为 1 到 256 字节的合法 UTF-8，且不含控制字符。
            `kafka-exporter` 不使用密钥；`elasticsearch-exporter` 的用户名与密码必须同时提供或同时省略。
            创建与连通性测试必须显式提供；更新配置时省略表示沿用已存密钥。
          properties:
            password:
              type: string

    PluginReachable:
      type: object
      required: [reachable]
      properties:
        reachable:
          type: boolean

    DataAdminSnapshot:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AdminSnapshot'

    DataMetricDefinitionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MetricDefinition'

    DataMetricResult:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MetricResult'

    DataLogPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        meta:
          $ref: '#/components/schemas/PageMeta'

    DataEventPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EventEntry'
        meta:
          $ref: '#/components/schemas/PageMeta'

    DataAlertCatalog:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AlertCatalog'

    DataAlertRule:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AlertRule'

    DataAlertRulePage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AlertRule'
        meta:
          $ref: '#/components/schemas/PageMeta'

    DataAlertIncidentPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AlertIncident'
        meta:
          $ref: '#/components/schemas/PageMeta'

    DataManagedUser:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ManagedUser'

    DataRoleChange:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RoleChange'

    DataAuditEventPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        meta:
          $ref: '#/components/schemas/PageMeta'

    DataPluginStatus:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PluginStatus'

    DataPluginStatusList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PluginStatus'

    DataPluginCatalog:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PluginCatalogItem'

    DataPluginReachable:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PluginReachable'

    Probe:
      type: object
      required: [status, contract_version]
      properties:
        status:
          type: string
          description: 探针状态，取值 `ok`、`starting`、`stopping`、`not_ready`、`invalid_request`、`method_not_allowed`、`not_found`。
        contract_version:
          type: string
          description: 运行时合同版本，与发布 Bundle 中的合同一致。

  requestBodies:
    Credentials:
      required: true
      description: 注册与登录共用同一请求体；未知字段被拒绝。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Credentials'

  headers:
    SessionCookie:
      description: |
        会话 Cookie，值为 HS256 签名的令牌，`HttpOnly`、`SameSite=Lax`，
        `Secure` 与有效期由部署配置决定（默认 2 小时）。
      schema:
        type: string

  responses:
    BadRequest:
      description: 请求形状或参数校验失败。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validation:
              value:
                error:
                  code: validation_failed
                  message: limit must be an integer between 1 and 50
    Unauthorized:
      description: 缺少有效会话。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            required:
              value:
                error:
                  code: authentication_required
                  message: authentication is required
    Forbidden:
      description: 已认证但权限不足，或跨源写请求被拒。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            permission:
              value:
                error:
                  code: permission_denied
                  message: super administrator permission is required
    NotFound:
      description: 目标资源不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            not_found:
              value:
                error:
                  code: post_not_found
                  message: post not found
    Conflict:
      description: 与当前资源状态冲突，例如幂等键复用、用户名占用或版本冲突。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: 依赖不可用、结果未知或写入积压。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unavailable:
              value:
                error:
                  code: search_unavailable
                  message: search is temporarily unavailable
            busy:
              value:
                error:
                  code: backend_busy
                  message: service temporarily busy
    InternalError:
      description: 未预期的服务端错误；响应不包含内部细节。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            internal:
              value:
                error:
                  code: internal_error
                  message: an internal error occurred
    ProbeOk:
      description: 探针通过。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Probe'
          examples:
            ok:
              value:
                status: ok
                contract_version: '2'
    ProbeInvalid:
      description: 探针收到查询串、请求体或传输编码。
      headers:
        Cache-Control:
          schema:
            type: string
          description: 固定为 `no-store`。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Probe'
          examples:
            invalid:
              value:
                status: invalid_request
                contract_version: '2'
    ProbeMethodNotAllowed:
      description: 探针只接受 GET。
      headers:
        Allow:
          schema:
            type: string
          description: 固定为 `GET`。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Probe'
          examples:
            method:
              value:
                status: method_not_allowed
                contract_version: '2'
    ProbeStarting:
      description: 进程尚未完成启动。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Probe'
    ProbeNotReady:
      description: 依赖检查未通过或进程正在停机。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Probe'
