openapi: 3.1.0

info:
  title: GoPulse API
  version: 2.6.5
  summary: 社交业务与观测系统的 HTTP 接口
  description: |
    GoPulse 后端对外暴露的 `/api/v1` 接口，以及用于探针的运行时端点。

    ## 会话与鉴权

    登录成功后服务端下发会话 Cookie（默认名 `gopulse_session`，可用 `AUTH_COOKIE_NAME` 覆盖），
    属性为 `HttpOnly`、`SameSite=Lax`，`Secure` 由部署环境决定，有效期与配置的会话 TTL 一致。
    受保护接口只认这个 Cookie，不使用 `Authorization` 头，也没有第三方 JWT。

    管理端接口在会话之上再校验角色：角色以 MySQL 中的记录为准，必须是超级管理员；
    未认证返回 401 `authentication_required`，角色不足返回 403 `permission_denied`，
    超级管理员记录被保护或初始化存储不可用时分别返回 409 `bootstrap_super_admin_protected`
    与 503 `management_setup_unavailable`。

    ## 同源写保护

    非 GET/HEAD/OPTIONS 请求会校验来源：带 `Origin` 时要求其 scheme 与 host 与请求一致
    （`X-Forwarded-Proto` 参与判断），无 `Origin` 但带 `Sec-Fetch-Site` 时要求值为
    `same-origin` 或 `none`，否则返回 403 `permission_denied`。
    不带这两个头的非浏览器客户端不受影响。

    ## 响应信封

    成功响应统一为 `{"data": ...}`；分页接口附加 `"meta": {"next_cursor": ...}`；
    带稳定身份的命令响应附加端点自定义的 `meta` 对象。
    失败响应统一为 `{"error": {"code", "message", "request_id"}}`，`code` 是稳定标识，
    `request_id` 回显 `X-Request-ID`（框架层写出时总是存在，业务层写出时可能省略）。

    错误码到状态码的映射由后端集中维护：

    | HTTP | 错误码 |
    | --- | --- |
    | 400 | `validation_failed`、`plugin_package_invalid` |
    | 401 | `authentication_required`、`invalid_credentials` |
    | 403 | `permission_denied` |
    | 404 | `alert_not_found`、`user_not_found`、`post_not_found`、`notification_not_found`、`plugin_not_found`、`command_result_unknown` |
    | 409 | `alert_revision_conflict`、`alert_rule_limit`、`bootstrap_super_admin_protected`、`upgrade_required`、`username_conflict`、`plugin_conflict`、`plugin_operation_in_progress`、`data_epoch_mismatch`、`idempotency_conflict` |
    | 422 | `plugin_operation_failed` |
    | 503 | `alerts_unavailable`、`management_setup_unavailable`、`search_unavailable`、`monitor_unavailable`、`metrics_unavailable`、`logs_unavailable`、`events_unavailable`、`command_outcome_unknown`、`business_async_backlog`、`backend_busy` |
    | 500 | `internal_error` |

    未匹配的路径返回 404 `not_found`（框架层写出，`request_id` 恒存在），方法不匹配返回 405
    `method_not_allowed`，后端并发准入配额耗尽返回 503 `backend_busy`，三者都使用同一信封。
    删除类接口成功时返回 204 且不带响应体。

    ## 请求头与体积

    `X-Request-ID` 只在恰好一个取值且为 32 位小写十六进制时沿用，否则服务端重新生成；
    无论哪种情况响应都会回显该头，错误信封的 `request_id` 取自同一个值。

    请求体上限按端点分档：`/api/v1` 下的 JSON 端点默认 64 KiB，超出返回 400
    `validation_failed`；exporter 插件配置与连通性测试的 JSON 上限 16 KiB，插件包上限
    64 MiB。JSON 端点拒绝未知字段、重复键与多值请求体；插件配置端点还要求
    `Content-Type` 恰好为 `application/json` 且不带参数，并不允许 `Content-Encoding`。

    ## 标识与编号

    用户、帖子、评论、通知、规则与事件的 ID 是 64 位无符号整数，以 JSON 数字返回；
    超出 JavaScript 安全整数范围时前端应转换为字符串处理。路径参数只接受规范的十进制写法，
    前导零（`007`）被拒绝并返回 400 `validation_failed`。

    ## 分页

    列表接口使用游标分页：帖子、用户维度、搜索、通知与评论的 `limit` 默认为 20、上限为 50；
    审计、告警、日志与事件的 `limit` 默认为 50、上限为 100。`cursor` 取自上一页
    `meta.next_cursor`，`next_cursor` 为 `null` 表示已到末尾。
    同一参数重复出现或格式不合法时返回 400 `validation_failed`；观测类接口对未知参数更严格，
    查询里出现目录外的键同样返回 400。
    游标形态按端点不同：帖子与通知是未签名的时间戳游标，收藏带 HMAC 签名并绑定查看者，
    搜索类游标绑定查询词与数据快照且有存活时间；审计、告警、日志与事件的游标必须单独使用，
    与任何过滤条件同时出现会被拒绝。游标不可跨端点或跨用户复用。

    ## 幂等

    `POST /api/v1/posts` 与 `GET /api/v1/post-commands/result` 支持幂等重放：
    两个请求头 `Idempotency-Key` 与 `X-GoPulse-Data-Epoch` 可选，但必须同时出现，
    取值都是规范的小写 UUID。同键同 epoch 且内容摘要一致时返回原结果并置 `meta.replayed`；
    内容不同返回 409 `idempotency_conflict`，epoch 过期返回 409 `data_epoch_mismatch`。
    其余写接口不具备幂等键，重复调用按其自身语义处理（点赞、收藏、标记已读为幂等；
    删除第二次返回 404）。

    ## 运行端点

    `/startup`、`/live`、`/ready`、`/health` 不在 `/api/v1` 下，不要求会话，
    返回 `{"status": ..., "contract_version": ...}`，供 Compose 健康检查与验收工具使用。

servers:
  - url: /
    description: 与前端同源的入口；生产环境由 nginx 转发到 backend 副本

tags:
  - name: Auth
    description: 注册、登录、登出与会话恢复
  - name: Users
    description: 用户资料、关系与用户维度列表
  - name: Posts
    description: 帖子读写、幂等命令与搜索可见性
  - name: Interactions
    description: 评论、点赞与收藏
  - name: Search
    description: 帖子与用户检索
  - name: Notifications
    description: 异步通知
  - name: Admin
    description: 总览、用户与角色、审计事件
  - name: Observability
    description: |
      指标、日志与事件查询。三类数据各自独立：指标后端不可用返回 503 `metrics_unavailable`，
      日志存储不可用返回 503 `logs_unavailable`，事件存储不可用返回 503 `events_unavailable`。
  - name: Alerts
    description: |
      告警规则、当前事件与历史。告警存储不可用时统一返回 503 `alerts_unavailable`；
      写操作以 `revision` 做乐观并发控制，版本不一致返回 409 `alert_revision_conflict`。
  - name: Exporter Plugins
    description: |
      管理端专用的 exporter 插件安装、配置与生命周期接口。上游 monitor 失败统一映射为
      503 `monitor_unavailable`；请求形状由中间件先校验：任何查询串都返回 400
      `plugin_package_invalid`，GET 与启停接口还要求请求体为空，非 GET 请求会先写审计。
  - name: Runtime
    description: 探针端点

security:
  - cookieAuth: []

paths:
  /startup:
    get:
      tags: [Runtime]
      summary: 进程启动探针
      description: |
        进程完成初始化后返回 200；未完成时返回 503 `starting`。
        响应带 `Cache-Control: no-store` 与 `X-Content-Type-Options: nosniff`，并回显 `X-Request-ID`。
      security: []
      responses:
        '200':
          $ref: '#/components/responses/ProbeOk'
        '400':
          $ref: '#/components/responses/ProbeInvalid'
        '405':
          $ref: '#/components/responses/ProbeMethodNotAllowed'
        '503':
          $ref: '#/components/responses/ProbeStarting'

  /live:
    get:
      tags: [Runtime]
      summary: 进程存活探针
      description: 进程存活即返回 200，不检查依赖。
      security: []
      responses:
        '200':
          $ref: '#/components/responses/ProbeOk'
        '400':
          $ref: '#/components/responses/ProbeInvalid'
        '405':
          $ref: '#/components/responses/ProbeMethodNotAllowed'

  /ready:
    get:
      tags: [Runtime]
      summary: 就绪探针
      description: |
        依赖检查通过返回 200；依赖不可用返回 503 `not_ready`，停机中返回 503 `stopping`。
        检查内容为 MySQL 连通性与运行时模式，结果缓存 250 毫秒。
      security: []
      responses:
        '200':
          $ref: '#/components/responses/ProbeOk'
        '400':
          $ref: '#/components/responses/ProbeInvalid'
        '405':
          $ref: '#/components/responses/ProbeMethodNotAllowed'
        '503':
          $ref: '#/components/responses/ProbeNotReady'

  /health:
    get:
      tags: [Runtime]
      summary: 健康探针
      description: 与 `/ready` 共用同一处理器，但不做依赖检查，也不因未启动或停机而返回 503。
      security: []
      responses:
        '200':
          $ref: '#/components/responses/ProbeOk'
        '400':
          $ref: '#/components/responses/ProbeInvalid'
        '405':
          $ref: '#/components/responses/ProbeMethodNotAllowed'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: 注册账号并建立会话
      description: |
        用户名在 `utf8mb4_0900_ai_ci` 排序规则下唯一，因此大小写与重音不同的同名注册同样返回冲突。
        成功后与登录一样下发会话 Cookie。
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '201':
          description: 注册成功。
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUserPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 用户名已被占用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                conflict:
                  value:
                    error:
                      code: username_conflict
                      message: username is already taken
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 登录并下发会话 Cookie
      description: |
        用户名不存在与密码不匹配返回同一错误码，不区分原因。
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          description: 登录成功。
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUserPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 凭据不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalid:
                  value:
                    error:
                      code: invalid_credentials
                      message: invalid username or password
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 清除会话 Cookie
      description: |
        不要求已登录：无论当前会话是否有效都返回 204，并把 Cookie 置为过期。
        请求体被忽略。
      security: []
      responses:
        '204':
          description: 会话已清除。
          headers:
            Set-Cookie:
              description: 同名 Cookie，`Max-Age=-1`，立即过期。
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: 读取当前会话的用户
      description: |
        会话令牌有效但用户已不存在时返回 401 并同时清除会话 Cookie。
        `management_setup_available` 反映管理端初始化存储是否可用，不可用时省略。
      responses:
        '200':
          description: 当前用户。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUserPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/users/me/profile:
    patch:
      tags: [Users]
      summary: 更新当前用户的资料
      description: |
        两个字段都必须出现，缺少任一字段返回 400，不做部分更新。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          description: 更新后的资料。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/users/{userId}/follow:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Users]
      summary: 关注用户
      description: |
        重复关注保持 200 且状态仍为已关注；自己关注自己返回 400。
        成功时同事务写入 `user_follows` 与 `user.followed` 事件。
      responses:
        '200':
          description: 关注后的关系状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataFollowState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Users]
      summary: 取消关注
      description: 未关注时同样返回 200 且状态为未关注。
      responses:
        '200':
          description: 取消后的关系状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataFollowState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/users/me/following:
    get:
      tags: [Users]
      summary: 我关注的人
      description: |
        按关注关系创建时间倒序，游标时间戳取自 `user_follows.created_at`。
        只接受 `limit` 与 `cursor`，出现其他查询参数返回 400 `validation_failed`。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 关注列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProfilePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/users/me/followers:
    get:
      tags: [Users]
      summary: 关注我的人
      description: 与「我关注的人」使用同一游标契约，时间戳取自关注关系创建时间。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 粉丝列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProfilePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/users/{username}:
    get:
      tags: [Users]
      summary: 按用户名读取资料
      description: |
        查询按列的排序规则做等值比较，大小写与重音不敏感。
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: 用户资料。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/users/{username}/posts:
    get:
      tags: [Users]
      summary: 读取指定用户的帖子
      description: 用户不存在时返回 404，不做空列表兜底；未知查询参数被忽略。
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 该用户的帖子。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPostPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/search/users:
    get:
      tags: [Search]
      summary: 检索用户
      description: |
        匹配分三档：用户名完全相等、用户名或昵称前缀匹配、包含匹配，按档位升序、同档按 `id` 升序。
        游标带 HMAC 签名并绑定查询词，换词复用游标返回 400。
        只接受 `q`、`limit`、`cursor`，出现其他查询参数返回 400 `validation_failed`。
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/UserSearchCursor'
      responses:
        '200':
          description: 匹配到的用户。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProfilePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/post-commands/context:
    get:
      tags: [Posts]
      summary: 读取命令上下文
      description: |
        返回当前 `data_epoch` 与命令结果保留窗口，用于发起或查证幂等写命令。
        只读探测，可任意重试。
      responses:
        '200':
          description: 命令上下文。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCommandContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/post-commands/result:
    get:
      tags: [Posts]
      summary: 查证幂等命令的结果
      description: |
        用与创建时相同的两个请求头取回已提交命令的结果，不改动状态，可任意重试。
        命令不存在、尚未成功或已超出保留窗口时返回 404 `command_result_unknown`。
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 创建时使用的幂等键，规范的小写 UUID。
          schema:
            type: string
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        - name: X-GoPulse-Data-Epoch
          in: header
          required: true
          description: 创建时使用的数据 epoch，与幂等键必须成对出现。
          schema:
            type: string
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      responses:
        '200':
          description: 命令结果；`meta.replayed` 恒为 `true`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPostCommand'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 命令结果不可用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unknown:
                  value:
                    error:
                      code: command_result_unknown
                      message: the post command result is not available
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/posts:
    post:
      tags: [Posts]
      summary: 创建帖子
      description: |
        作者取自会话，请求体不接受作者字段。
        两个幂等请求头可选但必须成对：不带时按普通创建处理，带时按 `Idempotency-Key` 重放。
        推荐流程是先取 `GET /api/v1/post-commands/context` 的 `data_epoch`，再带两个头提交；
        超时后用同样的两个头重试本接口或调用结果查证接口。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DataEpoch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '201':
          description: 创建结果；可能带命令元数据。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPostOrCommand'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 命令结果的保留窗口已过期。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                expired:
                  value:
                    error:
                      code: command_result_unknown
                      message: the post command result is not available
        '409':
          description: 幂等键冲突或数据 epoch 不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                idempotency:
                  value:
                    error:
                      code: idempotency_conflict
                      message: the idempotency key was already used with different content
                epoch:
                  value:
                    error:
                      code: data_epoch_mismatch
                      message: the post command belongs to another data epoch
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Posts]
      summary: 时间线
      description: |
        按创建时间倒序返回全部帖子；未知查询参数被静默忽略。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 帖子列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPostPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/posts/following:
    get:
      tags: [Posts]
      summary: 关注流
      description: |
        只返回当前用户已关注作者的帖子，按创建时间倒序。
        只接受 `limit` 与 `cursor`，出现其他查询参数返回 400 `validation_failed`。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 关注流列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPostPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/bookmarks:
    get:
      tags: [Posts]
      summary: 我的收藏
      description: |
        按收藏时间倒序，游标由服务端签名并绑定当前查看者，换用户复用返回 400。
        只接受 `limit` 与 `cursor`，出现其他查询参数返回 400 `validation_failed`。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/BookmarkCursor'
      responses:
        '200':
          description: 收藏列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPostPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [Posts]
      summary: 帖子详情
      responses:
        '200':
          description: 帖子详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags: [Posts]
      summary: 编辑帖子
      description: |
        只有作者可以编辑，非作者返回 403。
        请求体是完整内容而非部分更新；内容未变化时不递增 `content_revision`、不产生事件。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '200':
          description: 更新后的帖子。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非作者编辑。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
