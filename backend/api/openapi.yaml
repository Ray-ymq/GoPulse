                author:
                  value:
                    error:
                      code: permission_denied
                      message: only the author may edit this post
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Posts]
      summary: 删除帖子
      description: |
        只有作者可以删除。删除在同一事务内级联删除评论、点赞与收藏，
        并把相关通知的关联资源置空，随后写入 `post.deleted` 事件；重复删除返回 404。
      responses:
        '204':
          description: 已删除。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非作者删除。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                author:
                  value:
                    error:
                      code: permission_denied
                      message: only the author may delete this post
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

