              examples:
                failed:
                  value:
                    error:
                      code: plugin_operation_failed
                      message: plugin operation failed
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/exporter-plugins/{pluginId}/start:
