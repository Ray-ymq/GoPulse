        '400':
          description: 上传形状不合法或包内容非法。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                package:
                  value:
                    error:
                      code: plugin_package_invalid
                      message: plugin package is invalid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
