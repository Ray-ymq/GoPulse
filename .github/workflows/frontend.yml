name: Frontend CI
on:
  push:
    branches: ['**']
    paths: ['frontend/web/**', 'docs/design/gopulse-uiux.html', 'deploy/docker/frontend.Dockerfile', 'deploy/docker/frontend/nginx.conf', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/web/**', 'docs/design/gopulse-uiux.html', 'deploy/docker/frontend.Dockerfile', 'deploy/docker/frontend/nginx.conf', '.github/workflows/frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Frontend check, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
