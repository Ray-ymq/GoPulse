name: Module CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      labels:
        description: 'CI labels separated by commas or spaces, e.g. ci:backend/business ci:backend/observability/marshaller; ci:none skips module jobs'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: module-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Select modules
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_modules: ${{ steps.plan.outputs.has_modules }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: tools/devtools/go.mod
          cache: false
      - name: Test CI tooling
        run: make ci-tools
      - name: Select modules for this event
        id: plan
        run: make ci-plan

  commits:
    name: Conventional Commits
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate new commits and PR description
        run: make check-commits

  check:
    name: Check (${{ matrix.module }})
    needs: plan
    if: needs.plan.outputs.has_modules == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.go_mod }}
          cache-dependency-path: |
            **/go.mod
            **/go.sum
      - name: Formatting, static analysis and lint
        env:
          MODULE: ${{ matrix.module }}
        run: make ci-check MODULE="$MODULE"

  build:
    name: Build (${{ matrix.module }})
    needs: plan
    if: needs.plan.outputs.has_modules == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.go_mod }}
          cache-dependency-path: |
            **/go.mod
            **/go.sum
      - name: Build module
        env:
          MODULE: ${{ matrix.module }}
        run: make ci-build MODULE="$MODULE"

  test:
    name: Test (${{ matrix.module }})
    needs: plan
    if: needs.plan.outputs.has_modules == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.go_mod }}
          cache-dependency-path: |
            **/go.mod
            **/go.sum
      - name: Install perflab Python dependencies
        if: matrix.module == 'tools/perflab'
        run: |
          python3 -m venv .run/ci/python
          .run/ci/python/bin/python -m pip install -r tools/perflab/requirements.txt
          echo "$GITHUB_WORKSPACE/.run/ci/python/bin" >> "$GITHUB_PATH"
      - name: Unit tests (Go includes race detection)
        env:
          MODULE: ${{ matrix.module }}
        run: make ci-test MODULE="$MODULE"

  result:
    name: CI result
    needs: [plan, commits, check, build, test]
    if: always() && (github.event_name != 'push' || github.event.deleted != true)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected job to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          COMMITS_RESULT: ${{ needs.commits.result }}
          HAS_MODULES: ${{ needs.plan.outputs.has_modules }}
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RESULT" == success ]]
          [[ "$COMMITS_RESULT" == success ]]
          case "$HAS_MODULES" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) echo 'Missing or invalid module selection' >&2; exit 1 ;;
          esac
          for result in "$CHECK_RESULT" "$BUILD_RESULT" "$TEST_RESULT"; do
            [[ "$result" == "$expected" ]] || { echo "Expected $expected, got $result" >&2; exit 1; }
          done
          echo 'All selected module checks passed.'

  auto_pr:
    name: Create pull request
    needs: result
    if: >-
      github.event_name == 'push' && github.event.deleted != true &&
      github.ref_type == 'branch' &&
      github.ref_name != github.event.repository.default_branch
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create or reuse pull request
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const {owner, repo} = context.repo;
            const base = context.payload.repository.default_branch;
            const branch = context.ref.replace(/^refs\/heads\//, '');
            if (context.eventName !== 'push' || context.payload.deleted ||
                !context.ref.startsWith('refs/heads/') || branch === base) {
              core.info('此事件不创建 PR。');
              return;
            }
            const findOpen = async () => {
              const {data} = await github.rest.pulls.list({
                owner, repo, state: 'open', head: `${owner}:${branch}`, base, per_page: 1,
              });
              return data[0];
            };
            const currentHead = async () => {
              try {
                const {data} = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
                return data.object.sha;
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            };
            if (await currentHead() !== context.sha) {
              core.info('分支已删除或已有新提交，跳过本次创建。');
              return;
            }
            const existing = await findOpen();
            if (existing) {
              core.info(`复用已有 PR：${existing.html_url}`);
              return;
            }
            const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${base}...${context.sha}`,
            });
            if (comparison.ahead_by === 0 || comparison.files.length === 0) {
              core.info('分支相对默认分支没有可合并的文件改动，跳过创建。');
              return;
            }
            const escape = value => value.replace(/([\\`*_[\]<>])/g, '\\$1');
            const subjects = comparison.commits.slice(-10).map(item =>
              `- ${escape(item.commit.message.split('\n')[0])}`);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              '## 背景',
              `将分支 ${escape(branch)} 的修改提交到 ${escape(base)}，供维护者评审。`,
              '',
              '## 改动',
              '具体差异见 Files changed。以下列出部分提交摘要，最多 10 项：',
              ...subjects,
              '',
              '## 验证',
              `本次 push 的 CI result 已通过：[运行记录](${runUrl})。`,
              '该记录只验证本次 push 选中的模块。请按整个 PR 的影响范围添加 `ci:<模块目录>` 标签；仅文档或前端改动可使用 `ci:none`。',
              '',
              '## 影响与风险',
              '尚未完成人工风险评估。维护者需核对兼容性、迁移及回滚要求，并按最终改动更新本说明。',
            ].join('\n');
            if (await currentHead() !== context.sha) {
              core.info('分支已删除或已有新提交，跳过本次创建。');
              return;
            }
            try {
              const {data: pr} = await github.rest.pulls.create({
                owner, repo, base, head: branch,
                title: `chore(repo): 合并 ${branch}`.slice(0, 240), body,
              });
              core.info(`已创建 PR：${pr.html_url}`);
            } catch (error) {
              if (error.status === 422) {
                const raced = await findOpen();
                if (raced) {
                  core.info(`复用并发创建的 PR：${raced.html_url}`);
                  return;
                }
              }
              if (error.status === 403) {
                core.error('创建 PR 被拒绝。请检查仓库 Settings → Actions → General 中的 Allow GitHub Actions to create and approve pull requests 设置及组织策略。');
              }
              throw error;
            }
