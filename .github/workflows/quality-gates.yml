name: Reusable Quality Gates

on:
  workflow_call:
    inputs:
      branch:
        description: Branch being validated
        required: true
        type: string
      base_ref:
        description: Git ref used to validate update branch scope
        required: true
        type: string

permissions:
  contents: read

jobs:
  governance:
    name: Branch governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test governance rules
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Validate version metadata
        run: python3 scripts/ci/validate_versions.py
      - name: Validate branch allocation and scope
        run: python3 scripts/ci/validate_branch.py --branch "${{ inputs.branch }}" --base-ref "${{ inputs.base_ref }}"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Race test
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  scripts-and-compose:
    name: Scripts and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify LF checkout and Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --eol -- 'scripts/*.sh' 'backend/**/*.go' | grep -Ev 'w/lf'; then
            echo 'Expected Bash and Go working-tree files to use LF.' >&2
            exit 1
          fi
          bash -n scripts/dev.sh scripts/down.sh scripts/verify.sh scripts/verify-business.sh
      - name: Run acceptance safety negative tests
        run: bash scripts/verify-business.sh --self-test
      - name: Validate Compose configuration and loopback publishing
        shell: bash
        run: |
          set -euo pipefail
          rendered="$(docker compose --env-file .env.example --file deploy/compose.yaml config)"
          printf '%s\n' "$rendered"
          [[ $(grep -c 'host_ip: 127.0.0.1' <<<"$rendered") -eq 5 ]]

  integration:
    name: Integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.0
        env:
          MYSQL_DATABASE: gopulse_integration
          MYSQL_USER: gopulse_integration
          MYSQL_PASSWORD: integration-mysql
          MYSQL_ROOT_PASSWORD: integration-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=integration-root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.2.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping | grep -q PONG || redis-cli --no-auth-warning -a integration-redis ping | grep -q PONG"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      rabbitmq:
        image: rabbitmq:3.13.3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: integration
          RABBITMQ_DEFAULT_PASS: integration
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.security.http.ssl.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl --fail --silent http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    env:
      INTEGRATION_TESTS: "1"
      APP_ENV: test
      HTTP_HOST: 127.0.0.1
      HTTP_PORT: "18080"
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: gopulse_integration
      MYSQL_USER: gopulse_integration
      MYSQL_PASSWORD: integration-mysql
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_PASSWORD: integration-redis
      REDIS_DB: "15"
      RABBITMQ_URL: amqp://integration:integration@127.0.0.1:5672/
      ELASTICSEARCH_URL: http://127.0.0.1:9200
      ELASTICSEARCH_REQUEST_TIMEOUT: 3s
      AUTH_JWT_SECRET: integration-jwt-secret-at-least-32-bytes-long
      AUTH_JWT_TTL: 2h
      AUTH_COOKIE_NAME: gopulse_integration_session
      AUTH_COOKIE_SECURE: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Require authentication on isolated Redis
        run: docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET requirepass "$REDIS_PASSWORD"
      - name: Apply upward migrations to isolated database
        run: go run ./cmd/migrate up
      - name: Run integration tests against required dependencies
        run: go test -count=1 -tags=integration ./...
