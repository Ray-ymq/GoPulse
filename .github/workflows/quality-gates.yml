name: Reusable Quality Gates

on:
  workflow_call:
    outputs:
      completion_ready:
        description: The branch has the target VERSION and its same-named completion log.
        value: ${{ jobs.governance.outputs.completion_ready }}
    inputs:
      branch:
        description: Branch being validated
        required: true
        type: string
      base_ref:
        description: Git ref used to validate update branch scope
        required: true
        type: string
      run_product_checks:
        description: Run Backend, Router, Marshaller, Monitor, Redis Exporter, Frontend, scripts/Compose, and Integration checks
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  governance:
    name: Branch governance
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.scope.outputs.checks }}
      completion_ready: ${{ steps.completion.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test governance rules
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Validate version metadata
        run: python3 scripts/ci/validate_versions.py
      - name: Validate branch allocation and scope
        run: python3 scripts/ci/validate_branch.py --branch "${{ inputs.branch }}" --base-ref "${{ inputs.base_ref }}" --mode development
      - name: Select checks from the common-ancestor diff
        id: scope
        run: python3 scripts/ci/quality_scope.py --base-ref "${{ inputs.base_ref }}" --format json --github-output "$GITHUB_OUTPUT"
      - name: Check completion metadata without blocking development branches
        id: completion
        shell: bash
        run: |
          set +e
          python3 scripts/ci/validate_branch.py --branch "${{ inputs.branch }}" --base-ref "${{ inputs.base_ref }}" --mode completion
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Completion metadata is not ready; product checks remain authoritative for this development push.'
          fi

  backend:
    name: Backend
    needs: governance
    if: inputs.run_product_checks && fromJSON(needs.governance.outputs.checks).backend == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Race test
        run: go test -race -count=1 ./...

  router:
    name: Message Router
    needs: governance
    if: inputs.run_product_checks && fromJSON(needs.governance.outputs.checks).router == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: router/go.mod
          cache-dependency-path: router/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l router)"
      - name: Test
        run: cd router && go test -count=1 ./...
      - name: Vet
        run: cd router && go vet ./...
      - name: Race test
        run: cd router && go test -race -count=1 ./...

  marshaller:
    name: Marshaller
    needs: governance
    if: inputs.run_product_checks && fromJSON(needs.governance.outputs.checks).marshaller == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: marshaller/go.mod
          cache-dependency-path: marshaller/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l marshaller)"
      - name: Test
        run: cd marshaller && go test -count=1 ./...
      - name: Vet
        run: cd marshaller && go vet ./...
      - name: Race test
        run: cd marshaller && go test -race -count=1 ./...

  monitor:
    name: Monitor
    needs: governance
    if: inputs.run_product_checks && fromJSON(needs.governance.outputs.checks).monitor == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: monitor/go.mod
          cache-dependency-path: monitor/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l monitor)"
      - name: Test
        run: cd monitor && go test -count=1 ./...
      - name: Vet
        run: cd monitor && go vet ./...
      - name: Race test
        run: cd monitor && go test -race -count=1 ./...

  redis-exporter:
    name: Redis Exporter
    needs: governance
    if: inputs.run_product_checks && fromJSON(needs.governance.outputs.checks).exporters_redis == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: exporters/redis/go.mod
          cache-dependency-path: exporters/redis/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l exporters/redis)"
      - name: Test
        run: cd exporters/redis && go test -count=1 ./...
      - name: Vet
        run: cd exporters/redis && go vet ./...
      - name: Race test
        run: cd exporters/redis && go test -race -count=1 ./...

  componentmetrics:
    name: Component metrics
    needs: governance
    if: fromJSON(needs.governance.outputs.checks).componentmetrics == true && inputs.run_product_checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: componentmetrics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: componentmetrics/go.mod
          cache-dependency-path: componentmetrics/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Race test
        run: go test -race -count=1 ./...

  mysql-exporter:
    name: MySQL Exporter
    needs: governance
    if: fromJSON(needs.governance.outputs.checks).exporters_mysql == true && inputs.run_product_checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exporters/mysql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: exporters/mysql/go.mod
          cache-dependency-path: exporters/mysql/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Race test
        run: go test -race -count=1 ./...

  rabbitmq-exporter:
    name: RabbitMQ Exporter
    needs: governance
    if: fromJSON(needs.governance.outputs.checks).exporters_rabbitmq == true && inputs.run_product_checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exporters/rabbitmq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: exporters/rabbitmq/go.mod
          cache-dependency-path: exporters/rabbitmq/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Race test
        run: go test -race -count=1 ./...

  elasticsearch-exporter:
    name: Elasticsearch Exporter
    needs: governance
    if: fromJSON(needs.governance.outputs.checks).exporters_elasticsearch == true && inputs.run_product_checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exporters/elasticsearch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: exporters/elasticsearch/go.mod
          cache-dependency-path: exporters/elasticsearch/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Race test
        run: go test -race -count=1 ./...

  kafka-exporter:
    name: Kafka Exporter
    needs: governance
    if: fromJSON(needs.governance.outputs.checks).exporters_kafka == true && inputs.run_product_checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exporters/kafka
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: exporters/kafka/go.mod
          cache-dependency-path: exporters/kafka/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Race test
        run: go test -race -count=1 ./...

  victoriametrics-exporter:
    name: VictoriaMetrics Exporter
    needs: governance
    if: fromJSON(needs.governance.outputs.checks).exporters_victoriametrics == true && inputs.run_product_checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exporters/victoriametrics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: exporters/victoriametrics/go.mod
          cache-dependency-path: exporters/victoriametrics/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Race test
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend (${{ matrix.app }})
    needs: governance
    strategy:
      matrix:
        app: [frontend]
    if: inputs.run_product_checks && fromJSON(needs.governance.outputs.checks).frontend == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  admin-frontend:
    name: Admin frontend
    needs: governance
    if: fromJSON(needs.governance.outputs.checks).admin_frontend == true && inputs.run_product_checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  compose-full-stack:
    name: Full-stack Compose acceptance
    needs: governance
    if: inputs.run_product_checks && fromJSON(needs.governance.outputs.checks).compose == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/compose-build-cache
      - name: Run the authoritative Phase 12 Compose closure
        run: scripts/verify-compose.sh

  scripts-and-compose:
    name: Scripts and Compose
    needs: governance
    if: inputs.run_product_checks && (fromJSON(needs.governance.outputs.checks).tools == true || fromJSON(needs.governance.outputs.checks).compose == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify LF checkout and Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --eol -- 'scripts/*.sh' 'backend/**/*.go' 'exporters/redis/**/*.go' 'monitor/**/*.go' 'router/**/*.go' 'marshaller/**/*.go' | grep -Ev 'w/lf'; then
            echo 'Expected Bash and Go working-tree files to use LF.' >&2
            exit 1
          fi
          bash -n scripts/dev.sh scripts/down.sh scripts/verify.sh scripts/verify-compose.sh scripts/verify-compose-observability.sh scripts/verify-business.sh scripts/verify-exporter.sh scripts/verify-monitor.sh scripts/verify-router.sh scripts/verify-marshaller.sh scripts/verify-logs.sh scripts/verify-events.sh scripts/verify-observability-ui.sh scripts/verify-admin-frontend.sh scripts/package-redis-exporter.sh scripts/start-development-batch.sh scripts/verify-plugin-state.sh scripts/verify-phase19-capacity.sh
      - name: Run acceptance safety negative tests
        run: |
          bash scripts/verify-compose.sh --self-test
          bash scripts/verify-business.sh --self-test
          bash scripts/verify-exporter.sh --self-test
          bash scripts/verify-monitor.sh --self-test
          bash scripts/verify-router.sh --self-test
          bash scripts/verify-marshaller.sh --self-test
          bash scripts/verify-logs.sh --self-test
          bash scripts/verify-events.sh --self-test
          bash scripts/verify-observability-ui.sh --self-test
          bash scripts/verify-phase19-capacity.sh --self-test
          bash scripts/verify-phase19-capacity.sh --calibration
      - name: Validate Compose configuration and loopback publishing
        shell: bash
        run: |
          set -euo pipefail
          rendered="$(docker compose --env-file .env.example --file deploy/compose.yaml config)"
          version="$(tr -d '[:space:]' < VERSION)"
          printf '%s\n' "$rendered"
          [[ $(grep -c 'host_ip: 127.0.0.1' <<<"$rendered") -eq 1 ]]
          for image in admin-frontend frontend backend business-worker search-indexer router marshaller monitor; do
            grep -q "image: gopulse/$image:$version" <<<"$rendered"
          done
          grep -q 'image: apache/kafka:4.3.1' <<<"$rendered"
          grep -q 'image: victoriametrics/victoria-metrics:v1.151.0' <<<"$rendered"
          grep -q 'condition: service_completed_successfully' <<<"$rendered"
          [[ $(grep -c 'internal: true' <<<"$rendered") -eq 2 ]]

  integration:
    name: Integration
    needs: governance
    if: inputs.run_product_checks && fromJSON(needs.governance.outputs.checks).integration_business == true
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.0
        env:
          MYSQL_DATABASE: gopulse_integration
          MYSQL_USER: gopulse_integration
          MYSQL_PASSWORD: integration-mysql
          MYSQL_ROOT_PASSWORD: integration-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=integration-root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.2.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping | grep -q PONG || redis-cli --no-auth-warning -a integration-redis ping | grep -q PONG"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      rabbitmq:
        image: rabbitmq:3.13.3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: integration
          RABBITMQ_DEFAULT_PASS: integration
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.security.http.ssl.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl --fail --silent http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    env:
      INTEGRATION_TESTS: "1"
      APP_ENV: test
      HTTP_HOST: 127.0.0.1
      HTTP_PORT: "18080"
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: gopulse_integration
      MYSQL_USER: gopulse_integration
      MYSQL_PASSWORD: integration-mysql
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_PASSWORD: integration-redis
      REDIS_DB: "15"
      RABBITMQ_URL: amqp://integration:integration@127.0.0.1:5672/
      ELASTICSEARCH_URL: http://127.0.0.1:9200
      ELASTICSEARCH_REQUEST_TIMEOUT: 3s
      AUTH_JWT_SECRET: integration-jwt-secret-at-least-32-bytes-long
      AUTH_JWT_TTL: 2h
      AUTH_COOKIE_NAME: gopulse_integration_session
      AUTH_COOKIE_SECURE: "false"
      MONITOR_API_TOKEN: integration-monitor-token-at-least-32-bytes
      BACKEND_VICTORIAMETRICS_PASSWORD: integration-victoriametrics-password-32-bytes
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Require authentication on isolated Redis
        run: docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET requirepass "$REDIS_PASSWORD"
      - name: Apply upward migrations to isolated database
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            if go run ./cmd/migrate up; then
              exit 0
            fi
            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "Database migration failed after $max_attempts attempts." >&2
              exit 1
            fi
            echo "Database migration attempt $attempt/$max_attempts failed while the isolated MySQL service was starting; retrying in 3s." >&2
            sleep 3
          done
      - name: Prepare search index
        run: go run ./cmd/search-reindex --if-missing
      - name: Run integration tests against required dependencies
        working-directory: .
        run: make integration SCOPE=business

  integration-observe:
    name: Native observability integration
    needs: governance
    if: fromJSON(needs.governance.outputs.checks).integration_observe == true && inputs.run_product_checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Prepare the fixed Linux Monitor input
        run: make monitor-image
      - name: Run native observability integration
        run: make integration SCOPE=observe

  e2e-business:
    name: Native business browser checks
    needs: governance
    if: fromJSON(needs.governance.outputs.checks).e2e_business == true && inputs.run_product_checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm exec -- playwright install --with-deps chromium
      - name: Preserve runner toolchain for native processes
        shell: bash
        run: |
          {
            printf 'PATH=%s\n' "$PATH"
            printf 'HOME=%s\n' "$HOME"
          } > "$RUNNER_TEMP/gopulse-e2e.env"
          echo "GOPULSE_ENV_FILE=$RUNNER_TEMP/gopulse-e2e.env" >> "$GITHUB_ENV"
      - name: Run native business browser checks
        run: make e2e SCOPE=business

  e2e-observe:
    name: Native observability browser checks
    needs: governance
    if: fromJSON(needs.governance.outputs.checks).e2e_observe == true && inputs.run_product_checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm exec -- playwright install --with-deps chromium
      - name: Preserve runner toolchain for native processes
        shell: bash
        run: |
          {
            printf 'PATH=%s\n' "$PATH"
            printf 'HOME=%s\n' "$HOME"
          } > "$RUNNER_TEMP/gopulse-e2e.env"
          echo "GOPULSE_ENV_FILE=$RUNNER_TEMP/gopulse-e2e.env" >> "$GITHUB_ENV"
      - name: Prepare the fixed Linux Monitor input
        run: make monitor-image
      - name: Run native observability browser checks
        run: make e2e SCOPE=observe
