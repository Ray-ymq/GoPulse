# Repository settings required:
# - Settings > Actions > General > Allow GitHub Actions to create and approve pull requests
# - Settings > General > Pull Requests > Allow auto-merge
# - Repository secret RAY_GITHUB_TOKEN must contain a fine-grained token owned by
#   Ray-ymq with Contents and Pull requests read/write access to this repository.
# - The push quality gates are authoritative; PR mutations fail closed unless the
#   configured token authenticates as Ray-ymq.

name: Auto PR and Merge

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-pr-merge-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_BRANCH: main

jobs:
  quality-gates:
    name: Quality gates before PR
    uses: ./.github/workflows/quality-gates.yml
    with:
      branch: ${{ github.ref_name }}
      base_ref: origin/main
      run_product_checks: ${{ github.ref_name != 'update' }}

  open-and-merge:
    if: github.actor == 'Ray-ymq'
    needs: quality-gates
    name: Open PR and enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pull request identity
        env:
          GH_TOKEN: ${{ secrets.RAY_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            echo 'RAY_GITHUB_TOKEN is not configured.' >&2
            exit 1
          fi

          login="$(gh api user --jq '.login')"
          if [[ "$login" != 'Ray-ymq' ]]; then
            printf 'RAY_GITHUB_TOKEN must authenticate as Ray-ymq; got %s.\n' "$login" >&2
            exit 1
          fi

      - name: Detect branch file changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE_BRANCH}"
          if git diff --quiet "origin/${BASE_BRANCH}...HEAD" --; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            printf '### Auto PR and Merge\n\nNo file changes relative to `%s`; skipping PR creation and merge.\n' \
              "$BASE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or find pull request
        if: steps.changes.outputs.has_changes == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RAY_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="$(
            gh pr list \
              --repo "$GH_REPO" \
              --base "$BASE_BRANCH" \
              --head "$HEAD_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -z "$pr_number" ]]; then
            title="$(
              gh api "repos/${GH_REPO}/commits/${HEAD_SHA}" \
                --jq '.commit.message | split("\n")[0]'
            )"
            body="$(
              printf '%s\n\n- Source: `%s`\n- Target: `%s`\n- Commit: `%s`\n- Quality gates: %s/%s/actions/runs/%s\n' \
                'Automatically created after the branch passed its authoritative push quality gates. The update branch runs governance checks only; development branches run the complete product quality suite.' \
                "$HEAD_BRANCH" \
                "$BASE_BRANCH" \
                "$HEAD_SHA" \
                "$GITHUB_SERVER_URL" \
                "$GITHUB_REPOSITORY" \
                "$GITHUB_RUN_ID"
            )"

            pr_url="$(
              gh pr create \
                --repo "$GH_REPO" \
                --base "$BASE_BRANCH" \
                --head "$HEAD_BRANCH" \
                --title "$title" \
                --body "$body"
            )"
            pr_number="$(
              gh pr view "$pr_url" \
                --repo "$GH_REPO" \
                --json number \
                --jq '.number'
            )"
            echo "Created PR #${pr_number}: ${pr_url}"
          else
            pr_url="${GITHUB_SERVER_URL}/${GH_REPO}/pull/${pr_number}"
            echo "Using existing PR #${pr_number}: ${pr_url}"
          fi

          {
            echo "number=${pr_number}"
            echo "url=${pr_url}"
          } >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.RAY_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$HEAD_BRANCH" == "update" ]]; then
            merge_strategy="merge"
            merge_args=(
              "$PR_NUMBER"
              --repo "$GH_REPO"
              --merge
              --match-head-commit "$HEAD_SHA"
            )
          else
            merge_strategy="squash"
            merge_args=(
              "$PR_NUMBER"
              --repo "$GH_REPO"
              --squash
              --delete-branch
              --match-head-commit "$HEAD_SHA"
            )
          fi

          max_attempts=20
          retry_delay_seconds=20
          auto_merge_attempts=0

          for attempt in $(seq 1 "$max_attempts"); do
            auto_merge_attempts="$attempt"

            set +e
            output="$(gh pr merge "${merge_args[@]}" --auto 2>&1)"
            status=$?
            set -e

            if [[ "$status" -eq 0 ]]; then
              if [[ -n "$output" ]]; then
                printf '%s\n' "$output"
              fi
              break
            fi

            if ! grep -Eiq 'unstable status|mergeable state.*unknown|still calculating|checks? (pending|in progress)' <<<"$output"; then
              printf '%s\n' "$output" >&2
              exit "$status"
            fi

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              printf '%s\n' "$output" >&2
              exit "$status"
            fi

            printf 'Auto-merge enable attempt %s/%s failed while GitHub is still stabilizing PR state; retrying in %ss.\n' \
              "$attempt" \
              "$max_attempts" \
              "$retry_delay_seconds"
            printf '%s\n' "$output"
            sleep "$retry_delay_seconds"
          done

          printf '### Auto PR and Merge\n\n- PR: %s\n- Strategy: %s\n- Mode: auto after authoritative push gates\n- Head commit: `%s`\n- Auto-merge enable attempts: %s\n' \
            "$PR_URL" \
            "$merge_strategy" \
            "$HEAD_SHA" \
            "$auto_merge_attempts" >> "$GITHUB_STEP_SUMMARY"
