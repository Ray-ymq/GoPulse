# Repository settings required:
# - Settings > Actions > General > Allow GitHub Actions to create and approve pull requests
# - Settings > General > Pull Requests > Allow auto-merge
# - Protect main and require the CI / quality-gates checks for defense in depth

name: Auto PR and Merge

on:
  push:
    branches-ignore:
      - main

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: auto-pr-merge-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_BRANCH: main

jobs:
  quality-gates:
    name: Quality gates before PR
    uses: ./.github/workflows/quality-gates.yml
    with:
      branch: ${{ github.ref_name }}
      base_ref: origin/main

  open-and-merge:
    if: github.actor == 'Ray-ymq'
    needs: quality-gates
    name: Open PR, wait for CI, and enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect branch file changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE_BRANCH}"
          if git diff --quiet "origin/${BASE_BRANCH}...HEAD" --; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            printf '### Auto PR and Merge\n\nNo file changes relative to `%s`; skipping PR creation and merge.\n' \
              "$BASE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or find pull request
        if: steps.changes.outputs.has_changes == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="$(
            gh pr list \
              --repo "$GH_REPO" \
              --base "$BASE_BRANCH" \
              --head "$HEAD_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -z "$pr_number" ]]; then
            title="$(
              gh api "repos/${GH_REPO}/commits/${HEAD_SHA}" \
                --jq '.commit.message | split("\n")[0]'
            )"
            body="$(
              printf '%s\n\n- Source: `%s`\n- Target: `%s`\n- Commit: `%s`\n- Quality gates: %s/%s/actions/runs/%s\n' \
                'Automatically created after the branch passed the repository quality and governance gates. Merge is enabled only after this PR's own CI run succeeds, so protected-branch requirements remain authoritative.' \
                "$HEAD_BRANCH" \
                "$BASE_BRANCH" \
                "$HEAD_SHA" \
                "$GITHUB_SERVER_URL" \
                "$GITHUB_REPOSITORY" \
                "$GITHUB_RUN_ID"
            )"

            pr_url="$(
              gh pr create \
                --repo "$GH_REPO" \
                --base "$BASE_BRANCH" \
                --head "$HEAD_BRANCH" \
                --title "$title" \
                --body "$body"
            )"
            pr_number="$(
              gh pr view "$pr_url" \
                --repo "$GH_REPO" \
                --json number \
                --jq '.number'
            )"
            echo "Created PR #${pr_number}: ${pr_url}"
          else
            pr_url="${GITHUB_SERVER_URL}/${GH_REPO}/pull/${pr_number}"
            echo "Using existing PR #${pr_number}: ${pr_url}"
          fi

          {
            echo "number=${pr_number}"
            echo "url=${pr_url}"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for pull-request CI
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          PR_URL: ${{ steps.pr.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          ci_run_id=""
          ci_run_url=""
          max_attempts=30
          retry_delay_seconds=5

          for attempt in $(seq 1 "$max_attempts"); do
            run_json="$(
              gh run list \
                --repo "$GH_REPO" \
                --workflow ci.yml \
                --event pull_request \
                --commit "$HEAD_SHA" \
                --limit 1 \
                --json databaseId,url
            )"
            ci_run_id="$(jq -r '.[0].databaseId // empty' <<<"$run_json")"
            ci_run_url="$(jq -r '.[0].url // empty' <<<"$run_json")"
            if [[ -n "$ci_run_id" ]]; then
              break
            fi
            if [[ "$attempt" -eq "$max_attempts" ]]; then
              printf 'No pull-request CI run appeared for %s at %s.\n' "$PR_URL" "$HEAD_SHA" >&2
              exit 1
            fi
            printf 'Waiting for pull-request CI run for %s (%s/%s).\n' "$HEAD_SHA" "$attempt" "$max_attempts"
            sleep "$retry_delay_seconds"
          done

          printf 'Waiting for pull-request CI run %s: %s\n' "$ci_run_id" "$ci_run_url"
          gh run watch "$ci_run_id" --repo "$GH_REPO" --interval 10 --exit-status

      - name: Enable auto-merge
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$HEAD_BRANCH" == "update" ]]; then
            merge_strategy="merge"
            merge_args=(
              "$PR_NUMBER"
              --repo "$GH_REPO"
              --merge
              --match-head-commit "$HEAD_SHA"
            )
          else
            merge_strategy="squash"
            merge_args=(
              "$PR_NUMBER"
              --repo "$GH_REPO"
              --squash
              --delete-branch
              --match-head-commit "$HEAD_SHA"
            )
          fi

          max_attempts=20
          retry_delay_seconds=20
          auto_merge_attempts=0

          for attempt in $(seq 1 "$max_attempts"); do
            auto_merge_attempts="$attempt"

            set +e
            output="$(gh pr merge "${merge_args[@]}" --auto 2>&1)"
            status=$?
            set -e

            if [[ "$status" -eq 0 ]]; then
              if [[ -n "$output" ]]; then
                printf '%s\n' "$output"
              fi
              break
            fi

            if ! grep -Eiq 'unstable status|mergeable state.*unknown|still calculating|checks? (pending|in progress)' <<<"$output"; then
              printf '%s\n' "$output" >&2
              exit "$status"
            fi

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              printf '%s\n' "$output" >&2
              exit "$status"
            fi

            printf 'Auto-merge enable attempt %s/%s failed while GitHub is still stabilizing PR state; retrying in %ss.\n' \
              "$attempt" \
              "$max_attempts" \
              "$retry_delay_seconds"
            printf '%s\n' "$output"
            sleep "$retry_delay_seconds"
          done

          printf '### Auto PR and Merge\n\n- PR: %s\n- Strategy: %s\n- Mode: auto after push gates and pull-request CI\n- Head commit: `%s`\n- Auto-merge enable attempts: %s\n' \
            "$PR_URL" \
            "$merge_strategy" \
            "$HEAD_SHA" \
            "$auto_merge_attempts" >> "$GITHUB_STEP_SUMMARY"
