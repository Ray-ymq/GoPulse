# Repository secret required:
# - RAY_GITHUB_TOKEN must contain a fine-grained token owned by
#   Ray-ymq with Contents and Pull requests read/write access to this repository.
# - The push quality gates are authoritative; PR mutations fail closed unless the
#   pusher, rerun actor, PR author, and configured token all belong to Ray-ymq.

name: Auto PR and Merge

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: auto-pr-merge-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_BRANCH: main

jobs:
  quality-gates:
    name: Quality gates before PR
    uses: ./.github/workflows/quality-gates.yml
    with:
      base_ref: origin/main
      run_product_checks: true

  open-and-merge:
    if: github.actor_id == '195848614' && github.actor == 'Ray-ymq' && github.triggering_actor == 'Ray-ymq' && needs.quality-gates.result == 'success'
    needs: quality-gates
    name: Open PR and merge
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pull request identity
        env:
          GH_TOKEN: ${{ secrets.RAY_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_ACTOR_ID" != '195848614' || "$GITHUB_ACTOR" != 'Ray-ymq' || "$GITHUB_TRIGGERING_ACTOR" != 'Ray-ymq' ]]; then
            echo 'Only Ray-ymq may initiate or rerun automatic PR mutations.' >&2
            exit 1
          fi

          if [[ -z "$GH_TOKEN" ]]; then
            echo 'RAY_GITHUB_TOKEN is not configured.' >&2
            exit 1
          fi

          login="$(gh api user --jq '.login')"
          if [[ "$login" != 'Ray-ymq' ]]; then
            printf 'RAY_GITHUB_TOKEN must authenticate as Ray-ymq; got %s.\n' "$login" >&2
            exit 1
          fi

          user_id="$(gh api user --jq '.id')"
          if [[ "$user_id" != '195848614' ]]; then
            echo 'RAY_GITHUB_TOKEN must belong to the configured Ray-ymq account ID.' >&2
            exit 1
          fi

      - name: Detect branch file changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE_BRANCH}"
          if git diff --quiet "origin/${BASE_BRANCH}...HEAD" --; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            printf '### Auto PR and Merge\n\nNo file changes relative to `%s`; skipping PR creation and merge.\n' \
              "$BASE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or find pull request
        if: steps.changes.outputs.has_changes == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RAY_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_OWNER: ${{ github.repository_owner }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="$(
            gh api \
              --method GET \
              "repos/${GH_REPO}/pulls" \
              -f state=open \
              -f base="$BASE_BRANCH" \
              -f head="${HEAD_OWNER}:${HEAD_BRANCH}" \
              --jq '.[0].number // empty'
          )"

          if [[ -z "$pr_number" ]]; then
            title="$(
              gh api "repos/${GH_REPO}/commits/${HEAD_SHA}" \
                --jq '.commit.message | split("\n")[0]'
            )"
            body="$(
              printf '%s\n\n- Source: `%s`\n- Target: `%s`\n- Commit: `%s`\n- Quality gates: %s/%s/actions/runs/%s\n' \
                'Automatically created for Ray-ymq after the branch passed its authoritative push quality gates. All branches select product checks from their changed files; documentation-only changes skip product checks.' \
                "$HEAD_BRANCH" \
                "$BASE_BRANCH" \
                "$HEAD_SHA" \
                "$GITHUB_SERVER_URL" \
                "$GITHUB_REPOSITORY" \
                "$GITHUB_RUN_ID"
            )"

            pr_number="$(
              gh api \
                --method POST \
                "repos/${GH_REPO}/pulls" \
                -f base="$BASE_BRANCH" \
                -f head="${HEAD_OWNER}:${HEAD_BRANCH}" \
                -f title="$title" \
                -f body="$body" \
                --jq '.number'
            )"
            pr_url="${GITHUB_SERVER_URL}/${GH_REPO}/pull/${pr_number}"
            echo "Created PR #${pr_number}: ${pr_url}"
          else
            pr_url="${GITHUB_SERVER_URL}/${GH_REPO}/pull/${pr_number}"
            echo "Using existing PR #${pr_number}: ${pr_url}"
          fi

          {
            echo "number=${pr_number}"
            echo "url=${pr_url}"
          } >> "$GITHUB_OUTPUT"

      - name: Merge pull request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.RAY_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          pr="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")"
          if ! jq -e \
            --arg repository "$GH_REPO" \
            --arg head "$HEAD_BRANCH" \
            --arg base "$BASE_BRANCH" \
            --arg revision "$HEAD_SHA" \
            '.user.login == "Ray-ymq" and .user.id == 195848614
             and .state == "open" and .draft == false
             and .head.repo.full_name == $repository and .head.ref == $head and .head.sha == $revision
             and .base.repo.full_name == $repository and .base.ref == $base' \
            >/dev/null <<<"$pr"; then
            echo 'Automatic merge requires a non-draft Ray-ymq PR with the verified repository, branches, and head revision.' >&2
            exit 1
          fi

          if [[ "$HEAD_BRANCH" == "update" ]]; then
            merge_strategy="merge"
          else
            merge_strategy="squash"
          fi

          max_attempts=20
          retry_delay_seconds=20
          merge_attempts=0

          for attempt in $(seq 1 "$max_attempts"); do
            merge_attempts="$attempt"

            set +e
            output="$(
              gh api \
                --method PUT \
                "repos/${GH_REPO}/pulls/${PR_NUMBER}/merge" \
                -f merge_method="$merge_strategy" \
                -f sha="$HEAD_SHA" \
                2>&1
            )"
            status=$?
            set -e

            if [[ "$status" -eq 0 ]] && jq -e '.merged == true' >/dev/null <<<"$output"; then
              if [[ -n "$output" ]]; then
                printf '%s\n' "$output"
              fi
              break
            fi

            if [[ "$status" -eq 0 ]]; then
              status=1
            fi

            if ! grep -Eiq 'not mergeable|mergeable state.*unknown|still calculating|base branch was modified|checks? (pending|in progress)' <<<"$output"; then
              printf '%s\n' "$output" >&2
              exit "$status"
            fi

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              printf '%s\n' "$output" >&2
              exit "$status"
            fi

            printf 'Merge attempt %s/%s failed while GitHub is still stabilizing PR state; retrying in %ss.\n' \
              "$attempt" \
              "$max_attempts" \
              "$retry_delay_seconds"
            printf '%s\n' "$output"
            sleep "$retry_delay_seconds"
          done

          if [[ "$HEAD_BRANCH" != "update" ]]; then
            gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${HEAD_BRANCH}"
          fi

          printf '### Auto PR and Merge\n\n- PR: %s\n- Strategy: %s\n- Mode: REST merge after authoritative push gates\n- Head commit: `%s`\n- Merge attempts: %s\n' \
            "$PR_URL" \
            "$merge_strategy" \
            "$HEAD_SHA" \
            "$merge_attempts" >> "$GITHUB_STEP_SUMMARY"
