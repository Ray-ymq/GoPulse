name: Immutable release candidate

# No PR trigger and no package-write permission. External registry identity and
# final release are deliberately deferred to Phase-16-06.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/develop/')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate trusted source branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          [[ "$BRANCH" == main || "$BRANCH" =~ ^develop/[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      # The runner's default docker driver cannot build multi-platform images;
      # the delivery chain needs the container driver setup below.
      - uses: docker/setup-buildx-action@v3
      # One entry point owns the whole chain: it starts and removes its own
      # loopback registry, verifies the real amd64 runtime, records the arm64
      # metadata-only receipt and promotes the same digests.
      - name: Build, verify and promote the candidate
        run: make package PLATFORM=linux/amd64,linux/arm64 RUNTIME=1 PROMOTE=1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: local-candidate-evidence
          path: |
            dist/release-manifest.json
            dist/gopulse-*-bundle.tar.gz*
            dist/verification-*.json
          retention-days: 14
