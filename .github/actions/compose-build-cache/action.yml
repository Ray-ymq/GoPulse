name: Compose build cache
description: Warm existing Compose targets and reuse their layers in the authoritative acceptance builder
runs:
  using: composite
  steps:
    - uses: docker/setup-compose-action@v2
      with:
        version: v5.3.0
    - uses: docker/setup-buildx-action@v3
      id: builder
      continue-on-error: true
      with:
        driver: docker-container
        driver-opts: default-load=true
    - name: Select the shared acceptance builder
      shell: bash
      env:
        BUILDER_OUTCOME: ${{ steps.builder.outcome }}
        BUILDER_NAME: ${{ steps.builder.outputs.name }}
      run: |
        if [[ "$BUILDER_OUTCOME" == success ]]; then
          printf 'BUILDX_BUILDER=%s\nCOMPOSE_BAKE=true\n' "$BUILDER_NAME" >> "$GITHUB_ENV"
        else
          printf 'BUILDX_BUILDER=default\nCOMPOSE_BAKE=false\n' >> "$GITHUB_ENV"
          echo 'Buildx cache setup unavailable; acceptance will use its normal Compose build.'
        fi
    - name: Expose the GitHub cache runtime
      if: steps.builder.outcome == 'success'
      continue-on-error: true
      uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
    - name: Restore and save main cache mounts
      if: steps.builder.outcome == 'success' && github.ref == 'refs/heads/main'
      id: main-mounts
      continue-on-error: true
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/gopulse-buildkit-mounts
        key: buildkit-mounts-Linux-amd64-v1-${{ hashFiles('deploy/docker/*.Dockerfile', '**/go.sum', 'frontend/package-lock.json', 'admin-frontend/package-lock.json') }}-${{ github.sha }}
        restore-keys: |
          buildkit-mounts-Linux-amd64-v1-${{ hashFiles('deploy/docker/*.Dockerfile', '**/go.sum', 'frontend/package-lock.json', 'admin-frontend/package-lock.json') }}-
    - name: Restore main cache mounts for development
      if: steps.builder.outcome == 'success' && github.ref != 'refs/heads/main'
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/gopulse-buildkit-mounts
        key: buildkit-mounts-Linux-amd64-v1-${{ hashFiles('deploy/docker/*.Dockerfile', '**/go.sum', 'frontend/package-lock.json', 'admin-frontend/package-lock.json') }}-${{ github.sha }}
        restore-keys: |
          buildkit-mounts-Linux-amd64-v1-${{ hashFiles('deploy/docker/*.Dockerfile', '**/go.sum', 'frontend/package-lock.json', 'admin-frontend/package-lock.json') }}-
    - name: Inject Go and npm build caches
      if: steps.builder.outcome == 'success'
      continue-on-error: true
      uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3
      with:
        builder: ${{ steps.builder.outputs.name }}
        scratch-dir: ${{ runner.temp }}/gopulse-cache-dance
        skip-extraction: ${{ github.ref != 'refs/heads/main' || steps.main-mounts.outputs.cache-hit == 'true' }}
        cache-map: |
          {
            "${{ runner.temp }}/gopulse-buildkit-mounts/go-mod": "/go/pkg/mod",
            "${{ runner.temp }}/gopulse-buildkit-mounts/go-build": "/root/.cache/go-build",
            "${{ runner.temp }}/gopulse-buildkit-mounts/npm": "/root/.npm"
          }
    - name: Build Compose images with optional remote caches
      if: steps.builder.outcome == 'success'
      shell: bash
      run: python3 scripts/ci/compose_build_cache.py
